<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Graph Shop</title>
<script>
  /* Apply the saved theme before first paint (UI preference only). */
  try { var t = localStorage.getItem('gf.theme'); if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t); } catch (e) {}
</script>
<style>
:root {
  --bg: #f4f5f7; --surface: #fff; --surface-2: #fafbfc; --surface-sunk: #eef0f3;
  --border: #d6dae0; --border-strong: #b9c0c9;
  --ink: #1c2330; --ink-2: #4a5568; --ink-dim: #7a8798;
  --accent: #10796b; --accent-soft: #e2f2ef; --accent-ink: #0b5a4f;
  --warn: #a86a10; --warn-soft: #fbf0dc; --danger: #b3323f; --danger-soft: #f9e3e5; --info: #2c5f9e; --info-soft: #e3ecf7;
  --k-class: #2f6fb0; --k-objectProperty: #8a5cc2; --k-datatypeProperty: #b0731f; --k-rule: #2e8b57; --k-mapping: #c2185b;
  --shadow: 0 8px 28px rgba(20, 30, 45, 0.14);
  --mono: ui-monospace, "Cascadia Mono", "Cascadia Code", Consolas, monospace;
  --sans: "Segoe UI", system-ui, -apple-system, sans-serif;
  --r: 6px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #10151c; --surface: #151c26; --surface-2: #1a2230; --surface-sunk: #0d1218;
    --border: rgba(159, 177, 204, 0.16); --border-strong: rgba(159, 177, 204, 0.32);
    --ink: #edf3ff; --ink-2: #c3cddc; --ink-dim: #99a7bc;
    --accent: #37c6a3; --accent-soft: rgba(55, 198, 163, 0.14); --accent-ink: #7fe0c6;
    --warn: #e8a240; --warn-soft: rgba(232, 162, 64, 0.14); --danger: #ff6b7a; --danger-soft: rgba(255, 107, 122, 0.12); --info: #7dc8ff; --info-soft: rgba(125, 200, 255, 0.12);
    --k-class: #6ea8e6; --k-objectProperty: #b892e8; --k-datatypeProperty: #e0a85a; --k-rule: #5cc48a; --k-mapping: #ef6a9c;
    --shadow: 0 12px 36px rgba(0, 0, 0, 0.45);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #10151c; --surface: #151c26; --surface-2: #1a2230; --surface-sunk: #0d1218;
  --border: rgba(159, 177, 204, 0.16); --border-strong: rgba(159, 177, 204, 0.32);
  --ink: #edf3ff; --ink-2: #c3cddc; --ink-dim: #99a7bc;
  --accent: #37c6a3; --accent-soft: rgba(55, 198, 163, 0.14); --accent-ink: #7fe0c6;
  --warn: #e8a240; --warn-soft: rgba(232, 162, 64, 0.14); --danger: #ff6b7a; --danger-soft: rgba(255, 107, 122, 0.12); --info: #7dc8ff; --info-soft: rgba(125, 200, 255, 0.12);
  --k-class: #6ea8e6; --k-objectProperty: #b892e8; --k-datatypeProperty: #e0a85a; --k-rule: #5cc48a; --k-mapping: #ef6a9c;
  --shadow: 0 12px 36px rgba(0, 0, 0, 0.45);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font: 14px/1.45 var(--sans); }
a { color: var(--info); text-decoration: none; cursor: pointer; }
a:hover { text-decoration: underline; }
button { font: inherit; color: inherit; cursor: pointer; border: 1px solid var(--border); background: var(--surface); border-radius: 4px; padding: 5px 10px; }
button:hover:not(:disabled) { border-color: var(--border-strong); background: var(--surface-2); }
button:disabled { opacity: .5; cursor: not-allowed; }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
:root[data-theme="dark"] button.primary { color: #062a22; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) button.primary { color: #062a22; } }
button.primary:hover:not(:disabled) { background: var(--accent-ink); border-color: var(--accent-ink); }
button.ghost { background: transparent; border-color: transparent; }
button.ghost:hover:not(:disabled) { background: var(--surface-sunk); }
button.small { padding: 2px 8px; font-size: 12px; }
input, select, textarea { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--border-strong); border-radius: 4px; padding: 6px 8px; }
input:focus, select:focus, textarea:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
code, pre, .mono { font-family: var(--mono); font-size: 12.5px; }
pre.code { background: var(--surface-sunk); border: 1px solid var(--border); border-radius: var(--r); padding: 10px 12px; overflow: auto; max-height: 460px; margin: 0; white-space: pre; line-height: 1.5; }
.muted { color: var(--ink-2); } .dim { color: var(--ink-dim); } .small { font-size: 12px; }
.row { display: flex; align-items: center; gap: 8px; } .wrap { flex-wrap: wrap; } .grow { flex: 1; min-width: 0; }
.spacer { flex: 1; }
h1, h2, h3 { margin: 0; line-height: 1.25; }
h2.sec { font-size: 15px; margin: 22px 0 10px; display: flex; align-items: center; gap: 8px; }
h2.sec .n { color: var(--ink-dim); font-weight: 400; }

/* ---------- app frame ---------- */
#app { display: grid; grid-template-rows: auto auto auto 1fr auto auto; height: 100vh; }
/* Sample data: a note under the header while the invented sample models are shown, and a tag that reopens it. */
.samplenote { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 7px 16px; background: var(--surface-sunk); border-bottom: 1px solid var(--border); font-size: 13px; color: var(--ink-2); position: relative; z-index: 4; }
.samplenote:empty { display: block; padding: 0; border: 0; }
.samplenote .sn-b { font-weight: 600; color: var(--ink); white-space: nowrap; }
.samplenote .grow { flex: 1 1 280px; min-width: 0; }
.samplenote [data-closenote] { margin-left: auto; }
.samplenote button { padding: 3px 10px; font-size: 12.5px; }
.sampletag { border: 1px dashed var(--border); background: none; color: var(--ink-2); font-size: 12px; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
.sampletag[hidden] { display: none; }
.topbar { display: flex; align-items: center; gap: 12px; padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--border); position: relative; z-index: 5; }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 16px; border: 0; background: none; padding: 4px 6px; white-space: nowrap; }
.brand .logo { width: 26px; height: 26px; border-radius: 7px; background: var(--accent); display: inline-grid; place-items: center; color: #fff; font-size: 14px; }
.searchwrap { flex: 1 1 320px; max-width: 640px; position: relative; }
.tbspacer { flex: 1 1 0; }
.tbnav { display: flex; gap: 2px; }
/* browse tabs under the search box; an empty bar takes no room */
.navtabs { display: flex; align-items: stretch; gap: 2px; padding: 0 16px; background: var(--surface); border-bottom: 1px solid var(--border); overflow-x: auto; scrollbar-width: none; position: relative; z-index: 4; }
.navtabs:empty { border: 0; padding: 0; }
.navtabs button { border: 0; border-bottom: 2px solid transparent; border-radius: 0; background: none; padding: 8px 12px 7px; color: var(--ink-2); white-space: nowrap; font-size: 13.5px; flex: none; }
.navtabs button .n { color: var(--ink-dim); margin-left: 6px; font-size: 12px; font-variant-numeric: tabular-nums; }
.navtabs button.on { border-bottom-color: var(--accent); color: var(--ink); font-weight: 600; }
.navtabs button.on .n { color: var(--ink-2); }
.navtabs button:hover:not(.on) { background: var(--surface-sunk); }
.navtabs .gap { width: 1px; background: var(--border); margin: 9px 6px; flex: none; }
/* data tables: one row per thing, the name first, numbers right-aligned */
.tablewrap { overflow-x: auto; }
table.dtable { width: 100%; border-collapse: separate; border-spacing: 0; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); font-size: 13px; }
table.dtable th { position: sticky; top: 0; z-index: 1; text-align: left; background: var(--surface-2); color: var(--ink-2); font-weight: 600; font-size: 12px; padding: 7px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; }
table.dtable th:first-child { border-top-left-radius: var(--r); } table.dtable th:last-child { border-top-right-radius: var(--r); }
table.dtable td { padding: 6px 10px; border-bottom: 1px solid var(--border); vertical-align: middle; }
table.dtable tbody tr:last-child td { border-bottom: 0; }
table.dtable tbody tr[data-open], table.dtable tbody tr[data-model], table.dtable tbody tr[data-go] { cursor: pointer; }
table.dtable tbody tr:hover td { background: var(--surface-2); }
table.dtable .num { text-align: right; font-variant-numeric: tabular-nums; width: 1%; white-space: nowrap; }
table.dtable td.nm { font-weight: 600; min-width: 150px; }
table.dtable td.nm .d { display: block; font-weight: 400; font-size: 12px; color: var(--ink-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 480px; }
table.dtable td.act { width: 1%; white-space: nowrap; text-align: right; }
table.dtable td.clip { max-width: 280px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
table.dtable td.zero, table.dtable .zero { color: var(--ink-dim); }
table.dtable tr.smsrow td { background: var(--surface-sunk); padding: 8px 10px 10px; }
table.dtable tr.smsrow:hover td { background: var(--surface-sunk); }
table.dtable tr.smsrow pre.code { max-width: min(1100px, calc(100vw - 96px)); } /* a long line scrolls inside, not the table */
.ref { display: inline-block; padding: 0 6px; margin: 1px 3px 1px 0; border-radius: 3px; background: var(--surface-sunk); border: 1px solid var(--border); font-size: 12px; font-weight: 400; color: var(--ink); white-space: nowrap; cursor: pointer; }
.ref:hover { border-color: var(--border-strong); }
.swb { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 7px; vertical-align: -1px; }
.pagehead { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 4px; }
.pagehead h1 { font-size: 23px; }
.facts { display: flex; flex-wrap: wrap; gap: 4px 18px; font-size: 13px; color: var(--ink-2); margin: 4px 0 14px; }
.facts b { color: var(--ink); font-weight: 600; }
/* mapping diagram: source tables left, the model right, one line per column */
.flowwrap { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); overflow-x: auto; padding: 12px 8px; }
svg.flow { display: block; margin: 0 auto; }
svg.flow text { font: 12px var(--sans); fill: var(--ink); }
svg.flow text.col { font: 12px var(--mono); }
svg.flow text.hd { font-weight: 600; font-size: 12.5px; }
svg.flow text.sub, svg.flow text.role { font-size: 10.5px; fill: var(--ink-dim); }
svg.flow text.off { fill: var(--ink-dim); font-style: italic; }
svg.flow text.focus { font-weight: 600; }
svg.flow rect.box { fill: var(--surface); stroke: var(--border-strong); stroke-width: 1.2; }
svg.flow rect.head { fill: var(--surface-2); }
svg.flow .cls rect.box { stroke: var(--k-class); stroke-width: 1.6; }
svg.flow .cls.isfocus rect.box { stroke-width: 2.6; }
svg.flow [data-open], svg.flow [data-go] { cursor: pointer; }
svg.flow .rowhit { fill: transparent; }
svg.flow .rowhit:hover { fill: var(--surface-sunk); }
svg.flow .ln { fill: none; stroke-width: 1.7; opacity: .8; transition: opacity .12s; }
svg.flow .ln.weak { opacity: .4; }
svg.flow.hl .ln { opacity: .08; }
svg.flow.hl .ln.on { opacity: 1; stroke-width: 2.4; }
svg.flow circle.end { stroke: none; }
.connbtn { display: inline-flex; align-items: center; gap: 6px; }
.tbsep { width: 1px; height: 22px; background: var(--border); }
.searchwrap input { width: 100%; padding: 9px 12px 9px 34px; border-radius: 20px; background: var(--surface-2); }
.searchwrap::before { content: "⌕"; position: absolute; left: 12px; top: 50%; transform: translateY(-52%); color: var(--ink-dim); font-size: 17px; }
.searchwrap kbd { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); font: 11px var(--mono); color: var(--ink-dim); border: 1px solid var(--border); border-radius: 3px; padding: 0 5px; }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--border); border-radius: 12px; padding: 2px 10px; font-size: 12px; color: var(--ink-2); background: var(--surface-2); white-space: nowrap; }
.chip .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--warn); }
.chip.live .dot { background: var(--accent); }
.icon { width: 32px; height: 32px; padding: 0; border-radius: 50%; display: inline-grid; place-items: center; }
.cartbtn { display: flex; align-items: center; gap: 8px; border-radius: 18px; padding: 6px 14px; font-weight: 600; position: relative; }
.cartbtn .count { background: var(--accent); color: #fff; border-radius: 10px; min-width: 20px; padding: 0 6px; font-size: 12px; text-align: center; }
.cartbtn .alert { position: absolute; top: -4px; right: -4px; width: 12px; height: 12px; border-radius: 50%; background: var(--warn); border: 2px solid var(--surface); }
#main { overflow: auto; min-height: 0; }
.page { max-width: 1240px; margin: 0 auto; padding: 18px 20px 40px; }

/* ---------- badges / pills ---------- */
.kb { display: inline-grid; place-items: center; min-width: 22px; height: 22px; padding: 0 4px; border-radius: 5px; font: 700 11px var(--mono); color: #fff; flex: none; }
.kb.class { background: var(--k-class); } .kb.objectProperty { background: var(--k-objectProperty); } .kb.datatypeProperty { background: var(--k-datatypeProperty); }
.kb.rule { background: var(--k-rule); } .kb.mapping { background: var(--k-mapping); }
:root[data-theme="dark"] .kb { color: #0d1218; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .kb { color: #0d1218; } }
.pill { display: inline-flex; align-items: center; gap: 4px; border-radius: 10px; padding: 0 8px; font-size: 11.5px; border: 1px solid var(--border-strong); color: var(--ink-2); white-space: nowrap; line-height: 18px; }
.st-Published { border-color: var(--accent); color: var(--accent-ink); background: var(--accent-soft); }
.st-InReview { border-color: var(--info); color: var(--info); background: var(--info-soft); }
.st-Draft { border-style: dashed; }
.st-Deprecated { border-color: var(--danger); color: var(--danger); background: var(--danger-soft); text-decoration: line-through; }
.cv-mapped, .cv-inferred, .cv-viaSub { border-color: var(--accent); color: var(--accent-ink); background: var(--accent-soft); }
.cv-inferred, .cv-viaSub { border-style: dashed; }
.cv-available { border-color: var(--warn); color: var(--warn); background: var(--warn-soft); }
.cv-none { border-color: var(--danger); color: var(--danger); background: var(--danger-soft); }
.ver { font: 11.5px var(--mono); color: var(--ink-dim); }

/* ---------- home ---------- */
.hero { padding: 0 0 4px; }
.hero h1 { font-size: 26px; }
.hero p { color: var(--ink-2); margin: 4px 0 0; max-width: 760px; }
.quick { display: flex; gap: 6px; flex-wrap: wrap; }
.quick button { border-radius: 14px; font-size: 12.5px; }

/* ---------- search ---------- */
.searchlayout { display: grid; grid-template-columns: 230px 1fr; gap: 20px; }
.facets { position: sticky; top: 0; align-self: start; }
.facet { margin-bottom: 16px; }
.facetsum { display: none; cursor: pointer; font-weight: 600; padding: 4px 0 8px; }
.facet h4 { margin: 0 0 6px; font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-dim); }
.facet label { display: flex; align-items: center; gap: 6px; padding: 2px 0; font-size: 13px; cursor: pointer; }
.facet label .n { margin-left: auto; color: var(--ink-dim); font-size: 12px; }
.facet label.zero { color: var(--ink-dim); }
.reshead { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
.addbtn.in { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-ink); }
.mini { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border: 1px solid var(--border); border-radius: 5px; background: var(--surface); min-width: 0; }
.mini .lbl { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; }
.mini .lbl:hover { text-decoration: underline; }
.mini .sub { font-size: 11.5px; color: var(--ink-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mini .txt { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.mini.ghost { border-style: dashed; }
.empty { text-align: center; color: var(--ink-2); padding: 40px 10px; }

/* ---------- item / model pages ---------- */
.back { margin-bottom: 10px; }
.itemlayout { display: grid; grid-template-columns: 1fr 320px; gap: 22px; align-items: start; }
.itemlayout > *, .searchlayout > *, .asmbody > * { min-width: 0; }
.itemhead { display: flex; gap: 12px; align-items: flex-start; }
.itemhead .kb { width: 38px; height: 38px; font-size: 14px; border-radius: 8px; }
.itemhead h1 { font-size: 23px; }
.itemhead .iri { font: 12.5px var(--mono); color: var(--ink-dim); word-break: break-all; }
.lead { font-size: 15px; color: var(--ink-2); margin: 12px 0 4px; }
.buybox { position: sticky; top: 0; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.buybox .kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; font-size: 13px; }
.buybox .kv dt { color: var(--ink-dim); } .buybox .kv dd { margin: 0; }
.bundle { border-top: 1px solid var(--border); padding-top: 10px; display: flex; flex-direction: column; gap: 4px; }
.bundle label { display: flex; align-items: center; gap: 6px; font-size: 13px; }
.connector { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 12px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); }
.connector .arrow { color: var(--ink-dim); font-size: 13px; }
.notice { border-left: 3px solid var(--info); background: var(--info-soft); padding: 8px 12px; border-radius: 0 4px 4px 0; margin: 10px 0; font-size: 13px; }
.notice.warn { border-color: var(--warn); background: var(--warn-soft); }
.notice.danger { border-color: var(--danger); background: var(--danger-soft); }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--border); margin: 16px 0 12px; flex-wrap: wrap; }
.tabs button { border: 0; border-bottom: 2px solid transparent; border-radius: 0; background: none; padding: 7px 12px; color: var(--ink-2); }
.tabs button.on { border-bottom-color: var(--accent); color: var(--ink); font-weight: 600; }
.tabs button:hover:not(.on) { background: var(--surface-sunk); }
table.parts { width: 100%; border-collapse: collapse; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); overflow: hidden; }
table.parts th, table.parts td { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--border); font-size: 13px; vertical-align: top; }
table.parts th { background: var(--surface-2); color: var(--ink-2); font-weight: 600; font-size: 12px; }
table.parts tr:last-child td { border-bottom: 0; }
table.parts tr.hit td { cursor: pointer; } table.parts tr.hit:hover td { background: var(--surface-2); }
.qcard { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 12px; margin-bottom: 8px; }

/* ---------- drawer / modal ---------- */
.scrim { position: fixed; inset: 0; background: rgba(10, 15, 22, .35); z-index: 20; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: 440px; max-width: 100vw; background: var(--surface); border-left: 1px solid var(--border); box-shadow: var(--shadow); z-index: 21; display: flex; flex-direction: column; }
.drawer header { padding: 14px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 8px; }
.drawer header h2 { font-size: 17px; }
.drawer .body { flex: 1; overflow: auto; padding: 12px 16px; }
.drawer footer { border-top: 1px solid var(--border); padding: 12px 16px; display: flex; flex-direction: column; gap: 8px; }
.cartline { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--border); }
.cartline .txt { flex: 1; min-width: 0; }
.cartline .lbl { font-weight: 600; cursor: pointer; }
.cartgroup h4 { margin: 14px 0 4px; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-dim); }
.bar { height: 8px; border-radius: 4px; background: var(--surface-sunk); overflow: hidden; display: flex; }
.bar span { display: block; height: 100%; }
.modal { position: fixed; left: 50%; top: 5vh; transform: translateX(-50%); width: 860px; max-width: calc(100vw - 24px); max-height: 90vh; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; box-shadow: var(--shadow); z-index: 22; display: flex; flex-direction: column; }
.modal header { padding: 14px 18px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; }
.modal header h2 { font-size: 18px; }
.modal .body { padding: 16px 18px; overflow: auto; }
.modal footer { padding: 12px 18px; border-top: 1px solid var(--border); display: flex; gap: 8px; align-items: center; }
.steps { display: flex; gap: 6px; font-size: 12.5px; color: var(--ink-dim); }
.steps span { padding: 2px 10px; border-radius: 12px; border: 1px solid var(--border); }
.steps span.on { border-color: var(--accent); color: var(--accent-ink); background: var(--accent-soft); font-weight: 600; }
.steps span.done { color: var(--ink-2); }
.form { display: grid; grid-template-columns: 180px 1fr; gap: 10px 14px; align-items: center; }
.form label.k { color: var(--ink-2); font-size: 13px; }
.form .hint { grid-column: 2; font-size: 12px; color: var(--ink-dim); margin-top: -6px; }
.ucform { display: flex; flex-direction: column; gap: 6px; }
.ucform .uck { color: var(--ink-2); font-size: 13px; margin-top: 8px; }
.ucform textarea { width: 100%; resize: vertical; }
.ucrole { display: grid; grid-template-columns: 1fr 1fr auto; gap: 6px; padding: 8px 0; border-bottom: 1px solid var(--border); }
.ucrole input { min-width: 0; }
.ucrole input.use { grid-column: 1 / span 3; }
ul.uclist { margin: 0 0 6px; padding-left: 20px; max-width: 820px; }
ul.uclist li { margin: 3px 0; }
.reqlist { display: flex; flex-direction: column; gap: 6px; }
.req { border: 1px solid var(--border); border-radius: 5px; background: var(--surface-2); }
.req summary { padding: 6px 10px; cursor: pointer; display: flex; gap: 10px; align-items: baseline; list-style: none; }
.req summary::-webkit-details-marker { display: none; }
.req .m { font: 700 11.5px var(--mono); min-width: 44px; color: var(--info); }
.req .p { font: 12px var(--mono); color: var(--ink-2); word-break: break-all; }
.req pre { margin: 0 10px 10px; max-height: 260px; }

/* ---------- assemble ---------- */
.asm { display: grid; grid-template-rows: auto 1fr; height: 100%; }
.asmbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 10px 16px; border-bottom: 1px solid var(--border); background: var(--surface); }
.asmbar input.title { font-size: 16px; font-weight: 600; border-color: transparent; background: transparent; min-width: 260px; }
.asmbar input.title:hover, .asmbar input.title:focus { border-color: var(--border-strong); background: var(--surface); }
.asmbody { display: grid; grid-template-columns: 1fr 420px; min-height: 0; }
.canvaswrap { position: relative; overflow: hidden; background: var(--surface-2); background-image: radial-gradient(var(--border) 1px, transparent 1px); background-size: 18px 18px; }
.canvaswrap svg { width: 100%; height: 100%; display: block; user-select: none; }
.canvaswrap svg.sw { width: 22px; height: 14px; display: inline-block; } /* legend pictures keep their size */
.legend { position: absolute; left: 10px; bottom: 10px; background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; font-size: 12px; display: flex; flex-direction: column; gap: 4px; }
.legend i { display: inline-block; width: 22px; height: 12px; border-radius: 3px; border: 2px solid; vertical-align: middle; margin-right: 6px; }
.canvastools { position: absolute; right: 10px; top: 10px; display: flex; gap: 6px; }
.side { border-left: 1px solid var(--border); background: var(--surface); display: flex; flex-direction: column; min-height: 0; }
.side .tabs { margin: 0; padding: 0 10px; }
.side .pane { flex: 1; overflow: auto; padding: 12px 14px; }
.covrow { display: flex; align-items: center; gap: 8px; padding: 5px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
.covrow .txt { flex: 1; min-width: 0; }
.rec { border: 1px solid var(--border); border-left: 3px solid var(--warn); border-radius: 5px; padding: 8px 10px; margin-bottom: 8px; background: var(--surface); }
.rec.block { border-left-color: var(--k-mapping); }
.stmts { display: flex; flex-wrap: wrap; gap: 2px 12px; margin-top: 6px; }
.stmts .ok { color: var(--accent-ink); }
.blockopts { display: flex; flex-wrap: wrap; gap: 6px 18px; margin: 8px 0 12px; }
.smsfold { margin: -2px 0 10px; }
svg .node rect.box { fill: var(--surface); stroke: var(--ink-2); stroke-width: 2; }
svg .node.sel rect.box { stroke-width: 3.5; }
svg .node text { fill: var(--ink); font: 600 12.5px var(--sans); }
svg .node text.attr { font: 11px var(--sans); fill: var(--ink-2); }
svg .node text.tag { font: 10.5px var(--sans); fill: var(--ink-dim); }
svg .node.ghost rect.box { fill: transparent; stroke-dasharray: 5 4; stroke: var(--ink-dim) !important; }
svg .node.ghost text { fill: var(--ink-dim); }
svg .edge line, svg .edge path { stroke: var(--k-objectProperty); stroke-width: 1.6; fill: none; }
svg .edge.sub line { stroke: var(--ink-dim); stroke-dasharray: 4 3; }
svg .edge.ghost line { stroke-dasharray: 5 4; opacity: .7; }
svg .edge text { font: 11px var(--sans); fill: var(--k-objectProperty); paint-order: stroke; stroke: var(--surface-2); stroke-width: 4px; }
svg .cov-mapped rect.box, svg .cov-inferred rect.box, svg .cov-viaSub rect.box { stroke: var(--accent); }
svg .cov-inferred rect.box, svg .cov-viaSub rect.box { stroke-dasharray: 6 3; }
svg .cov-available rect.box { stroke: var(--warn); }
svg .cov-none rect.box { stroke: var(--danger); }

/* ---------- console ---------- */
.console { border-top: 1px solid var(--border); background: var(--surface); display: flex; flex-direction: column; max-height: 40vh; }
.console .head { display: flex; align-items: center; gap: 4px; padding: 3px 10px; font-size: 12px; }
.console .head button { border: 0; background: none; padding: 3px 8px; border-radius: 3px; color: var(--ink-2); }
.console .head button.on { background: var(--accent-soft); color: var(--accent-ink); font-weight: 600; }
.console .body { overflow: auto; height: 200px; border-top: 1px solid var(--border); font: 12px var(--mono); padding: 6px 10px; }
.console.collapsed .body { display: none; }
.console .line { padding: 2px 0; border-bottom: 1px dashed var(--border); white-space: pre-wrap; word-break: break-word; }
.console .line .t { color: var(--ink-dim); margin-right: 8px; }
.console .line details summary { cursor: pointer; color: var(--info); }
#toasts { position: fixed; right: 16px; bottom: 48px; display: flex; flex-direction: column; gap: 8px; z-index: 30; }
.toast { background: var(--surface); border: 1px solid var(--border); border-left: 4px solid var(--accent); border-radius: 5px; padding: 8px 12px; box-shadow: var(--shadow); max-width: 380px; font-size: 13px; }
.toast.warn { border-left-color: var(--warn); }
#selftestBanner { position: fixed; top: 8px; right: 8px; z-index: 50; padding: 4px 6px 4px 12px; border-radius: 6px; font: 600 13px var(--sans); color: #fff; display: flex; align-items: center; gap: 6px; }
#selftestBanner button { color: #fff; padding: 0 6px; }
#selftestBanner button:hover { background: rgba(255,255,255,.2); }

/* ---------- quiet metadata ---------- */
.metaline { font-size: 12.5px; color: var(--ink-dim); }
.metaline b { color: var(--ink-2); font-weight: 600; }
.dep { font-size: 11.5px; color: var(--danger); margin-left: 6px; font-weight: 400; }
.cvdot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; flex: none; }

/* ---------- compare ---------- */
.cmpwrap { overflow-x: auto; }
table.cmp th, table.cmp td { min-width: 160px; }
table.cmp tr > th:first-child { min-width: 120px; width: 140px; background: var(--surface-2); color: var(--ink-2); font-weight: 600; }
table.cmp tr.same td { color: var(--ink-2); }
table.cmp tr.diff td, table.cmp tr.diff th:first-child { background: var(--warn-soft); }
.dtag { display: block; font-size: 11px; font-weight: 400; color: var(--warn); }
.inuse { color: var(--accent-ink); font-weight: 600; font-size: 12.5px; }

/* ---------- mapping recipes ---------- */
.recipe { border: 1px solid var(--border); border-radius: var(--r); background: var(--surface); padding: 10px 12px; margin-bottom: 8px; }
.recipe .rhead { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; }
.recipe .rline { display: grid; grid-template-columns: minmax(110px, auto) 1fr; gap: 2px 12px; font-size: 13px; padding: 2px 0; }
.recipe .rline .k { color: var(--ink-2); }
.recipe .rline code { word-break: break-all; }
.recipe .arrowline { font-size: 13.5px; margin: 2px 0 6px; }

/* ---------- start / connection ---------- */
.start { max-width: 760px; }
.start h1 { font-size: 26px; margin-top: 18px; }
.panel { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 16px 18px; margin: 16px 0; }
.panel h2 { font-size: 16px; margin-bottom: 12px; }
.conngrid { display: grid; grid-template-columns: 150px 1fr; gap: 10px 14px; align-items: center; }
.conngrid label.k { color: var(--ink-2); font-size: 13px; }
.conngrid input, .conngrid select, .conngrid textarea { width: 100%; }
.progress { font: 12.5px var(--mono); background: var(--surface-sunk); border: 1px solid var(--border); border-radius: 5px; padding: 8px 10px; max-height: 220px; overflow: auto; white-space: pre-wrap; margin-top: 12px; }
.progress .bad { color: var(--danger); }
.modal.narrow { width: 640px; }
.panel.conn h2 { font-size: 16px; }
.cstat { font-size: 12.5px; color: var(--ink-2); }
.cstat.ok { color: var(--accent-ink); } .cstat.bad { color: var(--danger); } .cstat.busy { color: var(--info); }
.dbfilter { width: 220px; padding: 4px 8px; }
.dbgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 2px 14px; max-height: 260px; overflow: auto; border: 1px solid var(--border); border-radius: 5px; padding: 8px 10px; background: var(--surface-2); }
.dbgrid label { display: flex; align-items: center; gap: 6px; font-size: 13px; min-width: 0; cursor: pointer; }
.dbgrid label span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dbgrid label.was span::after { content: " · read"; color: var(--ink-dim); font-family: var(--sans); font-size: 11.5px; }
button.spin::before { content: ""; display: inline-block; width: 11px; height: 11px; margin-right: 6px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: gfspin .8s linear infinite; vertical-align: -1px; }
@keyframes gfspin { to { transform: rotate(360deg); } }

/* ---------- fog of war, global view, context menu ---------- */
svg .node.fog rect.box { fill: var(--surface-2); stroke: var(--ink-dim) !important; stroke-dasharray: 4 3; }
svg .node.fog text { fill: var(--ink-2); }
svg .node.needed rect.box { stroke: var(--warn) !important; stroke-dasharray: 6 3; }
svg .edge.fog path { stroke: var(--ink-dim); stroke-dasharray: 5 4; }
svg .edge.fog text { fill: var(--ink-dim); }
svg .far { transition: opacity .35s ease; }
svg .edge text.sublbl { font: italic 10px var(--sans); fill: var(--ink-dim); opacity: .8; }
svg text.attr.fogattr { fill: var(--ink-dim); font-style: italic; opacity: .85; }
svg .node text.attr.inattr { fill: var(--ink); font-weight: 600; }
svg .node text.attr.moreattr { fill: var(--ink-dim); font-size: 10.5px; }
.ends { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
svg .node.map rect.box { stroke-width: 1.4; stroke: var(--accent) !important; }
svg .node.map.fog rect.box { stroke: var(--ink-dim) !important; stroke-dasharray: 3 3; }
svg .node.map .cyl { fill: none; stroke: var(--accent); stroke-width: 1.3; }
svg .node.map.fog .cyl { stroke: var(--ink-dim); }
svg .node text.mlabel { font: 11.5px var(--sans); fill: var(--ink-2); }
svg .node text.mlabel { font: 600 11.5px var(--mono); fill: var(--ink); }
svg .node text.msub { font: 10.5px var(--sans); fill: var(--ink-dim); }
svg .node.map.fog text.mlabel { fill: var(--ink-2); }
svg .dmark { stroke-width: 1.5; }
svg .stripe { stroke: none; }
.ctxmenu { position: fixed; z-index: 40; background: var(--surface); border: 1px solid var(--border-strong); border-radius: 6px; box-shadow: var(--shadow); padding: 4px; min-width: 190px; }
.ctxmenu .ttl { font-size: 12px; color: var(--ink-dim); padding: 4px 10px 6px; border-bottom: 1px solid var(--border); margin-bottom: 4px; max-width: 280px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ctxmenu button { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 6px 10px; border-radius: 4px; }
.ctxmenu button:hover { background: var(--surface-sunk); }
.globalwrap { display: grid; grid-template-rows: auto 1fr; height: 100%; }
.mlegend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12.5px; }
.mlegend button { border: 0; background: none; padding: 2px 4px; display: inline-flex; align-items: center; gap: 6px; }
.mlegend button.off { opacity: .4; }
.mlegend i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
.seg { display: inline-flex; border: 1px solid var(--border-strong); border-radius: 5px; overflow: hidden; }
.seg button { border: 0; border-radius: 0; padding: 4px 10px; }
.seg button.on { background: var(--accent-soft); color: var(--accent-ink); font-weight: 600; }

/* ---------- bottom dock: the model as it comes together ---------- */
.dock { border-top: 1px solid var(--border); background: var(--surface); display: flex; flex-direction: column; position: relative; }
.dgrip { position: absolute; left: 0; right: 0; top: -4px; height: 8px; cursor: ns-resize; z-index: 2; }
.dock.collapsed .dgrip { display: none; }
.dock .dhead { display: flex; align-items: center; gap: 10px; padding: 4px 12px; font-size: 12.5px; cursor: pointer; user-select: none; }
.dock .dhead b { font-size: 13px; white-space: nowrap; }
.dlegend, .legend { font-size: 12px; color: var(--ink-2); }
.dlegend { display: flex; flex-wrap: wrap; gap: 2px 12px; }
.lg { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
.sw { flex: none; }
.dock .dbody { height: 300px; border-top: 1px solid var(--border); position: relative; }
.dock.collapsed .dbody { display: none; }
.dock .canvaswrap { height: 100%; }
body[data-view="assemble"] .dock, body[data-view="start"] .dock, body[data-view="global"] .dock { display: none; }

@media (max-width: 900px) {
  .conngrid { grid-template-columns: 1fr; }
  .dock .dbody { height: 240px; }
  .searchlayout, .itemlayout, .asmbody { grid-template-columns: 1fr; }
  .facets, .buybox { position: static; }
  .facetsum { display: block; }
  .asmbody .canvaswrap { height: 55vh; }
  .topbar { flex-wrap: wrap; } .searchwrap { order: 5; flex-basis: 100%; } .tbsep { display: none; }
  .form { grid-template-columns: 1fr; } .form .hint { grid-column: 1; }
}
/* long descriptions read as text, at their full length */
.longtext { white-space: pre-wrap; overflow-wrap: anywhere; color: var(--ink-2); font-size: 15px; line-height: 1.6; margin: 10px 0; max-width: 92ch; }
.longtext .lang { display: inline-block; font-size: 11px; color: var(--ink-dim); border: 1px solid var(--border); border-radius: 3px; padding: 0 4px; margin-right: 6px; vertical-align: 2px; }
.linkbtn { border: 0; background: none; padding: 0; color: var(--info); cursor: pointer; font: inherit; }
.linkbtn:hover { text-decoration: underline; }
/* readiness, sign-off, trust, health */
.chip.ready { cursor: pointer; }
.chip.ready b { color: var(--accent-ink); }
.check { border-bottom: 1px solid var(--border); padding: 7px 0; }
.check > summary { display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 13.5px; }
.check .st { width: 16px; text-align: center; flex: none; }
.check .st.ok { color: var(--accent); } .check .st.open { color: var(--warn); } .check .st.info { color: var(--ink-dim); }
.tline { display: flex; align-items: center; gap: 8px; padding: 4px 0 4px 24px; font-size: 13px; }
.tline .grow { min-width: 0; }
.tline a { cursor: pointer; }
.trust { border-top: 1px solid var(--border); padding-top: 8px; }
.trust > summary { cursor: pointer; font-size: 12.5px; color: var(--ink-2); }
.trust ul { margin: 6px 0 0; padding-left: 18px; font-size: 12.5px; color: var(--ink-2); }
.trust li { margin: 2px 0; }
.hsec { border: 1px solid var(--border); border-radius: 6px; margin: 8px 0; background: var(--surface); }
.hsec > summary { padding: 9px 12px; cursor: pointer; }
.hsec > div { padding: 0 12px 12px; }
.ctxmenu .sep { border-top: 1px solid var(--border); margin: 4px 0; }
.ctxmenu label { display: flex; gap: 6px; align-items: center; padding: 2px 10px 6px 26px; font-size: 12px; color: var(--ink-2); }
.runlist { margin: 10px 0; }
.runlist div { display: flex; gap: 8px; font-size: 13px; padding: 3px 0; }
.runlist .st { width: 16px; text-align: center; flex: none; }
.runlist .done .st { color: var(--accent); } .runlist .warn .st { color: var(--warn); } .runlist .failed .st { color: var(--danger); } .runlist .skipped { color: var(--ink-dim); }
</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <button class="brand" id="brand" title="Home"><span class="logo">◆</span><span id="brandName"></span></button>
    <button class="sampletag" id="sampleTag" hidden title="Everything shown is invented sample data. Click for more.">Sample data</button>

    <span class="tbspacer"></span>

      <button class="ghost" id="globalBtn" title="How the models connect to one another">Model map</button>

    </nav>
    <span class="tbsep" aria-hidden="true"></span>
    <button class="icon" id="importBtn" title="Open a saved project or a Designer project" aria-label="Open a saved project or a Designer project"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 10.5V2.5M4.5 6 8 2.5 11.5 6M2.5 13.5h11" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <button class="icon" id="exportBtn" title="Download your cart, or save your work" aria-label="Download your cart, or save your work"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2v8M4.5 6.5 8 10l3.5-3.5M2.5 13.5h11" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <button class="cartbtn" id="cartBtn" title="Open cart">Cart <span class="count" id="cartCount">0</span></button>

    <div class="dhead" id="dockHead"><span id="dockArrow">▸</span><b>Your model</b><span class="dlegend" id="dockSummary"></span><span class="spacer"></span><span class="dim small" id="dockHint"></span></div>
    <div class="dbody"><div class="canvaswrap" id="dockCanvas"></div></div>
  </section>
  <footer class="console collapsed" id="console">
    <div class="head">
      <button id="consoleToggle" title="Show or hide the log">▸ Log</button>
      <span id="consoleTabs"></span>
      <span class="spacer"></span>
      <button id="consoleCopy" title="Copy the lines shown">Copy</button>
      <button id="consoleClear" title="Clear">Clear</button>
    </div>
    <div class="body" id="consoleBody"></div>
  </footer>
</div>

<script id="gf-demo">
/* Demo catalog: four source models from earlier "use cases", with rules, SMS2 mapping specs and a
   transaction log of past checkouts. Authored compactly; gf-core normalizes it into the same
   catalog index a live Stardog discovery fills. Everything here is fictional sample content. */
var GF_DEMO = (function () {
  var models = [], comps = [], log = [];
  function model(m) { models.push(m); }
  function add(kind, model, local, label, def, o) {
    comps.push(Object.assign({ kind: kind, model: model, pn: model + ':' + local, label: label, definition: def }, o || {}));
  }
  function cls(m, l, label, def, o) { add('class', m, l, label, def, o); }
  function obj(m, l, label, dom, rng, def, o) { add('objectProperty', m, l, label, def, Object.assign({ domain: dom, range: rng }, o || {})); }
  function dat(m, l, label, dom, rng, def, o) { add('datatypeProperty', m, l, label, def, Object.assign({ domain: dom, range: rng }, o || {})); }
  function rule(m, l, label, def, uses, infers, body, o) { add('rule', m, l, label, def, Object.assign({ uses: uses, infers: infers, body: body }, o || {})); }
  function redef(m, kind, pn, label, def, o) { comps.push(Object.assign({ kind: kind, model: m, pn: pn, label: label, definition: def }, o || {})); }
  function map(m, id, o) {
    comps.push(Object.assign({ kind: 'mapping', model: m, iri: 'urn:mapping:' + m + ':' + id, label: o.label, definition: o.definition || '' }, o));
  }

  /* ---------------------------------------------------------------- Enterprise Core */
  model({ id: 'core', label: 'Enterprise Core', prefix: 'core', ns: 'https://models.example.com/core#',
    version: '2.1.0', status: 'Published', owner: 'Enterprise Data Architecture', released: '2026-06-02',
    database: 'enterprise_models', schemaName: 'core', graph: 'urn:models:core',
    useCase: 'Shared vocabulary for parties, addresses and identifiers',
    description: 'The common building blocks every other model is expected to reuse: who a party is, where it is, and how it is identified. Changes go through the architecture review board.',
    // what the model is for, written as statements in the model itself (Turtle; the Use cases tab reads them)
    notes: [
      "<https://models.example.com/core> <urn:graph-shop:purpose> \"Give every other model one agreed way to say who a party is, where it is and how it is identified, so that a customer in sales, a client in compliance and a supplier in logistics can be recognised as the same person or organization. Teams build on it instead of defining party, address and identifier again in each project.\" ;",
      "  <urn:graph-shop:useCase> \"Onboard a new business application onto the shared party record\" ,\n    \"Reconcile addresses and identifiers across systems\" ;",
      "  <urn:graph-shop:businessQuestion> \"How many distinct organizations do we do business with?\" ,\n    \"Which of our records describe the same company?\" ;",
      "  <urn:graph-shop:competencyQuestion> \"What is the registered address and country of a given party?\" ,\n    \"Which people are employed by a given organization?\" ;",

  /* Runs a plan's steps in order through io.send(step, body) → response text (or a promise of it).

  function buildManifest(ix, cartIris, target, ctx) {

      '    <' + STD_PREFIXES.prov + 'startedAtTime> ' + lit(man.when) + '^^<' + STD_PREFIXES.xsd + 'dateTime> ;',

    man.virtualGraphs.forEach(function (v) { L.push('    <' + LOG_NS + 'virtualGraph> ' + lit(v.name) + ' ;'); });
    L.push('    <' + LOG_NS + 'modelGraph> <' + man.target.modelGraph + '> ;');

      '    OPTIONAL { ?ck <' + STD_PREFIXES.rdfs + 'label> ?label } OPTIONAL { ?ck <' + PV + 'wasAssociatedWith> ?who }\n' +
      '    OPTIONAL { ?ck <' + G + 'targetServer> ?server } OPTIONAL { ?ck <' + G + 'targetDatabase> ?db }\n' +

  /* Source systems → tables → the classes their mappings fill, and terms no model defines. */
  function sourceInventory(ix) {
    var out = {};
    ix.list.forEach(function (m) {
      if (m.kind !== 'mapping') return;
      var d = out[m.dataSource] = out[m.dataSource] || { ds: m.dataSource, label: (ix.dataSources[m.dataSource] || {}).label || dsName(m.dataSource), tables: {}, mappings: 0, databases: [] };
      d.mappings++;

      var tk = m.table || m.vg || '';

  /* ------------------------------------------------------------------ the data side, column by column

  /* Sources, tables and virtual graphs, each with the mapping blocks that use it and the classes they

  /* ------------------------------------------------------------------ Readiness

  function readiness(ix, cartIris, opts) {

  /* ------------------------------------------------------------------ Library health

  /* ------------------------------------------------------------------ Trust (shown on request)

  /* ------------------------------------------------------------------ Project files

        const byS = new Map();
        triples.forEach((t) => {
          if (t.s.t !== "iri") return;
          if (!byS.has(t.s.v)) byS.set(t.s.v, []);

        const objs = (s, pred) => (byS.get(s) || []).filter((t) => t.p.v === pred).map((t) => t.o);
        const types = (s) => new Set(objs(s, SDX_RDF + "type").filter((o) => o.t === "iri").map((o) => o.v));
        const report = { notes: [], skipped: [] };
        const classes = new Map();    // iri -> { label, comment, colorId }
        const addClass = (v) => { if (!classes.has(v)) classes.set(v, {}); };
        const pickLabel = (s) => {
          const labels = objs(s, SDX_RDFS + "label").filter((o) => o.t === "lit");
          const plain = labels.find((l) => !l.lang) || labels.find((l) => /^en\b/i.test(l.lang)) || labels[0];

        });
        const hierarchy = [];
        byS.forEach((list, s) => {
          if (sdxIsBuiltinIri(s)) return;

            if (t.o.t !== "iri" || sdxIsBuiltinIri(t.o.v)) { if (t.o.t !== "iri") report.skipped.push(`subClassOf restriction on ${sdxLocalName(s)} (not a named class)`); return; }
            addClass(s); addClass(t.o.v);

        });
        const props = [];
        byS.forEach((_, s) => {
          if (sdxIsBuiltinIri(s)) return;

          const isObj = ty.has(SDX_OWL + "ObjectProperty"), isDt = ty.has(SDX_OWL + "DatatypeProperty"), isProp = isObj || isDt || ty.has(SDX_RDF + "Property");
          const domPreds = [SDX_SO + "domainIncludes", "http://schema.org/domainIncludes", SDX_RDFS + "domain"];

          const doms = [...new Set(domPreds.flatMap((p) => objs(s, p)).filter((o) => o.t === "iri" && !sdxIsBuiltinIri(o.v)).map((o) => o.v))];
          const rngs = [...new Set(rngPreds.flatMap((p) => objs(s, p)).filter((o) => o.t === "iri").map((o) => o.v))];
          if (!isProp && !(doms.length && rngs.length)) return;
          const usesRdfs = objs(s, SDX_RDFS + "domain").length + objs(s, SDX_RDFS + "range").length > 0;
          const kind = isObj ? "object" : isDt ? "datatype" : (rngs.length && rngs.every(sdxIsDatatypeIri)) ? "datatype" : rngs.length ? "object" : "";
          props.push({ iri: s, kind, doms, rngs, usesRdfs });
        });
        const attributes = [], relationships = [];
        props.forEach((p) => {
          const name = sdxLocalName(p.iri);
          if (!p.kind) { report.skipped.push(`property ${name}: no type and no range, so it is not a relationship or an attribute`); return; }
          if (!p.doms.length) { report.skipped.push(`property ${name}: no domain, Designer needs a class to attach it to`); return; }
          if (p.kind === "datatype") {
            const rngs = p.rngs.filter(sdxIsDatatypeIri);

            attributes.push({ iri: p.iri, doms: p.doms, rngs, usesRdfs: p.usesRdfs });
          } else {
            const rngs = p.rngs.filter((r) => !sdxIsBuiltinIri(r));
            if (!rngs.length) { report.skipped.push(`relationship ${name}: no class range, Designer needs a class at both ends`); return; }
            p.doms.forEach(addClass); rngs.forEach(addClass);
            p.doms.forEach((d) => rngs.forEach((r) => relationships.push({ iri: p.iri, from: d, to: r, usesRdfs: p.usesRdfs })));
          }
        });
        const labels = {}, descriptions = {}, colors = {};
        const describe = (iriText) => {
          const l = pickLabel(iriText);
          labels[iriText] = l || sdxLocalName(iriText);
          const c = objs(iriText, SDX_RDFS + "comment").find((o) => o.t === "lit");
          if (c && c.v) descriptions[iriText] = c.v;
        };
        classes.forEach((info, c) => {
          describe(c);
          const col = objs(c, SDX_COLOR_PRED).find((o) => o.t === "lit");
          if (col && SDX_COLOR_IDS.includes(col.v)) colors[c] = col.v;
        });
        attributes.forEach((a) => describe(a.iri));
        relationships.forEach((r) => { if (!(r.iri in labels)) describe(r.iri); });
        const ignored = triples.filter((t) => t.s.t === "iri" && t.p.v === SDX_RDFS + "subPropertyOf").length;
        if (ignored) report.notes.push(`${ignored} subPropertyOf statement(s) are not modeled in Designer and were left out`);
        return { classes: [...classes.keys()], hierarchy, attributes, relationships, labels, descriptions, colors, report };
      }

      // ---- Rules: stardog:rule:content literals (named or anonymous rule resources) ----
      function sdxExtractRules(triples) {
        const rules = [];
        const labelOf = new Map();
        triples.forEach((t) => { if (t.p.v === SDX_RDFS + "label" && t.o.t === "lit" && !labelOf.has(t.s.v)) labelOf.set(t.s.v, t.o.v); });
        triples.forEach((t) => {
          if (t.p.v !== SDX_RULE_CONTENT || t.o.t !== "lit") return;
          const text = t.o.v.replace(/[▼▶][^\n]*\n?\s*$/, "").trim();   // fold marker the Rules pane appends
          if (!text) return;
          rules.push({ subject: t.s, text, label: labelOf.get(t.s.v) || "" });
        });
        return rules;
      }

      // ---- SMS2 mappings ----
      function sdxMatchBrace(src, openIdx) {
        let depth = 0;
        for (let i = openIdx; i < src.length; i++) {
          const c = src[i];
          if (c === '"' || c === "'") { const q = c; i++; while (i < src.length && src[i] !== q) { if (src[i] === "\\") i++; i++; } continue; }
          if (c === "#" && (i === 0 || /\s/.test(src[i - 1]))) { while (i < src.length && src[i] !== "\n") i++; continue; }
          if (c === "{") depth++;

        return -1;
      }
      function sdxParseSms2(text) {
        const src = String(text || "");
        const prefixes = {};
        const headerEnd = src.search(/^\s*MAPPING\b/im);
        const header = headerEnd < 0 ? src : src.slice(0, headerEnd);
        header.replace(/^\s*prefix\s+([^\s:]*):\s*<([^>]*)>/gim, (m, p, u) => { prefixes[p] = u; return m; });
        const mappings = [], warnings = [];
        const re = /^\s*MAPPING\b([^\n{]*)/gim;
        let m;
        while ((m = re.exec(src))) {
          const blockStart = m.index;
          const name = m[1].trim().replace(/;$/, "") || "";
          const rest = src.slice(re.lastIndex);
          const nextMap = rest.search(/^\s*MAPPING\b/im);
          const body = nextMap < 0 ? rest : rest.slice(0, nextMap);
          const clause = (kw) => {
            const km = new RegExp("\\b" + kw + "\\s*(?:SQL\\s*)?\\{", "i").exec(body);
            if (!km) return null;
            const open = km.index + km[0].length - 1;
            const close = sdxMatchBrace(body, open);
            return close < 0 ? null : body.slice(open + 1, close);
          };
          const fromKind = /\bFROM\s+(SQL|JSON|GRAPH|CSV|TABLE)\b/i.exec(body);
          const fromSql = clause("FROM");
          const toText = clause("TO");
          const whereText = clause("WHERE") || "";
          mappings.push({ name, kind: fromKind ? fromKind[1].toUpperCase() : "", sql: fromSql == null ? "" : fromSql.trim(), toText: toText || "", whereText, prefixes, blockStart });
        }
        return { prefixes, mappings, warnings };
      }
      function sdxSqlColumns(sql) {
        const text = String(sql || "").replace(/--[^\n]*/g, " ").replace(/\/\*[\s\S]*?\*\//g, " ");
        const sm = /^\s*select\s+(distinct\s+)?([\s\S]*?)\s+from\s/i.exec(text);
        if (!sm) return null;
        const parts = []; let depth = 0, cur = "";
        for (const ch of sm[2]) {
          if (ch === "(") depth++; if (ch === ")") depth--;
          if (ch === "," && depth === 0) { parts.push(cur); cur = ""; } else cur += ch;
        }
        parts.push(cur);
        const cols = [];
        for (const raw of parts) {
          const p = raw.trim();
          if (!p) continue;
          if (/(^|\.)\*$/.test(p)) return null;
          const as = /\bas\s+[`"\[]?([A-Za-z0-9_$ ]+?)[`"\]]?\s*$/i.exec(p);
          if (as) { cols.push(as[1].trim()); continue; }

      }
      function sdxSqlFirstTable(sql) {
        const m = /\bfrom\s+([`"\[]?[A-Za-z0-9_$]+[`"\]]?(?:\.[`"\[]?[A-Za-z0-9_$]+[`"\]]?){0,2})/i.exec(String(sql || "").replace(/--[^\n]*/g, " "));
        return m ? m[1].replace(/[`"\[\]]/g, "") : "";
      }
      function sdxSqlTable(sql) {
        const m = /^\s*select\s+\*\s+from\s+([`"\[]?[A-Za-z0-9_$.]+[`"\]]?(?:\.[`"\[]?[A-Za-z0-9_$]+[`"\]]?){0,2})\s*;?\s*$/i.exec(String(sql || ""));
        return m ? m[1].replace(/[`"\[\]]/g, "") : "";
      }
      // WHERE { BIND(...) } -> { varName: { kind: "template"|"cast"|"copy"|"other", ... } }
      function sdxParseBinds(whereText, prefixes) {
        const out = {};
        const re = /BIND\s*\(/gi;
        let m;
        while ((m = re.exec(whereText))) {
          let i = re.lastIndex, depth = 1;
          for (; i < whereText.length && depth > 0; i++) {
            const c = whereText[i];

          const inner = whereText.slice(re.lastIndex, i - 1);

          if (tm) { out[v] = { kind: "template", template: tm[1] }; continue; }
          tm = /^([A-Za-z0-9_]*:[A-Za-z0-9_.-]*|<[^>]+>)\s*\(\s*\?([A-Za-z0-9_]+)\s*\)$/.exec(expr);
          if (tm) { out[v] = { kind: "cast", column: tm[2], fn: tm[1] }; continue; }
          tm = /^StrDt\s*\(\s*(?:\?([A-Za-z0-9_]+)|sourceField\(\s*"((?:[^"\\]|\\.)*)"\s*\))\s*,\s*(?:<[^>]+>|[A-Za-z0-9_]*:[A-Za-z0-9_.-]*)\s*\)$/i.exec(expr);
          if (tm) { out[v] = { kind: "copy", column: tm[1] || tm[2] }; continue; }
          tm = /^sourceField\(\s*"((?:[^"\\]|\\.)*)"\s*\)$/i.exec(expr);
          if (tm) { out[v] = { kind: "copy", column: tm[1] }; continue; }
          tm = /^IRI\s*\(\s*\?([A-Za-z0-9_]+)\s*\)$/i.exec(expr);
          if (tm) { out[v] = { kind: "template", template: `{${tm[1]}}`, baseEmpty: true }; continue; }

      // unique.key.sets text: "(t.a, t.b), (u.c)" -> [{ table, cols }]
      function sdxParseUniqueKeySets(text) {

          const parts = inner.split(",").map((s) => s.trim().replace(/[`"\[\]]/g, "")).filter(Boolean).map((s) => s.split("."));
          if (!parts.length || parts.some((q) => q.length < 2)) return m;
          const tables = new Set(parts.map((q) => q[q.length - 2].toLowerCase()));
          if (tables.size === 1) out.push({ table: parts[0][parts[0].length - 2], cols: parts.map((q) => q[q.length - 1]) });

      }
      // "http://x/airport_{airport}_{n}" -> { baseIri, parts }
      function sdxTemplateToIdentifier(template) {

            if (i === 0) baseIri = pieces[i];

      }

      // Data source options (jdbc.url, sql.dialect, jdbc.driver) -> the type name Designer files carry
      function sdxInferDataSource(name, options) {
        const o = options || {};
        const url = String(o["jdbc.url"] || ""), dialect = String(o["sql.dialect"] || "").toUpperCase(), driver = String(o["jdbc.driver"] || "");
        const byDialect = { SPARKSQL: /databricks/i.test(url + driver) ? "SPARKSQL_DATABRICKS" : "SPARKSQL", POSTGRESQL: "POSTGRESQL", MYSQL: "MYSQL", ORACLE: "ORACLE",
          SNOWFLAKE: "SNOWFLAKE", TERADATA: "TERADATA", MSSQL: "MICROSOFT_SQL_SERVER", REDSHIFT: "AWS_REDSHIFT", BIGQUERY: "BIG_QUERY", HIVE: "APACHE_HIVE",
          IMPALA: "APACHE_CLOUDERA_IMPALA", DB2: "IBM_DB2", HANA: "SAP_HANA", ATHENA: "AWS_ATHENA", CASSANDRA: "APACHE_CASSANDRA", H2: "H2", DERBY: "DERBY",
          MONGODB: "MONGO", SYBASE: "SYBASE_ASE", EXASOL: "EXASOL", TRINO: "TRINO" };
        const byUrl = [[/^jdbc:databricks:/i, "SPARKSQL_DATABRICKS"], [/^jdbc:postgresql:/i, "POSTGRESQL"], [/^jdbc:mysql:/i, "MYSQL"], [/^jdbc:oracle:/i, "ORACLE"],
          [/^jdbc:snowflake:/i, "SNOWFLAKE"], [/^jdbc:teradata:/i, "TERADATA"], [/^jdbc:sqlserver:/i, "MICROSOFT_SQL_SERVER"], [/^jdbc:redshift:/i, "AWS_REDSHIFT"],

      }

      // ---- ids ----
      function sdxUuid() {
        if (typeof crypto !== "undefined" && crypto.randomUUID) return crypto.randomUUID();
        const h = (n) => Array.from({ length: n }, () => Math.floor(Math.random() * 16).toString(16)).join("");
        return `${h(8)}-${h(4)}-4${h(3)}-${"89ab"[Math.floor(Math.random() * 4)]}${h(3)}-${h(12)}`;

      function sdxShortId(now) {

        return `${two(d.getUTCFullYear() % 100)}${two(d.getUTCMonth() + 1)}${two(d.getUTCDate())}${tail}`;
      }

      // ---- Project assembly ----
      // opts: { name, description, modelText, rulesText, mappings: [{ vg, text, dataSource: { id, type, endpoint, options } }],
      //         connectionId, now, newId }
      function sdxBuildProject(opts) {
        const now = opts.now || Date.now();
        const report = { notes: [], skipped: [], counts: {} };
        const modelId = sdxUuid();
        const projectId = opts.projectId || sdxUuid();
        const parsedModel = sdxParseTurtle(opts.modelText || "");
        const model = sdxExtractModel(parsedModel.triples);
        model.report.notes.forEach((n) => report.notes.push(n));
        model.report.skipped.forEach((n) => report.skipped.push(n));
        parsedModel.warnings.forEach((w) => report.notes.push("model text: " + w));
        const nsCount = new Map();
        [...model.classes, ...model.attributes.map((a) => a.iri), ...model.relationships.map((r) => r.iri)].forEach((v) => {
          const m = /^(.*[#/:])[^#/:]*$/.exec(v);
          if (m) nsCount.set(m[1], (nsCount.get(m[1]) || 0) + 1);

        const prefixName = opts.prefix || Object.keys(parsedModel.prefixes).find((k) => k && parsedModel.prefixes[k] === namespace) || "ex";

        const nodeData = [], linkData = [];
        const classKey = (c) => `MODEL_CONCEPT_CLASS-${c}`;
        const attributesByIri = {}, propertyTypesByIri = {}, modelsByIri = {};
        const usesSchemaOrg = model.attributes.some((a) => !a.usesRdfs) || model.relationships.some((r) => !r.usesRdfs);
        const usesRdfs = model.attributes.some((a) => a.usesRdfs) || model.relationships.some((r) => r.usesRdfs);
        const propertyType = usesRdfs && !usesSchemaOrg ? "RDFS" : "SCHEMA_ORG";
        model.classes.forEach((c) => { nodeData.push({ key: classKey(c), value: c, category: "MODEL_CONCEPT_CLASS", isAttributesOpen: false }); modelsByIri[c] = [modelId]; });
        model.hierarchy.forEach(([sub, sup]) => {
          const pred = SDX_RDFS + "subClassOf";
          linkData.push({ key: `MODEL_CONCEPT_HIERARCHY-${sub}-${pred}-${sup}`, from: classKey(sub), value: pred, to: classKey(sup),
            labelKeys: [`MODEL_CONCEPT_HIERARCHY_LABEL-${sub}-${pred}-${sup}`], category: "MODEL_CONCEPT_HIERARCHY", points: [] });
          nodeData.push({ key: `MODEL_CONCEPT_HIERARCHY_LABEL-${sub}-${pred}-${sup}`, from: classKey(sub), value: pred, to: classKey(sup), category: "MODEL_CONCEPT_HIERARCHY_LABEL" });
        });
        const seenRel = new Set();
        model.relationships.forEach((r) => {
          const k = `${r.from}-${r.iri}-${r.to}`;
          if (seenRel.has(k)) return;
          seenRel.add(k);
          linkData.push({ key: `MODEL_CONCEPT_RELATIONSHIP-${k}`, from: classKey(r.from), value: r.iri, to: classKey(r.to),
            labelKeys: [`MODEL_CONCEPT_RELATIONSHIP_LABEL-${k}`], category: "MODEL_CONCEPT_RELATIONSHIP", points: [] });
          nodeData.push({ key: `MODEL_CONCEPT_RELATIONSHIP_LABEL-${k}`, from: classKey(r.from), value: r.iri, to: classKey(r.to), category: "MODEL_CONCEPT_RELATIONSHIP_LABEL" });
          propertyTypesByIri[r.iri] = r.usesRdfs ? "RDFS" : "SCHEMA_ORG";
          modelsByIri[r.iri] = [modelId];
        });
        model.attributes.forEach((a) => {
          attributesByIri[a.iri] = {
            value: a.iri,
            domains: Object.fromEntries(a.doms.map((d) => [d, { value: d }])),
            ranges: Object.fromEntries(a.rngs.map((r) => [r, { value: r }]))
          };
          propertyTypesByIri[a.iri] = a.usesRdfs ? "RDFS" : "SCHEMA_ORG";
          modelsByIri[a.iri] = [modelId];
        });
        const colorIdsByIri = Object.assign({}, model.colors);
        model.classes.forEach((c, i) => { if (!colorIdsByIri[c]) colorIdsByIri[c] = SDX_COLOR_IDS[i % SDX_COLOR_IDS.length]; });

        model.relationships.forEach((r) => { if (!(r.iri in descriptionsByIri)) descriptionsByIri[r.iri] = ""; });

        // rules
        const rulesById = {};
        const rules = sdxExtractRules(sdxParseTurtle(opts.rulesText || "").triples);
        rules.forEach((r, i) => {
          const id = r.subject.t === "iri" ? r.subject.v : sdxUuid();

        });

        const fileUploadsById = {}, virtualGraphsById = {};
        const resourceNodes = [];
        const resourceBySql = new Map();
        const classLabel = (c) => model.labels[c] || sdxLocalName(c);
        let mappingCount = 0, relCount = 0, starSelects = 0;
        const keySets = sdxParseUniqueKeySets(opts.uniqueKeysText || "");
        const keySetUsed = new Set();
        const keyFor = (res, where) => {
          const t = String(res.table || "").split(".").pop().toLowerCase();
          const cands = keySets.filter((k) => k.table.toLowerCase() === t);
          if (!cands.length) return [];
          const first = cands[0];
          const cols = [];
          for (const c of first.cols) {
            let have = res.cols.find((x) => x.toLowerCase() === c.toLowerCase());
            if (!have && res.columnsAreGuessed) {

        };
        (opts.mappings || []).forEach((vgInfo) => {
          const parsed = sdxParseSms2(vgInfo.text);
          parsed.mappings.forEach((mp, mi) => {
            const where = `${vgInfo.vg || "mappings"}${mp.name ? " / " + mp.name : " #" + (mi + 1)}`;
            if (mp.kind && mp.kind !== "SQL") { report.skipped.push(`mapping ${where}: FROM ${mp.kind} is not a table or query, so it was left out`); return; }
            if (!mp.sql) { report.skipped.push(`mapping ${where}: no FROM SQL`); return; }
            const pfx = Object.assign({}, vgInfo.prefixes || {}, parsed.prefixes, mp.prefixes);
            const to = sdxParseTurtle(mp.toText, pfx);
            if (to.warnings.length) { report.skipped.push(`mapping ${where}: could not read its TO part (${to.warnings[0]})`); return; }
            const binds = sdxParseBinds(mp.whereText, pfx);
            const subjects = new Map();   // var -> { classes:[], template }
            const tripleList = to.triples.filter((t) => t.s.t === "var");
            tripleList.forEach((t) => { if (!subjects.has(t.s.v)) subjects.set(t.s.v, { classes: [] }); });

            const sqlKey = mp.sql.replace(/\s+/g, " ").trim() + "|" + (vgInfo.vg || "");
            let res = resourceBySql.get(sqlKey);
            const colsFromSql = sdxSqlColumns(mp.sql);
            const referenced = new Set();
            Object.values(binds).forEach((b) => {
              if (b.column) referenced.add(b.column);
              if (b.template) String(b.template).replace(/\{([^{}]+)\}/g, (x, c) => referenced.add(c));

            const colOf = (term) => {
              if (term.t !== "var") return "";

            tripleList.forEach((t) => { if (t.o.t === "var" && !subjects.has(t.o.v) && !binds[t.o.v]) referenced.add(t.o.v); });
            if (!res) {
              const cols = colsFromSql || [...referenced];
              const id = sdxShortId(now);
              const table = sdxSqlTable(mp.sql) || sdxSqlFirstTable(mp.sql);
              const dsInfo = vgInfo.dataSource || {};
              const display = table ? table.split(".").pop() : (mp.name || vgInfo.vg || "query");
              res = { id, cols, columnsAreGuessed: !colsFromSql, display, sql: mp.sql, table };
              resourceBySql.set(sqlKey, res);
              virtualGraphsById[id] = {
                id, name: display,
                from: mp.sql,
                fields: cols.map((c) => ({ value: c, label: c })),
                previewRows: [],
                allResultsIncluded: false,
                connectionId: opts.connectionId || "",
                dataSourceId: dsInfo.id || "",
                dataSourceType: dsInfo.type || "",
                options: dsInfo.options || { "parser.sql.quoting": "NATIVE", "sql.functions": "", "percent.encode": true },
                dateLastUpdated: now
              };
              if (dsInfo.endpoint) virtualGraphsById[id].dataSourceEndpoint = dsInfo.endpoint;
              resourceNodes.push({ fields: cols.map((c) => ({ value: c, label: c })), value: id, text: display, dataSourceType: dsInfo.type || "", type: "VIRTUAL_GRAPH", key: `RESOURCE-${id}`, category: "RESOURCE", pos: "0 0" });
              if (!colsFromSql) starSelects++;
            } else {
              referenced.forEach((c) => { if (!res.cols.includes(c) && res.columnsAreGuessed) { res.cols.push(c); virtualGraphsById[res.id].fields.push({ value: c, label: c }); resourceNodes.find((n) => n.value === res.id).fields.push({ value: c, label: c }); } });
            }
            // one Designer mapping per (subject, class)
            const made = new Map();   // subjectVar -> [{ key, classIri }]
            subjects.forEach((info, sv) => {
              const b = binds[sv];
              if (!info.classes.length) { report.skipped.push(`mapping ${where}: ?${sv} has no rdf:type, so its properties were left out`); return; }
              if (!b || b.kind !== "template") { report.skipped.push(`mapping ${where}: ?${sv} is not built from a TEMPLATE, so it was left out`); return; }
              info.classes.forEach((cls) => {
                if (!model.classes.includes(cls)) { report.skipped.push(`mapping ${where}: class ${sdxLocalName(cls)} is not in the model, so ?${sv} was left out`); return; }
                const value = sdxUuid();
                const toKey = classKey(cls);
                const key = `MAPPING-${res.id}-${value}-${toKey}`;
                const labelKey = `MAPPING_LABEL-${res.id}-${value}-${toKey}`;
                const uk = keyFor(res, where);
                const fields = {};
                res.cols.forEach((c) => { fields[c] = { label: c, value: c, targets: [] }; });
                let labelCol = null;
                tripleList.filter((t) => t.s.v === sv && t.p.v !== SDX_RDF + "type" && t.o.t === "var" && !subjects.has(t.o.v)).forEach((t) => {
                  const col = colOf(t.o);
                  if (!col || !fields[col]) { report.skipped.push(`mapping ${where}: ${sdxLocalName(t.p.v)} on ?${sv} is computed, so it was left out`); return; }
                  if (t.p.v === SDX_RDFS + "label") labelCol = labelCol || col;
                  if (!attributesByIri[t.p.v]) {
                    if (t.p.v !== SDX_RDFS + "label") report.skipped.push(`mapping ${where}: ${sdxLocalName(t.p.v)} on ?${sv} is not an attribute in the model, so it was left out`);
                    return;
                  }
                  if (!fields[col].targets.includes(t.p.v)) fields[col].targets.push(t.p.v);
                });

                linkData.push({ key, from: `RESOURCE-${res.id}`, value, to: toKey, text, labelKeys: [labelKey], category: "MAPPING", points: [],
                  label: labelCol, primaryIdentifier: sdxIdentifierOf(b), fields, setClassType: true, uniqueKeySets: uk });
                nodeData.push({ key: labelKey, from: `RESOURCE-${res.id}`, value, to: toKey, text, category: "MAPPING_LABEL" });
                if (!made.has(sv)) made.set(sv, []);

            });
            // relationships between two templated subjects of this mapping
            tripleList.filter((t) => t.o.t === "var" && subjects.has(t.o.v) && t.p.v !== SDX_RDF + "type").forEach((t) => {
              const froms = made.get(t.s.v) || [], tos = made.get(t.o.v) || [];
              if (!froms.length || !tos.length) { report.skipped.push(`mapping ${where}: ${sdxLocalName(t.p.v)} links ?${t.s.v} to ?${t.o.v}, which has no mapping`); return; }
              if (!model.relationships.some((r) => r.iri === t.p.v)) { report.skipped.push(`mapping ${where}: ${sdxLocalName(t.p.v)} is not a relationship in the model, so the link was left out`); return; }
              froms.forEach((f) => tos.forEach((o) => {
                const value = sdxUuid();
                linkData.push({ category: "RELATIONSHIP_MAPPING", fromClassIri: f.classIri, fromPrimaryIdentifier: f.identifier, key: `RELATIONSHIP_MAPPING-${value}`,
                  labelKeys: [], relationshipIri: t.p.v, to: o.key, value, points: [] });
                relCount++;
              }));
            });
          });
        });
        if (starSelects) report.notes.push(`${starSelects} source(s) select with *, so their columns are the ones the mappings use`);
        keySets.filter((k) => !keySetUsed.has(k)).forEach((k) => report.notes.push(`unique key (${k.table}: ${k.cols.join(", ")}) matches no mapping source`));
        report.counts = { classes: model.classes.length, relationships: seenRel.size, attributes: model.attributes.length, hierarchy: model.hierarchy.length,
          rules: Object.keys(rulesById).length, resources: resourceNodes.length, mappings: mappingCount, relationshipMappings: relCount, uniqueKeys: keySetUsed.size };

        // layout: classes in columns by distance from the best-connected class, resources in a column to the left
        const adj = new Map(model.classes.map((c) => [c, new Set()]));
        const addEdge = (a, b) => { if (adj.has(a) && adj.has(b) && a !== b) { adj.get(a).add(b); adj.get(b).add(a); } };
        model.hierarchy.forEach(([a, b]) => addEdge(a, b));
        model.relationships.forEach((r) => addEdge(r.from, r.to));
        const layerOf = new Map();
        const order = [...model.classes].sort((a, b) => adj.get(b).size - adj.get(a).size);
        let nextLayer = 0;
        order.forEach((seed) => {
          if (layerOf.has(seed)) return;
          layerOf.set(seed, nextLayer);
          const queue = [seed];
          for (let qi = 0; qi < queue.length; qi++) {
            const c = queue[qi];

          }
          nextLayer = Math.max(...layerOf.values()) + 1;

        const rowIn = new Map();
        nodeData.forEach((n) => {
          if (n.category !== "MODEL_CONCEPT_CLASS") return;
          const l = layerOf.get(n.value) || 0, r = rowIn.get(l) || 0;
          rowIn.set(l, r + 1);
          n.pos = `${l * 480} ${r * 300}`;
        });
        resourceNodes.forEach((n, i) => { n.pos = `-700 ${i * 260}`; nodeData.push(n); });

        const project = {
          name: opts.name || "Exported project",
          description: opts.description || "",
          id: projectId,
          connectionId: opts.connectionId || "",
          dateCreated: now,
          dateLastUpdated: now,
          isRemoved: false,
          diagram: {
            id: sdxUuid(),
            model: {
              class: "GraphLinksModel",
              linkKeyProperty: "key",
              modelData: {
                attributesByIri, colorIdsByIri, competencyQuestions: [], descriptionsByIri, geoDataByIri: {}, hiddenModelIds: [], highlighted: null,
                labelsByIri: model.labels, layoutAlgorithm: "GO_JS_HORIZONTAL_LAYERED_DIGRAPH_LAYOUT", mappingIdx: mappingCount, modelsByIri,
                propertyTypesByIri, rulesById, selection: [], sensitivePropertyGroupsByName: {}, flaggedForRedraw: true
              },
              nodeDataArray: nodeData,
              linkDataArray: linkData
            }
          },
          fileUploadsById,
          virtualGraphsById,
          modelsById: {
            [modelId]: {
              classes: null, colorIdsByIri: null, connectionId: null, databaseId: null, databaseNamespaces: null, dateLastUpdated: now, descriptionsByIri: null,
              geoDataByIri: null, id: modelId, labelsByIri: null, name: opts.name || "Exported project", namespace,
              prefix: prefixName, properties: null, rules: null, shouldPublishPrefix: true
            }
          },
          dataNamespace: namespace,
          propertyType,
          publishHistory: {
            connectionId: "", csvResourceHistoriesById: {}, databaseInfo: { databaseId: "", isPublishingSPG: true }, doExportProject: true,
            isConsolidatingModels: false, isPublishingRules: true, modelHistoriesById: {}, sensitivePropertyGroupsByName: {}, vgResourceHistoriesById: {}

      }

      // Every reference inside the project must resolve, or Designer shows a broken diagram. Returns a list of problems (empty = sound).
      function sdxValidateProject(project) {
        const problems = [];
        const m = project?.diagram?.model;
        if (!m) return ["project has no diagram model"];
        const md = m.modelData || {};
        const nodes = m.nodeDataArray || [], links = m.linkDataArray || [];
        const nodeKeys = new Set(), linkKeys = new Set();
        nodes.forEach((n) => { if (nodeKeys.has(n.key)) problems.push(`duplicate node key ${n.key}`); nodeKeys.add(n.key); });
        links.forEach((l) => { if (linkKeys.has(l.key)) problems.push(`duplicate link key ${l.key}`); linkKeys.add(l.key); });
        const classIris = new Set(nodes.filter((n) => n.category === "MODEL_CONCEPT_CLASS").map((n) => n.value));
        const relIris = new Set(links.filter((l) => l.category === "MODEL_CONCEPT_RELATIONSHIP").map((l) => l.value));
        const linkValues = new Set(links.map((l) => l.value));
        const resources = new Map(nodes.filter((n) => n.category === "RESOURCE").map((n) => [n.key, n]));
        nodes.forEach((n) => { if (n.category === "MODEL_CONCEPT_CLASS" && n.key !== `MODEL_CONCEPT_CLASS-${n.value}`) problems.push(`class node key does not match its IRI: ${n.key}`); });
        links.forEach((l) => {
          const where = `${l.category} ${l.key}`;
          if (l.category === "MODEL_CONCEPT_RELATIONSHIP" || l.category === "MODEL_CONCEPT_HIERARCHY") {
            if (!nodeKeys.has(l.from)) problems.push(`${where}: from ${l.from} is not a node`);
            if (!nodeKeys.has(l.to)) problems.push(`${where}: to ${l.to} is not a node`);
          } else if (l.category === "MAPPING") {
            if (!resources.has(l.from)) problems.push(`${where}: from ${l.from} is not a resource`);
            if (!nodeKeys.has(l.to)) problems.push(`${where}: to ${l.to} is not a node`);
            const res = resources.get(l.from);
            const cols = new Set((res?.fields || []).map((f) => f.value));
            (l.primaryIdentifier?.parts || []).forEach((p) => { if (p.type === "field" && !cols.has(p.value)) problems.push(`${where}: identifier column ${p.value} is not a column of the resource`); });
            Object.entries(l.fields || {}).forEach(([k, f]) => {
              if (!cols.has(k)) problems.push(`${where}: field ${k} is not a column of the resource`);
              (f.targets || []).forEach((t) => { if (!md.attributesByIri?.[t] && !linkValues.has(t)) problems.push(`${where}: field ${k} targets ${t}, which is not in the model`); });
            });
            (l.labelKeys || []).forEach((k) => { if (!nodeKeys.has(k)) problems.push(`${where}: label node ${k} is missing`); });
            (l.uniqueKeySets || []).forEach((c) => { if (!cols.has(c)) problems.push(`${where}: unique key column ${c} is not a column of the resource`); });
          } else if (l.category === "RELATIONSHIP_MAPPING") {
            if (!linkKeys.has(l.to)) problems.push(`${where}: to ${l.to} is not a mapping`);
            if (!classIris.has(l.fromClassIri)) problems.push(`${where}: class ${l.fromClassIri} is not in the model`);
            if (!relIris.has(l.relationshipIri)) problems.push(`${where}: ${l.relationshipIri} is not a relationship in the model`);
          } else problems.push(`${where}: unknown link category`);
          if (l.category !== "RELATIONSHIP_MAPPING" && l.category !== "MAPPING") (l.labelKeys || []).forEach((k) => { if (!nodeKeys.has(k)) problems.push(`${where}: label node ${k} is missing`); });
        });
        Object.values(md.attributesByIri || {}).forEach((a) => {
          Object.keys(a.domains || {}).forEach((d) => { if (!classIris.has(d)) problems.push(`attribute ${a.value}: domain ${d} is not a class`); });
          if (!Object.keys(a.ranges || {}).length) problems.push(`attribute ${a.value}: no range`);
        });
        classIris.forEach((c) => { if (!md.labelsByIri?.[c]) problems.push(`class ${c} has no label`); if (!md.modelsByIri?.[c]) problems.push(`class ${c} is not assigned to a model`); });
        const modelIds = Object.keys(project.modelsById || {});
        if (!modelIds.includes(project.targetModelId)) problems.push("targetModelId is not a model of the project");
        Object.values(md.rulesById || {}).forEach((r) => {
          if (!r.text) problems.push(`rule ${r.id}: no text`);
          (r.models || []).forEach((id) => { if (!modelIds.includes(id)) problems.push(`rule ${r.id}: model ${id} does not exist`); });
        });
        const vgIds = Object.keys(project.virtualGraphsById || {}), fileIds = Object.keys(project.fileUploadsById || {});
        resources.forEach((n) => {
          // Graph Shop: uploaded files (FILE_UPLOAD, in fileUploadsById) are resources too
          if (n.type === "FILE_UPLOAD") { if (!fileIds.includes(n.value)) problems.push(`resource ${n.key}: no entry in fileUploadsById`); return; }
          if (!vgIds.includes(n.value)) problems.push(`resource ${n.key}: no entry in virtualGraphsById`);
          if (n.type !== "VIRTUAL_GRAPH") problems.push(`resource ${n.key}: unexpected type ${n.type}`);
        });
        fileIds.forEach((id) => { if (!resources.has(`RESOURCE-${id}`)) problems.push(`uploaded file ${id}: no resource node on the diagram`); });
        vgIds.forEach((id) => { if (!resources.has(`RESOURCE-${id}`)) problems.push(`virtual graph ${id}: no resource node on the diagram`); });
        return problems;
      }

      // ---- Yjs update (v1) writer for one client: objects become Y.Map, arrays Y.Array, scalars ContentAny ----

            else if (isMap(v)) { const id = { clock }; writeItem(REF_TYPE, null, parentRef, k); varUint(1); clock += 1; encodeMapInto(v, id, null); }

        varUint(clientId);
        varUint(0);                // first clock

        const out = new Uint8Array(head.length + body.length + 1);

      }

      // "STAR" container: magic, version 1, one header chunk per entry, then the document chunk
      function sdxWrapStar(update, headers) {

        return out;
      }

      async function sdxProjectToFileText(project) {
        const clientId = (crypto.getRandomValues(new Uint32Array(1))[0] >>> 1) || 1;
        const update = sdxEncodeYjsProject(project, clientId);
        const star = sdxWrapStar(update, { migration_version: String(SDX_MIGRATION_VERSION), project_id: project.id });

      // ---- Reading a .stardogdesigner file (the reverse of the writer above) ----

            if (kept.has(k)) { if (kept.get(k) !== t.o.v) report.notes.push(`${sdxLocalName(t.s.v)} is described twice (${sdxLocalName(t.p.v)}: "${kept.get(k)}" and "${t.o.v}"); the one already loaded was kept`); return; }
            kept.set(k, t.o.v);
          }
          have.add(key(t));
          fresh.push(t);
        });
        if (!fresh.length) return base;
        const names = Object.assign({}, pa.prefixes), byIri = new Map();
        Object.entries(names).forEach(([p, u]) => { if (!byIri.has(u)) byIri.set(u, p); });

      // Rules: a rule whose text is already there is skipped; one that reuses a name but says something else gets a new name.

          if (haveText.has(sdxNormSpace(r.text))) return;

      // Mappings of one data source: each MAPPING block is kept once, however many projects carry it.

      }

      // Unique keys: a key set is the same when it names the same columns, in any order.

      function sdxMergeUniqueKeys(baseText, addText) {
        const base = String(baseText || "").trim();
