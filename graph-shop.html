        const fresh = [];

        if (!fresh.length) return base;

      }

      // base and add are the shape sdxProjectToArtifacts returns ({modelTtl, rulesTtl, mappingsByVg, dataSources, uniqueKeysText, report}).
      function sdxMergeArtifacts(base, add) {

        (add.report?.notes || []).forEach((n) => { if (!report.notes.includes(n)) report.notes.push(n); });
        (add.report?.skipped || []).forEach((n) => { if (!report.skipped.includes(n)) report.skipped.push(n); });
        const mappingsByVg = Object.assign({}, base.mappingsByVg);
        Object.entries(add.mappingsByVg || {}).forEach(([vg, text]) => { mappingsByVg[vg] = sdxMergeMappingText(mappingsByVg[vg], text); });
        const dataSources = Object.assign({}, base.dataSources);
        Object.entries(add.dataSources || {}).forEach(([vg, info]) => {

          const diff = ["id", "type", "endpoint"].filter((k) => cur[k] && info[k] && cur[k] !== info[k]);
          if (diff.length) report.notes.push(`data source "${vg}" is set up differently in two projects (${diff.join(", ")}); the one already loaded was kept`);
          else dataSources[vg] = Object.assign({}, info, cur, { id: cur.id || info.id, type: cur.type || info.type, endpoint: cur.endpoint || info.endpoint, options: cur.options || info.options });

          rulesTtl: sdxMergeRulesTurtle(base.rulesTtl, add.rulesTtl, report),
          mappingsByVg, dataSources,

      }

      // What an artifact set holds, counted the same way for any text (so before and after a merge compare).
      function sdxCountArtifacts(a) {

        return {
          classes: m.classes.length,
          relationships: new Set(m.relationships.map((r) => r.iri)).size,
          attributes: new Set(m.attributes.map((x) => x.iri)).size,
          rules: sdxExtractRules(sdxParseTurtle(a.rulesTtl || "").triples).length,
          mappings: Object.values(a.mappingsByVg || {}).reduce((n, t) => n + (String(t).match(/^MAPPING$/gm) || []).length, 0),
          dataSources: Object.keys(a.mappingsByVg || {}).length,
          uniqueKeys: new Set(sdxKeySetEntries(a.uniqueKeysText).map((e) => e.canon)).size

      }

  /* ===== Graph Shop additions =====
     The cart as a Designer project. Each mapping block becomes one Designer mapping on a resource:
     - a source system the server knows (its connection details read from the server), or the details
       a Designer project recorded for it → a data source resource Designer can publish against;
     - otherwise (a block that loaded a file, an uploaded file, a source no server knows) → an

       graph it loaded) or just the header, so the project opens and publishes on its own. */

  function tplCols(t) { return (String(t || "").match(/\{[^{}]+\}/g) || []).map(function (x) { return x.slice(1, -1); }); }

    if (hit) return hit.subjectClass;

    var to = ["?subject a " + [m.subjectClass].concat(m.extraClasses || []).map(function (c) { return "<" + c + ">"; }).join(", ")];
    var where = ['BIND(TEMPLATE("' + GF.fullTemplate(ix, m.subjectTemplate) + '") AS ?subject)'], extra = [], cols = tplCols(m.subjectTemplate);
    m.bind.forEach(function (b, i) {
      if (keep && keep.indexOf(b.prop) < 0) return;

        m.bind.forEach(function (b) {
          if (b.isExpr || b.inverse || r.p !== b.prop) return;
          if (b.isTemplate) Object.assign(row, untemplate(GF.fullTemplate(ix, b.value), r.o) || {});
          else row[b.value] = String(r.o).replace(/^"|"(\^\^.*|@.*)?$/g, "");

  /* opts: { name, now, blocks (mappingPlan options), sources: { dataSource: details from GF.dataSourceDetails },

    opts = opts || {};
    var plan = GF.mappingPlan(ix, cartIris, opts.blocks || {});
    var items = cartIris.map(function (i) { return ix.byIri[i]; }).filter(Boolean);
    var modelText = GF.toTurtle(ix, items.filter(function (c) { return c.kind !== "mapping" && c.kind !== "rule"; }).map(function (c) { return c.iri; }), {});
    var rules = items.filter(function (c) { return c.kind === "rule"; }).map(function (c) { return c.iri; });
    var rulesText = rules.length ? GF.toTurtle(ix, rules, {}) : "";
    var groups = {}, order = [], files = {};
    plan.blocks.forEach(function (b) {
      var m = ix.byIri[b.iri], res = m.resource || null, det = (opts.sources || {})[m.dataSource] || null, key, ds, sql;
      var loaded = m.via === "graph" || m.via === "file" || (res && res.type === "FILE_UPLOAD");
      if (!loaded && det && det.type) { key = "vg:" + det.id; ds = { id: det.id, type: det.type, endpoint: det.endpoint }; }
      else if (!loaded && res && res.type === "VIRTUAL_GRAPH" && res.dataSourceId) { key = "vg:" + res.dataSourceId; ds = { id: res.dataSourceId, type: res.dataSourceType || "", endpoint: res.endpoint || "" }; }
      if (key) sql = m.sql || (m.table ? "SELECT * FROM " + m.table : "");
      else {

        var fk = (res && res.name) || m.table || m.vg || m.iri;

        files[nm] = files[nm] || { from: fk, name: nm, blocks: [], contents: res && res.contents || "", sample: null, why: loaded ? (res ? "uploaded" : "loaded") : "absent" };
        files[nm].blocks.push(m.iri);
        if (!files[nm].sample && opts.samples && opts.samples[m.iri]) files[nm].sample = opts.samples[m.iri];
        key = "file:" + nm; ds = { id: FILE_MARK + nm, type: "", endpoint: "" }; sql = "SELECT * FROM " + nm;
      }

    var built = sdxBuildProject({ name: opts.name || "Graph Shop export", modelText: modelText, rulesText: rulesText, mappings: mappings, now: opts.now });
    var p = built.project, now = opts.now || Date.now(), resources = [];

      } else if (f.sample && f.sample.rows.length) {
        cols = gfUniq(f.sample.cols.concat(need)); nrows = f.sample.rows.length;
        text = csvText(cols, f.sample.rows.map(function (r) { return cols.map(function (c) { var i = f.sample.cols.indexOf(c); return i < 0 ? "" : r[i]; }); }));
      } else text = csvText(cols, []);

      p.fileUploadsById[id] = { name: f.name, path: f.name + ".csv", contents: text, options: Object.assign({}, CSV_OPTIONS),
        fields: fields.map(function (x) { return { label: x.label, value: x.value, statistics: { distinct: nrows, records: nrows } }; }), id: id, partial: false, dateLastUpdated: now };
      delete p.virtualGraphsById[id];
      node.type = "FILE_UPLOAD"; node.fields = fields; node.text = f.name; delete node.dataSourceType;
      resources.push({ name: f.name + ".csv", kind: "file", why: f.why, rows: nrows, blocks: f.blocks.length });
    });
    var problems = sdxValidateProject(p);
    return { project: p, report: built.report, problems: problems, plan: plan, resources: resources };
  }
  return { fileTextToProject: sdxFileTextToProject, projectToFileText: sdxProjectToFileText, buildProject: sdxBuildProject, validateProject: sdxValidateProject,
    projectToArtifacts: sdxProjectToArtifacts, encodeYjsProject: sdxEncodeYjsProject, readYjsUpdate: sdxReadYjsUpdate, cartToDesigner: cartToDesigner,
    blockSms: blockSms, csvText: csvText, csvRows: csvRows, sampleQuery: sampleQuery, sampleRows: sampleRows, untemplate: untemplate };
})();

<script id="gf-tests">
/* Core test cases. Run headless with `node tests/selftest.mjs`, or in the page with ?selftest=1

var GF_TESTS = (function () {
  var cases = [];
  function test(name, run) { cases.push({ name: name, run: run }); }
  function ix() { return GF.buildIndex(GF_DEMO); }
  function X(i, pn) { return GF.expand(pn, i.prefixes); }

  test('catalog: every reference resolves to a component (catches typos in model data)', function (t) {
    var i = ix(), bad = [];
    function chk(from, iri, allowXsd) {
      if (i.byIri[iri]) return;
      if (allowXsd && iri.indexOf(GF.STD_PREFIXES.xsd) === 0) return;
      bad.push(from + ' -> ' + iri);
    }
    i.list.forEach(function (c) {
      c.superClasses.forEach(function (s) { chk(c.pn, s); });
      if (c.domain) chk(c.pn, c.domain);
      if (c.range) chk(c.pn, c.range, c.kind === 'datatypeProperty');
      c.uses.concat(c.infers).forEach(function (u) { chk(c.pn, u); });
      if (c.replacedBy) chk(c.pn, c.replacedBy);
      (c.populates || []).forEach(function (p) { chk(c.pn, p); });
    });
    i.modelOrder.forEach(function (m) {
      i.models[m].questions.forEach(function (q) { q.needs.forEach(function (n) { chk(q.id, n); }); });
      if (i.models[m].reuses) i.models[m].reuses.components.forEach(function (n) { chk(m + ' reuses', n); });
    });
    i.log.forEach(function (e) { e.items.forEach(function (it) { chk(e.id, it.iri); }); });

  /* A fake server for checkout runs: answers by step id, remembers the options it was given. */
  function fakeServer(o) {
    var opts = { 'reasoning.schemas': (o.schemas || []).slice() }, sent = [];
    var rows = function (b) { return JSON.stringify({ head: { vars: [] }, results: { bindings: b } }); };
    return { sent: sent, opts: function () { return opts; }, send: function (s, body) {
      sent.push(s.id);
      if (s.id === 'check-db' || s.id === 'verify-schema') return JSON.stringify(opts);
      if (s.id === 'check-graph') return JSON.stringify({ boolean: !!o.graphFull });
      if (s.id === 'schema') { opts = JSON.parse(body); return ''; }
      if (s.id === 'check-sources') return JSON.stringify({ data_sources: o.sources || [] });
      if (s.id === 'verify-model') return rows([{ n: { type: 'literal', value: '999' } }]);
      if (s.id === 'verify-log') return JSON.stringify({ boolean: true });
      if (s.id.indexOf('verify-vg-') === 0) return rows([{ s: { type: 'uri', value: 'urn:x' } }]);
      return rows([]);
    } };
  }
  function runTarget(name, more) { var t = GF.defaultTarget(name); t.createDatabase = false; t.database = 'shared'; return Object.assign(t, more || {}); }

    var vg = r.steps.filter(function (s) { return s.id.indexOf('vg-') === 0; })[0];
    t.ok(vg && vg.state === 'skipped' && srv.sent.indexOf(vg.id) < 0, 'a virtual graph over a source the server does not have is skipped: ' + JSON.stringify(vg));
    var shared = r.steps.filter(function (s) { return s.id === 'log-shared'; })[0];

  function run() {
    var results = [];
    cases.forEach(function (c) {
      var fails = [];
      try { c.run({ ok: function (cond, detail) { if (!cond) fails.push(detail || 'failed'); } }); }
      catch (e) { fails.push('threw: ' + (e && e.stack || e)); }
      results.push({ name: c.name, status: fails.length ? 'fail' : 'pass', detail: fails.join(' | ') });
    });
    var failed = results.filter(function (r) { return r.status === 'fail'; }).length;
    return { ok: failed === 0, passed: results.length - failed, failed: failed, results: results };
  }
  return { cases: cases, run: run };
})();
</script>
<script id="gf-ui">
(function () {
  'use strict';
  var APP_NAME = 'Graph Shop';
  var K = GF.COMPONENT_KINDS, ST = GF.STATUS_LEVELS, esc = GF.esc;
  var COVERAGE = {
    mapped: { label: 'From source data', help: 'A mapping block for your cart builds it from a source system.' },
    inferred: { label: 'Derived by a rule', help: 'A rule in your cart derives it from other data.' },
    viaSub: { label: 'Through its subtypes', help: 'Not built directly, but a more specific type in your cart is.' },
    available: { label: 'Data available', help: 'The catalog has a mapping block or rule that can supply it. Add it to connect data.' },
    none: { label: 'No data source', help: 'Nothing in the catalog supplies it yet. A new mapping block is needed.' }
  };
  var COV_ORDER = ['mapped', 'inferred', 'viaSub', 'available', 'none'];
  var COV_COLOR = { mapped: 'var(--accent)', inferred: 'var(--accent)', viaSub: 'var(--accent)', available: 'var(--warn)', none: 'var(--danger)' };

  var S = {
    catalog: null, ix: null, cart: [], q: '', facets: { kinds: [], models: [], sources: [] }, sort: 'relevance',
    logs: [], consoleTab: 'action', debug: false, modelTab: {}, itemTab: null,
    asm: { tab: 'ready', sel: null, title: '', notes: noNotes(), fill: true, whole: false, skip: [] }, graphs: {}, co: null,
    source: null,        // 'sample' | 'live' | 'designer'
    conns: [], profiles: {}, connForm: null, designerCat: null,
    dock: { open: false, touched: false }, global: { mode: 'classes', hidden: {} },
    start: { filter: '' }, wantCart: [], savedChoices: null, snap: false, noSave: false
  };
  function noFacets() { return { kinds: [], models: [], sources: [] }; }
  /* Model colours for the all-models view: categorical, kept clear of the amber and red that mean
     "gap" and "problem" elsewhere. */
  var MODEL_COLORS = ['#4e79a7', '#59a14f', '#b07aa1', '#76b7b2', '#9c755f', '#a0cbe8', '#8cd17d', '#d4a6c8', '#86bcb6', '#bab0ac'];
  function modelColor(id) { var i = S.ix.modelOrder.indexOf(id); return MODEL_COLORS[(i < 0 ? 0 : i) % MODEL_COLORS.length]; }
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };
  var enc = encodeURIComponent;

  /* ------------------------------------------------------------------ log & toasts */
  function now() { return new Date().toISOString(); }
  function log(type, msg, code) {
    S.logs.push({ at: now(), type: type, msg: msg, code: code || '' });
    if (S.logs.length > 1500) S.logs.shift();
    renderConsole();
  }
  function dlog(msg) { if (S.debug) log('debug', msg); }
  function toast(msg, kind) {
    var el = document.createElement('div');
    el.className = 'toast' + (kind ? ' ' + kind : '');
    el.innerHTML = msg;
    $('#toasts').appendChild(el);
    setTimeout(function () { el.remove(); }, 3200);
  }
  var CONSOLE_TABS = [{ id: 'action', label: 'Activity' }, { id: 'request', label: 'Requests' }, { id: 'debug', label: 'Debug', hidden: true }];
  function renderConsole() {
    $('#consoleTabs').innerHTML = CONSOLE_TABS.filter(function (t) { return !t.hidden || S.debug; }).map(function (t) {
      return '<button data-ctab="' + t.id + '" class="' + (S.consoleTab === t.id ? 'on' : '') + '">' + t.label + ' <span class="dim">' + S.logs.filter(function (l) { return l.type === t.id; }).length + '</span></button>';
    }).join('');
    var lines = S.logs.filter(function (l) { return l.type === S.consoleTab; });
    var body = $('#consoleBody');
    if (S.consoleTab === 'debug') { body.textContent = lines.map(function (l) { return l.msg; }).join('\n'); return; }
    body.innerHTML = lines.slice(-400).reverse().map(function (l) {
      return '<div class="line"><span class="t">' + esc(l.at.slice(11, 19)) + '</span>' + esc(l.msg) +
        (l.code ? '<details><summary>show ' + l.code.split('\n').length + ' lines</summary><pre class="code">' + esc(l.code) + '</pre></details>' : '') + '</div>';
    }).join('') || '<div class="dim">Nothing yet.</div>';
  }

  /* ------------------------------------------------------------------ cart */
  function inCart(i) { return S.cart.indexOf(i) >= 0; }
  function lbl(i) { var c = S.ix.byIri[i]; return c ? c.label : GF.localName(i); }
  function addToCart(iris, quiet) {
    var added = iris.filter(function (i) { return S.ix.byIri[i] && !inCart(i); });
    if (!added.length) { if (!quiet) toast('Already in your cart.'); return; }
    S.cart = S.cart.concat(added);
    if (!S.dock.touched) S.dock.open = true;
    log('action', 'Added to cart: ' + added.map(lbl).join(', '));

    refresh();
  }
  function removeFromCart(iris) {
    S.cart = S.cart.filter(function (i) { return iris.indexOf(i) < 0; });
    log('action', 'Removed from cart: ' + iris.map(lbl).join(', '));
    refresh();
  }
  function assembly() { return GF.assembleCart(S.ix, S.cart); }
  /* How mapping blocks are chosen for checkout and the Designer export (Mapping blocks tab). */
  function blockOpts() { return { fill: S.asm.fill !== false, whole: !!S.asm.whole, skip: (S.asm.skip || []).slice() }; }
  function updateCartButton() {
    $('#cartCount').textContent = S.cart.length;
    var a = assembly(), btn = $('#cartBtn'), dot = $('.alert', btn);
    if (a.missing.length && !dot) { dot = document.createElement('span'); dot.className = 'alert'; btn.appendChild(dot); }
    if (!a.missing.length && dot) dot.remove();
    if (dot) dot.title = a.missing.length + ' missing component(s)';
  }

  /* ------------------------------------------------------------------ small renderers */
  function ver(v) { return v ? '<span class="ver">v' + esc(v) + '</span>' : ''; }
  function covPill(state) { return state ? '<span class="pill cv-' + state + '" title="' + esc(COVERAGE[state].help) + '">' + esc(COVERAGE[state].label) + '</span>' : ''; }
  function covDot(state) { return state ? '<span class="cvdot" style="background:' + COV_COLOR[state] + (state === 'viaSub' || state === 'inferred' ? ';opacity:.55' : '') + '" title="' + esc(COVERAGE[state].label + '. ' + COVERAGE[state].help) + '"></span>' : ''; }
  function kindWord(c) { return K[c.kind].label; }
  function addBtn(iri, cls) {
    return inCart(iri) ? '<button class="addbtn in ' + (cls || '') + '" data-remove="' + esc(iri) + '" title="Remove from cart">✓ In cart</button>'
      : '<button class="addbtn ' + (cls || '') + '" data-add="' + esc(iri) + '">+ Add</button>';
  }
  function modelName(id) { return (S.ix.models[id] || {}).label || id; }
  function srcLabel(ds) { return (S.ix.dataSources[ds] || {}).label || GF.dsName(ds) || ds; }
  function mini(iri, note, opts) {
    opts = opts || {};
    var c = S.ix.byIri[iri];
    if (!c) return '<div class="mini ghost"><div class="txt"><span class="lbl">' + esc(GF.localName(iri)) + '</span><span class="sub">' + esc(GF.pnOf(S.ix, iri)) + '</span></div></div>';
    return '<div class="mini' + (opts.ghost ? ' ghost' : '') + '"><div class="txt"><span class="lbl" data-open="' + esc(iri) + '">' + esc(c.label) + '</span>' +
      '<span class="sub">' + esc(note ? note : modelName(c.model) + ' · ' + kindWord(c)) + '</span></div>' + addBtn(iri, 'small') + '</div>';
  }
  function code(text, name) {
    return '<div class="row" style="justify-content:flex-end;margin-bottom:4px"><button class="small" data-copy>Copy</button>' +
      (name ? '<button class="small" data-download="' + esc(name) + '">Download</button>' : '') + '</div><pre class="code">' + esc(text) + '</pre>';
  }
  function cardMeta(c) {
    var m = [];
    if (c.kind === 'class') {
      var r = GF.related(S.ix, c.iri);
      var nr = r.outgoing.length + r.incoming.length;
      if (nr) m.push(nr + ' connection' + (nr === 1 ? '' : 's'));
      if (r.subClasses.length) m.push(r.subClasses.length + ' subtype' + (r.subClasses.length === 1 ? '' : 's'));
    }
    if (c.kind === 'objectProperty' || c.kind === 'datatypeProperty') m.push(propNote(c.iri));
    if (c.kind === 'rule') m.push('derives ' + c.infers.map(lbl).join(', '));
    if (c.kind === 'mapping') { m.push(srcLabel(c.dataSource)); if (c.table) m.push(c.table); m.push(c.populates.length + ' terms'); }
    else {
      var srcs = GF.sourcesFor(S.ix, c);
      m.push(srcs.length ? 'data from ' + srcs.map(srcLabel).join(', ') : (S.ix.rulesInferring[c.iri] ? 'derived by a rule' : 'no data source yet'));
    }
    var t = S.ix.takenCount[c.iri];
    if (t) m.push('reused in ' + t + ' deployment' + (t === 1 ? '' : 's'));
    return m.map(esc).join(' · ');
  }


  /* ------------------------------------------------------------------ routing */
  function route() {
    var h = location.hash.slice(1) || '/', qi = h.indexOf('?');
    var path = qi >= 0 ? h.slice(0, qi) : h, params = new URLSearchParams(qi >= 0 ? h.slice(qi + 1) : '');
    return { parts: path.split('/').filter(Boolean).map(decodeURIComponent), params: params };
  }
  function go(hash) { if (location.hash === hash) render(); else location.hash = hash; }
  function render() {
    var r = route(), main = $('#main');
    var view = r.parts[0] || 'home';
    closeCtx();
    if (!S.ix || view === 'connect') { document.body.dataset.view = 'start'; main.innerHTML = renderStart(); renderTabs('start', r); updateChrome(); scheduleSave(); return; }
    document.body.dataset.view = view;
    if (view === 'search') { S.q = r.params.get('q') || ''; if ($('#q') !== document.activeElement) $('#q').value = S.q; main.innerHTML = renderSearch(); }
    else if (view === 'item' && S.ix.byIri[r.parts[1]]) main.innerHTML = renderItem(r.parts[1]);
    else if (view === 'model' && S.ix.models[r.parts[1]]) main.innerHTML = renderModel(r.parts[1]);
    else if (view === 'compare' && S.ix.byIri[r.parts[1]]) main.innerHTML = renderCompare(r.parts[1]);
    else if (view === 'assemble') { main.innerHTML = renderAssemble(); mountAssembleGraph(); }
    else if (view === 'global') { main.innerHTML = renderGlobal(); mountGlobalGraph(); }
    else if (view === 'gaps') main.innerHTML = renderHealth();
    else if (view === 'models') main.innerHTML = renderModels(r.params.get('db') || '');
    else if (view === 'mappings' && S.ix.byIri[r.parts[1]]) main.innerHTML = renderMappings(r.parts[1]);
    else if (DATA_TABS[view]) { S.q = r.params.get('q') || ''; if ($('#q') !== document.activeElement) $('#q').value = S.q; main.innerHTML = renderDataList(view); }
    else if (view === 'source' && sourceOf(r.parts[1])) main.innerHTML = renderSource(r.parts[1]);
    else if (view === 'table' && tableOf(r.parts[1])) main.innerHTML = renderTable(r.parts[1]);
    else if (view === 'vg' && vgOf(r.parts[1])) main.innerHTML = renderVg(r.parts[1]);
    else { document.body.dataset.view = 'home'; main.innerHTML = renderHome(); }
    if (/^(home|models)$/.test(document.body.dataset.view)) S.facets = noFacets(); // browsing, not searching
    renderTabs(document.body.dataset.view, r);
    if (view === 'model') mountModelGraph(r.parts[1]);
    if (S.drawer) renderDrawer();
    updateCartButton();
    updateChrome();
    renderDock();
    scheduleSave();
  }
  function refresh() {
    var main = $('#main'), top = main.scrollTop;
    render();
    main.scrollTop = top;
  }

  /* ------------------------------------------------------------------ browse tabs
     Under the search box on every page once something is read, in three groups: where things live
     (databases, models), the model's parts (one tab per kind), and the data side (sources, tables,
     virtual graphs, mapping blocks). While searching, each tab counts its matches and All lists
     every part that matches. */
  function dbCount() { return modelGroups().filter(function (g) { return g.db; }).length; }
  function activeTab(view, r) {
    if (view === 'home') return dbCount() ? 'databases' : 'models';
    if (view === 'models' || view === 'model') return 'models';
    if (DATA_TABS[view]) return view;
    if (view === 'source' || view === 'table') return view + 's';
    if (view === 'vg') return 'vgs';
    if (view === 'mappings') { var f = S.ix.byIri[r.parts[1]]; return f ? f.kind : ''; }
    if (view === 'search') return S.facets.kinds.length === 1 ? S.facets.kinds[0] : S.q ? 'all' : '';
    if (view === 'item') { var c = S.ix.byIri[r.parts[1]]; return c ? c.kind : ''; }
    return '';
  }
  function renderTabs(view, r) {
    var el = $('#navtabs'); if (!el) return;
    if (!S.ix || view === 'start') { el.innerHTML = ''; return; }
    var ix = S.ix, on = activeTab(view, r), nDb = dbCount(), q = view === 'search' || DATA_TABS[view] ? S.q.trim() : '', n = {}, all = 0;
    if (q) n = GF.facetCounts(ix, S.q, S.facets).kinds;
    else ix.list.forEach(function (c) { n[c.kind] = (n[c.kind] || 0) + 1; });
    GF.KIND_ORDER.forEach(function (k) { all += n[k] || 0; });
    function tab(id, label, count, attr) {
      return '<button ' + attr + (on === id ? ' class="on" aria-current="page"' : '') + '>' + esc(label) + '<span class="n">' + (count || 0).toLocaleString() + '</span></button>';
    }
    // where things live | the model's parts | the data side
    var h = [], gap = '<span class="gap" aria-hidden="true"></span>', dq = q;
    var kindTab = function (k) { return tab(k, K[k].plural, n[k], 'data-kindsearch="' + k + '"' + (q ? ' title="' + esc(K[k].plural) + ' matching “' + esc(q) + '”"' : '')); };
    var dataTab = function (k) { return tab(k, DATA_TABS[k], dataRows(k, dq).length, 'data-tab="' + k + '"' + (dq ? ' title="' + esc(DATA_TABS[k]) + ' matching “' + esc(dq) + '”"' : '')); };
    if (nDb) h.push(tab('databases', 'Databases', nDb, 'data-tab="databases"'));
    h.push(tab('models', 'Models', ix.modelOrder.length, 'data-tab="models"'));
    h.push(gap);
    if (q) h.push(tab('all', 'All', all, 'data-tab="all" title="Every match for “' + esc(q) + '”"'));
    GF.KIND_ORDER.filter(function (k) { return k !== 'mapping'; }).forEach(function (k) { h.push(kindTab(k)); });
    h.push(gap);
    ['sources', 'tables', 'vgs'].forEach(function (k) { h.push(dataTab(k)); });
    h.push(kindTab('mapping'));
    el.innerHTML = h.join('');
  }
  function tabAction(id) {
    if (id === 'databases' || id === 'models') { $('#q').value = ''; S.q = ''; go(id === 'models' && dbCount() ? '#/models' : '#/'); return; }
    if (DATA_TABS[id]) { var q = $('#q').value.trim(); go('#/' + id + (q ? '?q=' + enc(q) : '')); return; }
    if (id === 'all') { S.facets.kinds = []; go('#/search?q=' + enc($('#q').value)); }
  }
  /* ------------------------------------------------------------------ data tables
     Lists are tables: one row per thing, its name first, the facts that tell rows apart in columns.
     cols: [{h, num, cls, cell(row) → html}]; rowAttr(row) → the <tr>'s attributes (a link). */
  function dtable(cols, rows, rowAttr) {
    return '<div class="tablewrap"><table class="dtable"><thead><tr>' + cols.map(function (c) { return '<th' + (c.num ? ' class="num"' : '') + '>' + esc(c.h) + '</th>'; }).join('') + '</tr></thead><tbody>' +
      rows.map(function (r) {
        return '<tr' + (rowAttr ? ' ' + rowAttr(r) : '') + '>' + cols.map(function (c) {
          var v = c.cell(r); v = v == null ? '' : String(v);
          return '<td' + (c.num ? ' class="num' + (v === '0' ? ' zero' : '') + '"' : c.cls ? ' class="' + c.cls + '"' : '') + '>' + v + '</td>';
        }).join('') + '</tr>';
      }).join('') + '</tbody></table></div>';
  }
  function uniq(a) { var o = []; a.forEach(function (x) { if (x && o.indexOf(x) < 0) o.push(x); }); return o; }
  function oneLine(t) { return String(t || '').split(/\n/)[0]; }
  function nameCell(label, desc, mono) { return (mono ? '<span class="mono">' + esc(label) + '</span>' : esc(label)) + (desc ? '<span class="d">' + esc(desc) + '</span>' : ''); }
  function chips(iris, max) {
    if (!iris || !iris.length) return '<span class="dim">—</span>';
    max = max || 4;
    return iris.slice(0, max).map(function (i) { return S.ix.byIri[i] ? '<a class="ref" data-open="' + esc(i) + '">' + esc(lbl(i)) + '</a>' : '<span class="ref mono" title="' + esc(i) + '">' + esc(GF.localName(i)) + '</span>'; }).join('') +
      (iris.length > max ? '<span class="small dim">+' + (iris.length - max) + '</span>' : '');
  }
  function dataCell(c) {
    var s = GF.sourcesFor(S.ix, c);
    return s.length ? esc(s.map(srcLabel).join(', ')) : S.ix.rulesInferring[c.iri] ? '<span class="dim">derived by a rule</span>' : '<span class="dim">—</span>';
  }
  function ownProps(iri, kind) { return (S.ix.propsByDomain[iri] || []).filter(function (p) { return S.ix.byIri[p].kind === kind; }); }
  var COL = {
    name: { h: 'Name', cls: 'nm', cell: function (c) { return nameCell(c.label, oneLine(c.definition)); } },
    model: { h: 'Model', cls: 'clip', cell: function (c) { return esc(modelName(c.model)); } },
    data: { h: 'Data from', cls: 'clip', cell: dataCell },
    reused: { h: 'Reused', num: true, cell: function (c) { return S.ix.takenCount[c.iri] || 0; } },
    add: { h: '', cls: 'act', cell: function (c) { return addBtn(c.iri, 'small'); } }
  };
  /* The columns each kind of part is told apart by. */
  function partCols(kind) {
    var ix = S.ix;
    if (kind === 'class') return [COL.name,
      { h: 'Attributes', num: true, cell: function (c) { return ownProps(c.iri, 'datatypeProperty').length; } },
      { h: 'Relationships', num: true, cell: function (c) { return ownProps(c.iri, 'objectProperty').length + (ix.propsByRange[c.iri] || []).length; } },
      { h: 'Subclasses', num: true, cell: function (c) { return (ix.subClasses[c.iri] || []).length; } },
      COL.model, COL.data, COL.reused, COL.add];
    if (kind === 'objectProperty') return [COL.name, { h: 'From', cls: 'clip', cell: function (c) { return chips(c.froms, 2); } }, { h: 'To', cls: 'clip', cell: function (c) { return chips(c.tos, 2); } }, COL.model, COL.data, COL.reused, COL.add];
    if (kind === 'datatypeProperty') return [COL.name, { h: 'Of', cls: 'clip', cell: function (c) { return chips(c.froms, 2); } },
      { h: 'Type', cell: function (c) { var r = c.range || c.tos[0]; return r ? '<span class="mono small">' + esc(GF.pnOf(ix, r)) + '</span>' : ''; } }, COL.model, COL.data, COL.reused, COL.add];
    if (kind === 'rule') return [COL.name, { h: 'Derives', cls: 'clip', cell: function (c) { return chips(c.infers, 3); } }, { h: 'Uses', cls: 'clip', cell: function (c) { return chips(c.uses, 3); } }, COL.model, COL.reused, COL.add];
    if (kind === 'mapping') return [COL.name, { h: 'Source', cls: 'clip', cell: function (c) { return srcChip(c.dataSource); } },
      { h: 'Table', cls: 'clip', cell: function (c) { return tableChip(tableKey(c)); } },
      { h: 'Fills', cls: 'clip', cell: function (c) { return chips(c.populates.filter(function (p) { return ix.byIri[p] && ix.byIri[p].kind === 'class'; }), 3); } },
      { h: 'Terms', num: true, cell: function (c) { return c.populates.length; } }, COL.model, COL.reused, COL.add];
    return [COL.name, { h: 'Kind', cell: function (c) { return esc(kindWord(c)); } }, COL.model, { h: 'Details', cls: 'clip', cell: cardMeta }, COL.add];
  }
  function partsTable(list, kind) { return dtable(partCols(kind), list, function (c) { return 'data-open="' + esc(c.iri) + '"'; }); }
  /* A short list of parts (item page sections, notes): name, what it is to this page, model. */
  function listTable(iris, noteFn) {
    return dtable([
      { h: 'Name', cls: 'nm', cell: function (i) { var c = S.ix.byIri[i]; return c ? esc(c.label) : '<span class="dim mono">' + esc(GF.localName(i)) + '</span>'; } },
      { h: 'Details', cls: 'clip', cell: function (i) { var c = S.ix.byIri[i], n = noteFn ? noteFn(i) : null; return esc(n != null ? n : c ? kindWord(c) : GF.pnOf(S.ix, i)); } },
      { h: 'Model', cls: 'clip', cell: function (i) { var c = S.ix.byIri[i]; return c ? esc(modelName(c.model)) : ''; } },
      { h: '', cls: 'act', cell: function (i) { return S.ix.byIri[i] ? addBtn(i, 'small') : ''; } }
    ], iris, function (i) { return S.ix.byIri[i] ? 'data-open="' + esc(i) + '"' : ''; });
  }

  /* ------------------------------------------------------------------ models */
  function kindTally(comps) { var n = {}; comps.forEach(function (c) { n[c.kind] = (n[c.kind] || 0) + 1; }); return n; }
  function modelsTable(ids) {
    var ix = S.ix, tally = {};
    ids.forEach(function (id) { tally[id] = kindTally(GF.modelMembers(ix, id)); });
    var count = function (k) { return { h: K[k].plural, num: true, cell: function (id) { return tally[id][k] || 0; } }; };
    return dtable([
      { h: 'Model', cls: 'nm', cell: function (id) { var m = ix.models[id]; return nameCell(m.label, m.useCase && m.useCase !== m.description ? m.useCase : ''); } },
      { h: 'Database', cls: 'clip', cell: function (id) { var m = ix.models[id]; return m.database ? '<span class="mono small">' + esc(m.database) + '</span>' : '<span class="dim">—</span>'; } },
      count('class'), count('objectProperty'), count('datatypeProperty'), count('rule'), count('mapping'),
      { h: 'Reuses', cls: 'clip', cell: function (id) {
        var m = ix.models[id], shared = GF.modelMembers(ix, id).filter(function (c) { return c.model !== id; }).length;
        return m.composedOf && m.composedOf.length ? 'combines ' + esc(m.composedOf.map(modelName).join(', ')) : shared ? shared + ' parts from other models' : '<span class="dim">—</span>';
      } }
    ], ids, function (id) { return 'data-model="' + esc(id) + '"'; });
  }
  function renderModels(db) {
    var ix = S.ix, ids = ix.modelOrder.filter(function (id) { return !db || ix.models[id].database === db; });
    return '<div class="page">' + (db ? '<button class="ghost back" data-back>← Back</button>' : '') + '<div class="pagehead"><h1>Models</h1><span class="dim">' + ids.length + (db ? ' in <span class="mono">' + esc(db) + '</span>' : '') + '</span></div>' +
      '<p class="small muted" style="margin:0 0 12px">Each model is a reasoning schema: the classes, relationships, attributes and rules one use case defined.</p>' + modelsTable(ids) + '</div>';

  /* Requests for one connection: multipart for database creation, form fields for queries and updates. */
  function stepIo(c) {
    return {
      send: function (x, body) {
        var r = GF.stepRequest(x, body), payload = r.body;
        if (r.form) { payload = new FormData(); Object.keys(r.form).forEach(function (k) { payload.append(k, r.form[k]); }); } // the browser sets the boundary
        return sd(c, r.method, r.path, payload, r.accept, r.contentType);
      },
      progress: function (out) { if (S.co) { S.co.progress = out.slice(); if (S.co.step === 3) renderCheckout(); } }
    };
  }
  function finishCheckout(io) {
    var co = S.co, t = co.target, c = co.connId && connById(co.connId);
    var id = 'ck-' + Date.now().toString(36);
    t.server = c ? c.endpoint : '';
    var man = GF.buildManifest(S.ix, S.cart, t, { id: id, when: now(), who: co.who.trim(), simulated: !c });
    co.manifest = man; co.step = 3;
    if (!c) {
      man.plan.steps.forEach(function (x) { log('request', x.method + ' ' + x.path + ' — rehearsal, not sent', x.body || ''); });
      log('action', 'Checkout rehearsed: ' + t.useCase + ' (' + man.items.length + ' components → ' + t.database + ')');
      S.catalog.log.push(GF.logEntryFromManifest(man));
      S.ix = GF.buildIndex(S.catalog);
      renderCheckout();
      return Promise.resolve(man);
    }
    co.running = true; co.progress = []; renderCheckout();
    log('action', 'Deploying ' + t.useCase + ' to ' + c.endpoint + ', database ' + t.database);
    return Promise.resolve(GF.runCheckout(man.plan, io || stepIo(c), { serverDbs: c.dbs.slice() })).then(function (r) {
      man.run = r; co.running = false;
      var did = function (sid) { return r.steps.some(function (x) { return x.id === sid && x.state === 'done'; }); };
      if (did('create-db') && c.dbs.indexOf(t.database) < 0) { c.dbs.push(t.database); c.dbs.sort(); }
      if (did('model')) { S.catalog.log.push(GF.logEntryFromManifest(man)); S.ix = GF.buildIndex(S.catalog); }
      log('action', (r.ok ? 'Deployed ' : 'Deployment stopped: ') + t.useCase + ' → ' + t.database + ' on ' + c.endpoint + ' (' + r.steps.filter(function (x) { return x.state === 'warn' || x.state === 'failed'; }).length + ' to look at)');

      if (S.source !== 'sample' || !S.ix || !$('#sampleNote .sn-b')) return 'samples not back: ' + S.source;
      if (had.some(function (i) { return !inCart(i); })) return 'cart not back: ' + S.cart.length + ' of ' + had.length;
      $('#sampleNote [data-closenote]').click();
      var d = $('#sampleNote').textContent || $('#sampleTag').hidden ? 'note did not fold into the tag' : '';
      $('#sampleTag').click(); return d || ($('#sampleNote .sn-b') ? '' : 'tag did not reopen the note');
    });
    // a deployment against a stand-in server: every step is sent in order and read back
    function deployTest() {
      var name = 'ui: checkout to a server sends every step and reads back';
      S.cart = [GF.expand('c360:Customer', S.ix.prefixes), GF.expand('core:Party', S.ix.prefixes), 'urn:mapping:c360:customer'];
      var fake = { id: 'cx-run', name: 'test server', endpoint: 'https://test.invalid', authMode: 'basic', username: 'u', password: '', jwt: '', catalogDb: 'catalog', dbs: ['other'], pick: {}, filter: '', progress: [], loaded: [], catalog: null };
      S.conns.push(fake);
      openCheckout(); S.co.connId = 'cx-run'; S.co.step = 2; S.co.confirm = true; renderCheckout();
      var sent = [], opts = { 'reasoning.schemas': [] };
      var rows = function (b) { return JSON.stringify({ results: { bindings: b } }); };
      var io = { progress: function (out) { S.co.progress = out.slice(); }, send: function (x, body) {
        sent.push(x.id);
        if (x.id === 'schema') { opts = JSON.parse(body); return Promise.resolve(''); }
        if (x.id === 'verify-schema') return Promise.resolve(JSON.stringify(opts));
        if (x.id === 'check-sources') return Promise.resolve(JSON.stringify({ data_sources: ['crm_postgres'] }));
        if (x.id === 'verify-model') return Promise.resolve(rows([{ n: { type: 'literal', value: '50' } }]));
        if (x.id === 'verify-log') return Promise.resolve(JSON.stringify({ boolean: true }));
        if (x.id.indexOf('verify') === 0) return Promise.resolve(rows([{ s: { type: 'uri', value: 'urn:x' } }]));
        return Promise.resolve('');
      } };
      return finishCheckout(io).then(function (man) {
        var d = man.run && man.run.ok && sent[0] === 'create-db' && sent.indexOf('model') > 0 && sent.indexOf('vg-crm_postgres') > 0 && $$('.runlist div').length >= 6 && fake.dbs.indexOf(S.co.target.database) >= 0 ? '' :
          'sent ' + sent.join(',') + ' ok ' + (man.run && man.run.ok) + ' rows ' + $$('.runlist div').length;
        results.push({ name: name, status: d ? 'fail' : 'pass', detail: d });
      }).catch(function (e) { results.push({ name: name, status: 'fail', detail: 'threw: ' + e.message }); })
        .then(function () { S.conns = S.conns.filter(function (c) { return c !== fake; }); });
    }
    return deployTest().then(function () {
    $('#layer').innerHTML = ''; S.co = null; S.cart = saved; S.wantCart = []; S.asm.title = ''; S.asm.notes = noNotes(); S.start = { filter: '' }; location.hash = '#/'; render();
    var failed = results.filter(function (r) { return r.status === 'fail'; });
    window.__selfTestResults = { ok: !failed.length, passed: results.length - failed.length, failed: failed.length, failures: failed, results: results };
    var b = document.createElement('div'); b.id = 'selftestBanner';
    b.style.background = failed.length ? 'var(--danger)' : 'var(--accent)';
    b.innerHTML = esc(failed.length ? 'Self-test: ' + failed.length + ' failed' : 'Self-test: all ' + results.length + ' passed') + ' <button class="ghost small" data-closebanner title="Hide" aria-label="Hide">✕</button>';
    b.title = failed.map(function (f) { return f.name + ': ' + f.detail; }).join('\n');
    document.body.appendChild(b);
    console.log('[selftest] ' + b.firstChild.textContent);
    });
  }

  // diagnostics hook, only with ?debug=1 or ?selftest=1: it holds the signed-in connections, so a normal page never exposes it
  if (/[?&](debug=1|selftest)/.test(location.search)) window.__GF_APP = { state: S, render: render, addToCart: addToCart, sd: sd, sparql: sparql, connById: connById };
  boot();
})();
</script>
