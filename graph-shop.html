      // file text -> { project, version, format }
      async function sdxFileTextToProject(text) {
        const std = String(text || "").trim().replace(/-/g, "+").replace(/_/g, "/");
        let bin;
        try { bin = atob(std); } catch { throw new Error("not a Designer project file (not base64 text)"); }
        let project, version, format;
        let star = null;
        try {
          const raw = new Uint8Array(bin.length);
          for (let i = 0; i < bin.length; i++) raw[i] = bin.charCodeAt(i);
          const inflated = await sdxInflate(raw);
          if (inflated[0] === 83 && inflated[1] === 84 && inflated[2] === 65 && inflated[3] === 82) star = inflated;
        } catch { /* older files are read below */ }
        if (star) {
          const { doc, headers } = sdxReadStar(star);
          project = sdxReadYjsUpdate(doc);
          version = parseInt(headers.migration_version || "0", 10) || 0;
          format = "current";
        } else {
          let escaped = "";
          for (let i = 0; i < bin.length; i++) escaped += "%" + ("00" + bin.charCodeAt(i).toString(16)).slice(-2);
          let decoded;
          try { decoded = decodeURIComponent(escaped); } catch { throw new Error("not a Designer project file"); }
          const bytes = Uint8Array.from(Array.from(decoded, (c) => c.charCodeAt(0)));
          let json;
          try { json = JSON.parse(new TextDecoder().decode(await sdxInflate(bytes))); } catch { throw new Error("not a Designer project file"); }
          if (!json?.state?.projects?.projectsById) throw new Error("not a Designer project file (no project inside)");
          project = Object.values(json.state.projects.projectsById)[0];
          version = Number(json.version) || 0;
          format = "older";
        }
        if (!project || !project.diagram) throw new Error("the file holds no project diagram");
        const model = project.diagram.model || {};
        if (!model.nodeDataArray && model.modelData?.nodeDataArray) model.nodeDataArray = model.modelData.nodeDataArray;
        return { project, version, format };
      }

      // ---- Designer project -> the app's artifacts (model Turtle, rules Turtle, SMS2 per data source, unique keys) ----
      function sdxProjectToArtifacts(project) {
        const report = { notes: [], skipped: [] };
        const model = project.diagram?.model || {};
        const md = model.modelData || {};
        const nodes = model.nodeDataArray || md.nodeDataArray || [];
        const links = model.linkDataArray || [];
        const modelEntry = (project.modelsById || {})[project.targetModelId] || Object.values(project.modelsById || {})[0] || {};
        const ns = String(modelEntry.namespace || project.dataNamespace || "");
        let prefix = String(modelEntry.prefix || "ex");
        if (!/^[A-Za-z][A-Za-z0-9_-]*$/.test(prefix) || ["rdf", "rdfs", "owl", "xsd", "so", "stardog"].includes(prefix)) prefix = "ex";
        const labels = md.labelsByIri || {};
        const labelOf = (iriText) => labels[iriText] || sdxLocalName(iriText);
        const known = [[SDX_RDFS, "rdfs"], [SDX_OWL, "owl"], [SDX_XSD, "xsd"], [SDX_SO, "so"], [SDX_RDF, "rdf"]];
        const short = (iriText) => {
          for (const [base, p] of known) { const l = iriText.slice(base.length); if (iriText.startsWith(base) && /^[A-Za-z_][A-Za-z0-9_-]*$/.test(l)) return `${p}:${l}`; }
          if (ns && iriText.startsWith(ns)) { const l = iriText.slice(ns.length); if (/^[A-Za-z_][A-Za-z0-9_-]*$/.test(l)) return `${prefix}:${l}`; }
          return `<${iriText}>`;
        };
        const lit = (s) => `"${String(s).replace(/\\/g, "\\\\").replace(/"/g, '\\"').replace(/\n/g, "\\n").replace(/\r/g, "\\r")}"`;
        const long = (s) => `"""${String(s).replace(/\\/g, "\\\\").replace(/"""/g, '\\"\\"\\"').replace(/"$/, '\\"')}"""`;

        // model
        const classes = nodes.filter((n) => n.category === "MODEL_CONCEPT_CLASS").map((n) => n.value);
        const parents = {};
        links.filter((l) => l.category === "MODEL_CONCEPT_HIERARCHY").forEach((l) => {
          const sub = String(l.from || "").replace(/^MODEL_CONCEPT_CLASS-/, ""), sup = String(l.to || "").replace(/^MODEL_CONCEPT_CLASS-/, "");
          (parents[sub] = parents[sub] || []).push(sup);
        });
        const relProps = new Map();
        links.filter((l) => l.category === "MODEL_CONCEPT_RELATIONSHIP" && l.from && l.to).forEach((l) => {
          const e = relProps.get(l.value) || { doms: new Set(), rngs: new Set() };
          e.doms.add(String(l.from).replace(/^MODEL_CONCEPT_CLASS-/, "")); e.rngs.add(String(l.to).replace(/^MODEL_CONCEPT_CLASS-/, ""));
          relProps.set(l.value, e);
        });
        const propUsesRdfs = (iriText) => project.propertyType === "RDFS" || (project.propertyType === "CUSTOM" && (md.propertyTypesByIri || {})[iriText] === "RDFS");
        const out = [`@prefix rdf: <${SDX_RDF}> .`, `@prefix rdfs: <${SDX_RDFS}> .`, `@prefix owl: <${SDX_OWL}> .`, `@prefix xsd: <${SDX_XSD}> .`, `@prefix so: <${SDX_SO}> .`];
        if (ns) out.push(`@prefix ${prefix}: <${ns}> .`);
        out.push("");
        const comment = (iriText) => (md.descriptionsByIri || {})[iriText];
        classes.forEach((c) => {
          const lines = ["a owl:Class", `rdfs:label ${lit(labelOf(c))}`];
          if (comment(c)) lines.push(`rdfs:comment ${lit(comment(c))}`);
          const colour = (md.colorIdsByIri || {})[c];
          if (colour) lines.push(`<${SDX_COLOR_PRED}> ${lit(colour)}`);
          if ((parents[c] || []).length) lines.push(`rdfs:subClassOf ${[...new Set(parents[c])].map(short).join(", ")}`);
          out.push(`${short(c)} ${lines.join(" ;\n    ")} .`, "");
        });
        const propBlock = (iriText, type, doms, rngs) => {
          const rdfs = propUsesRdfs(iriText);
          const lines = [`a ${type}`, `rdfs:label ${lit(labelOf(iriText))}`];
          if (comment(iriText)) lines.push(`rdfs:comment ${lit(comment(iriText))}`);
          if (doms.length) lines.push(`${rdfs ? "rdfs:domain" : "so:domainIncludes"} ${doms.map(short).join(", ")}`);
          if (rngs.length) lines.push(`${rdfs ? "rdfs:range" : "so:rangeIncludes"} ${rngs.map(short).join(", ")}`);
          return `${short(iriText)} ${lines.join(" ;\n    ")} .`;
        };
        relProps.forEach((e, iriText) => out.push(propBlock(iriText, "owl:ObjectProperty", [...e.doms], [...e.rngs]), ""));
        Object.values(md.attributesByIri || {}).forEach((a) => out.push(propBlock(a.value, "owl:DatatypeProperty", Object.keys(a.domains || {}), Object.keys(a.ranges || {})), ""));
        const modelTtl = out.join("\n").replace(/\n+$/, "\n");

        // rules
        const ruleOut = [`@prefix rdfs: <${SDX_RDFS}> .`, "@prefix stardog: <tag:stardog:api:> .", ""];
        let ruleCount = 0;
        Object.values(md.rulesById || {}).forEach((r) => {
          if (!r.text) { report.skipped.push(`rule "${r.name || r.id}" was built with Designer's rule builder and has no text form here`); return; }
          const subj = /^[A-Za-z][A-Za-z0-9+.-]*:/.test(String(r.id)) ? `<${r.id}>` : `<urn:designer:rule:${encodeURIComponent(r.id)}>`;
          ruleOut.push(`${subj} a stardog:rule:SPARQLRule ;\n    rdfs:label ${lit(r.name || "")} ;\n    stardog:rule:content ${long(r.text)} .`, "");
          ruleCount++;
        });
        const rulesTtl = ruleCount ? ruleOut.join("\n").replace(/\n+$/, "\n") : "";

        // mappings
        const resources = new Map(nodes.filter((n) => n.category === "RESOURCE").map((n) => [n.key, n]));
        const classMappingsByRes = new Map(), relMaps = links.filter((l) => l.category === "RELATIONSHIP_MAPPING");
        links.filter((l) => l.category === "MAPPING").forEach((l) => { (classMappingsByRes.get(l.from) || classMappingsByRes.set(l.from, []).get(l.from)).push(l); });
        const attrs = md.attributesByIri || {};
        const esc = (s) => String(s || "").replace(/["\\]/g, "\\$&");
        const safeVar = (s) => String(s).replace(/\W/g, "_");
        const groups = new Map();      // data source -> { blocks: [], info }
        const uniqueSets = [];
        classMappingsByRes.forEach((maps, resKey) => {
          const resNode = resources.get(resKey);
          const id = String(resKey).replace(/^RESOURCE-/, "");
          const vg = (project.virtualGraphsById || {})[id];
          if (!resNode) return;
          if (resNode.type !== "VIRTUAL_GRAPH" || !vg) { report.skipped.push(`"${resNode.text || id}" is an uploaded file; its mappings read the file, not a SQL source, so they are not loaded`); return; }
          const sql = typeof vg.from === "string" ? vg.from : (vg.from && (vg.from.text || vg.from.value)) ? `SELECT * FROM ${vg.from.text || vg.from.value}` : "";
          if (!sql) { report.skipped.push(`"${resNode.text || id}" has no source table or query`); return; }
          const badCol = (resNode.fields || []).find((f) => !/^[A-Za-z_][A-Za-z0-9_]*$/.test(f.value));
          if (badCol) { report.skipped.push(`"${resNode.text || id}" has a column name that is not a plain identifier (${badCol.value}), so its mappings are not loaded`); return; }
          const used = {}, seenBinding = {}, bindings = [], subjects = {};
          const uniq = (v) => { if (used[v] === undefined) { used[v] = 0; return v; } used[v] += 1; return `${v}_${used[v]}`; };
          const identify = (cls, pid) => {
            const key = `${cls}-${pid.baseIri}-${pid.parts.map((p) => p.value).join("-")}`;
            if (seenBinding[key]) return { binding: null, variable: seenBinding[key] };
            const tpl = pid.parts.reduce((s, p) => (p.type === "delimiter" ? s + p.value : `${s}{${esc(p.value)}}`), "");
            const variable = uniq(`?${safeVar(labelOf(cls))}_iri`);
            seenBinding[key] = variable;
            let d, noBase = false;
            if (pid.baseIri === null || pid.baseIri === undefined) { d = ns ? `${ns}${sdxLocalName(cls)}:` : ""; if (d === "") noBase = true; } else d = pid.baseIri;
            if (pid.parts.some((p) => p.type === "field")) {
              const binding = noBase ? `BIND(TEMPLATE("${cls}-${tpl}") AS ${variable})`
                : (d === "" && pid.parts.length === 1 && pid.parts[0].type === "field") ? `BIND(IRI(?${pid.parts[0].value}) AS ${variable})` : `BIND(TEMPLATE("${d}${tpl}") AS ${variable})`;
              return { binding, variable };
            }
            return { binding: null, variable: `<${noBase ? cls + "-" : d}${pid.parts.map((p) => p.value).join("")}>` };
          };
          const valid = (m) => m.to && m.primaryIdentifier && (m.primaryIdentifier.parts || []).some((p) => p.type === "field")
            && !(m.primaryIdentifier.parts || []).some((p) => p.type === "field" && !(m.fields || {})[p.value]);
          const good = maps.filter((m) => { if (!valid(m)) { report.skipped.push(`mapping "${m.text || m.key}" has an incomplete identifier`); return false; } return true; });
          good.forEach((m) => {
            const cls = String(m.to).replace(/^MODEL_CONCEPT_CLASS-/, "");
            const { binding, variable } = identify(cls, m.primaryIdentifier);
            if (binding) bindings.push(binding);
            if (!subjects[variable]) subjects[variable] = m.setClassType ? [`a <${cls}>`] : [];
            Object.values(m.fields || {}).forEach((f) => uniq(`?${f.value}`));
            if (m.label) subjects[variable].push(`<${SDX_RDFS}label> ?${m.label}`);
            Object.values(m.fields || {}).sort((a, b) => (a.value < b.value ? -1 : a.value > b.value ? 1 : 0)).forEach((f) => {
              (f.targets || []).forEach((t) => {
                const a = attrs[t];
                if (!a) return;
                const fieldVar = safeVar(f.label || f.value);
                Object.values(a.ranges || {}).map((r) => r.value).sort().forEach((range) => {
                  if (range !== `${SDX_XSD}string`) {
                    const v = uniq(`?${fieldVar}_${safeVar(labelOf(range))}_field`);
                    const triple = `<${t}> ${v}`;
                    if (!subjects[variable].includes(triple)) { subjects[variable].push(triple); bindings.push(`BIND(StrDt(?${f.value}, <${range}>) AS ${v})`); }
                  } else {
                    const triple = `<${t}> ?${f.value}`;
                    if (!subjects[variable].includes(triple)) subjects[variable].push(triple);
                  }
                });
              });
            });
            if ((m.uniqueKeySets || []).length) {
              const table = sdxSqlFirstTable(sql) || resNode.text || id;
              const entry = `(${m.uniqueKeySets.map((c) => `${table}.${c}`).join(", ")})`;
              if (!uniqueSets.includes(entry)) uniqueSets.push(entry);
            }
          });
          const extra = new Set();
          relMaps.forEach((r) => {
            const own = good.find((m) => m.key === (r.from || r.to));
            if (!own) return;
            const rel = links.find((l) => l.category === "MODEL_CONCEPT_RELATIONSHIP" && l.value === r.relationshipIri && l.from && l.to);
            if (!rel) return;
            let fc, fp, tc, tp;
            if (r.from) { fc = String(own.to).replace(/^MODEL_CONCEPT_CLASS-/, ""); fp = own.primaryIdentifier; } else if (r.fromClassIri && r.fromPrimaryIdentifier) { fc = r.fromClassIri; fp = r.fromPrimaryIdentifier; }
            if (r.to) { tc = String(own.to).replace(/^MODEL_CONCEPT_CLASS-/, ""); tp = own.primaryIdentifier; } else if (r.toClassIri && r.toPrimaryIdentifier) { tc = r.toClassIri; tp = r.toPrimaryIdentifier; }
            if (!(fc && tc && fp && tp)) return;
            const a = identify(fc, fp), b = identify(tc, tp);
            if (a.binding) bindings.push(a.binding);
            if (b.binding) bindings.push(b.binding);
            if (a.variable.startsWith("<")) extra.add(`${a.variable} a <${fc}>`);
            if (b.variable.startsWith("<")) extra.add(`${b.variable} a <${tc}>`);
            extra.add(`${a.variable} <${rel.value}> ${b.variable}`);
          });
          const toLines = Object.entries(subjects).filter(([, t]) => t.length).sort(([x], [y]) => (x < y ? -1 : x > y ? 1 : 0)).map(([v, t]) => `${v} ${t.join(" ;\n    ")} .`).join("\n\n  ");
          const extraLines = extra.size ? `\n\n  ${[...extra].sort().join(" .\n\n  ")} .` : "";
          const block = `# ${resNode.text || id}\nMAPPING\nFROM SQL {\n  ${sql}\n}\nTO {\n  ${toLines}${extraLines}\n}\nWHERE {\n  ${bindings.join("\n  ")}\n}`;
          const groupName = String(vg.dataSourceId || resNode.text || "designer");
          if (!groups.has(groupName)) groups.set(groupName, { blocks: [], info: { id: vg.dataSourceId || "", type: vg.dataSourceType || "", endpoint: vg.dataSourceEndpoint || "", options: vg.options } });
          groups.get(groupName).blocks.push(block);
        });
        const mappingsByVg = {}, dataSources = {};
        groups.forEach((g, name) => { mappingsByVg[name] = g.blocks.join("\n\n;\n\n") + "\n"; dataSources[name] = g.info; });
        const fileResources = [...resources.values()].filter((r) => r.type === "FILE_UPLOAD" && !classMappingsByRes.has(r.key));
        fileResources.forEach((r) => report.notes.push(`"${r.text}" is an uploaded file with no mappings`));
        const counts = { classes: classes.length, relationships: relProps.size, attributes: Object.keys(attrs).length, rules: ruleCount, mappings: Object.values(mappingsByVg).reduce((n, t) => n + (t.match(/^MAPPING$/gm) || []).length, 0), dataSources: groups.size };
        return { modelTtl, rulesTtl, mappingsByVg, dataSources, uniqueKeysText: uniqueSets.join(", "), counts, report, name: project.name || "" };
      }

      // ---- Merging Designer projects: several at once, or one into what is already loaded ----
      // Everything below is pure text in, text out, so it can run without the page.
      // Rule: nothing already loaded is rewritten; anything new is appended, and what both sides hold once is kept once.
      function sdxTurtleLiteral(s) { return `"${String(s).replace(/\\/g, "\\\\").replace(/"/g, '\\"').replace(/\n/g, "\\n").replace(/\r/g, "\\r")}"`; }
      function sdxTurtleLongLiteral(s) { return `"""${String(s).replace(/\\/g, "\\\\").replace(/"""/g, '\\"\\"\\"').replace(/"$/, '\\"')}"""`; }
      function sdxNormSpace(s) { return String(s || "").replace(/\s+/g, " ").trim(); }

      // Model text: new statements are written under their own heading; a prefix name that the loaded text already uses for a
      // different namespace is renamed on the incoming side (ex -> ex2) so the two never get mixed up.
      function sdxMergeModelTurtle(baseText, addText, report) {
        const base = String(baseText || ""), add = String(addText || "");
        if (!add.trim()) return base;
        const pb = sdxParseTurtle(add);
        if (!base.trim()) return add;
        const pa = sdxParseTurtle(base);
        const key = (t) => [t.s.v, t.p.v, t.o.t, t.o.v, t.o.lang || "", t.o.dt || ""].join("\u0001");
        const have = new Set(pa.triples.map(key));
        const one = new Set([SDX_RDFS + "label", SDX_RDFS + "comment", SDX_COLOR_PRED]);
        const kept = new Map();
        pa.triples.forEach((t) => { if (one.has(t.p.v) && t.s.t === "iri" && t.o.t === "lit") kept.set(t.s.v + "\u0001" + t.p.v, t.o.v); });
        const fresh = [];
        pb.triples.forEach((t) => {
          if (t.s.t !== "iri" || (t.o.t !== "iri" && t.o.t !== "lit")) { report.notes.push("a statement about an unnamed node in an added model was not carried over"); return; }
          if (have.has(key(t))) return;
          if (one.has(t.p.v) && t.o.t === "lit") {
            const k = t.s.v + "\u0001" + t.p.v;
            if (kept.has(k)) { if (kept.get(k) !== t.o.v) report.notes.push(`${sdxLocalName(t.s.v)} is described twice (${sdxLocalName(t.p.v)}: "${kept.get(k)}" and "${t.o.v}"); the one already loaded was kept`); return; }
            kept.set(k, t.o.v);
          }
          have.add(key(t));
          fresh.push(t);
        });
        if (!fresh.length) return base;
        const names = Object.assign({}, pa.prefixes), byIri = new Map();
        Object.entries(names).forEach(([p, u]) => { if (!byIri.has(u)) byIri.set(u, p); });
        const incoming = [];
        Object.entries(pb.prefixes).forEach(([p, u]) => {
          if (byIri.has(u)) return;
          const stem = /^[A-Za-z][A-Za-z0-9_-]*$/.test(p) ? p : "ns";
          let name = stem, n = 1;
          while (names[name] !== undefined) { n += 1; name = stem + n; }
          names[name] = u; byIri.set(u, name); incoming.push([name, u]);
        });
        const used = new Set();
        const shorten = (v) => {
          let best = null;
          byIri.forEach((p, u) => { if (v.startsWith(u) && /^[A-Za-z_][A-Za-z0-9_-]*$/.test(v.slice(u.length)) && (!best || u.length > best.u.length)) best = { p, u }; });
          if (!best) return `<${v}>`;
          used.add(best.p);
          return `${best.p}:${v.slice(best.u.length)}`;
        };
        const term = (o) => {
          if (o.t === "iri") return shorten(o.v);
          const body = sdxTurtleLiteral(o.v);
          if (o.lang) return `${body}@${o.lang}`;
          return o.dt && o.dt !== SDX_XSD + "string" ? `${body}^^${shorten(o.dt)}` : body;
        };
        const bySubject = new Map();
        fresh.forEach((t) => { if (!bySubject.has(t.s.v)) bySubject.set(t.s.v, new Map()); const m = bySubject.get(t.s.v); if (!m.has(t.p.v)) m.set(t.p.v, []); m.get(t.p.v).push(term(t.o)); });
        const blocks = [];
        bySubject.forEach((preds, s) => {
          const lines = [];
          preds.forEach((objs, p) => lines.push(`${p === SDX_RDF + "type" ? "a" : shorten(p)} ${objs.join(", ")}`));
          blocks.push(`${shorten(s)} ${lines.join(" ;\n    ")} .`);
        });
        const decl = incoming.filter(([name]) => used.has(name)).map(([name, u]) => `@prefix ${name}: <${u}> .`);
        return (decl.length ? decl.join("\n") + "\n" : "") + base.replace(/\s+$/, "") + "\n\n# Added from another Designer project\n" + blocks.join("\n\n") + "\n";
      }

      // Rules: a rule whose text is already there is skipped; one that reuses a name but says something else gets a new name.
      function sdxMergeRulesTurtle(baseText, addText, report) {
        const base = String(baseText || ""), add = String(addText || "");
        if (!add.trim()) return base;
        if (!base.trim()) return add;
        const ra = sdxExtractRules(sdxParseTurtle(base).triples), rb = sdxExtractRules(sdxParseTurtle(add).triples);
        const haveText = new Set(ra.map((r) => sdxNormSpace(r.text)));
        const haveSubject = new Set(ra.filter((r) => r.subject.t === "iri").map((r) => r.subject.v));
        const blocks = [];
        rb.forEach((r) => {
          if (haveText.has(sdxNormSpace(r.text))) return;
          haveText.add(sdxNormSpace(r.text));
          let subject = r.subject.t === "iri" ? r.subject.v : `urn:designer:rule:added-${blocks.length + 1}`;
          if (haveSubject.has(subject)) {
            let n = 2;
            while (haveSubject.has(`${subject}-${n}`)) n += 1;
            report.notes.push(`a rule${r.label ? ` "${r.label}"` : ""} has the same name as a different rule already loaded; both were kept`);
            subject = `${subject}-${n}`;
          }
          haveSubject.add(subject);
          blocks.push(`<${subject}> a stardog:rule:SPARQLRule ;\n    rdfs:label ${sdxTurtleLiteral(r.label || "")} ;\n    stardog:rule:content ${sdxTurtleLongLiteral(r.text)} .`);
        });
        if (!blocks.length) return base;
        const decl = [];
        if (!/^\s*@?prefix\s+rdfs:/im.test(base)) decl.push(`@prefix rdfs: <${SDX_RDFS}> .`);
        if (!/^\s*@?prefix\s+stardog:/im.test(base)) decl.push("@prefix stardog: <tag:stardog:api:> .");
        return (decl.length ? decl.join("\n") + "\n" : "") + base.replace(/\s+$/, "") + "\n\n" + blocks.join("\n\n") + "\n";
      }

      // Mappings of one data source: each MAPPING block is kept once, however many projects carry it.
      function sdxMergeMappingText(baseText, addText) {
        const base = String(baseText || "").trim(), add = String(addText || "").trim();
        if (!add) return base;
        if (!base) return add;
        // generated subject variables (?Airport_iri) are named after the class label, so two projects that label a class differently still hold the same mapping
        const body = (b) => { const seenVars = {}; let n = 0; return sdxNormSpace(b.replace(/^(\s*#[^\n]*\n)+/, "").replace(/\?[A-Za-z_][A-Za-z0-9_]*_iri\b/g, (v) => seenVars[v] || (seenVars[v] = "?iri" + (n += 1)))); };
        const seen = new Set(base.split(/\n\s*;\s*\n/).map(body));
        const fresh = [];
        add.split(/\n\s*;\s*\n/).map((b) => b.trim().replace(/\n\s*;$/, "").trim()).filter(Boolean).forEach((b) => { if (!seen.has(body(b))) { seen.add(body(b)); fresh.push(b); } });
        if (!fresh.length) return base;
        return base.replace(/\n\s*;\s*$/, "").trimEnd() + "\n\n;\n\n" + fresh.join("\n\n;\n\n") + "\n";
      }

      // Unique keys: a key set is the same when it names the same columns, in any order.
      function sdxKeySetEntries(text) { return (String(text || "").match(/\([^()]*\)/g) || []).map((e) => ({ text: e.replace(/\s+/g, " "), canon: e.slice(1, -1).split(",").map((c) => c.trim().toLowerCase()).filter(Boolean).sort().join(",") })); }
      function sdxMergeUniqueKeys(baseText, addText) {
        const base = String(baseText || "").trim();
        const seen = new Set(sdxKeySetEntries(base).map((e) => e.canon));
        const fresh = [];
        sdxKeySetEntries(addText).forEach((e) => { if (e.canon && !seen.has(e.canon)) { seen.add(e.canon); fresh.push(e.text); } });
        if (!fresh.length) return base;
        return base ? base + (base.includes("\n") ? "\n" : ", ") + fresh.join(", ") : fresh.join(", ");
      }

      // base and add are the shape sdxProjectToArtifacts returns ({modelTtl, rulesTtl, mappingsByVg, dataSources, uniqueKeysText, report}).
      function sdxMergeArtifacts(base, add) {
        const report = { notes: [...(base.report?.notes || [])], skipped: [...(base.report?.skipped || [])] };
        (add.report?.notes || []).forEach((n) => { if (!report.notes.includes(n)) report.notes.push(n); });
        (add.report?.skipped || []).forEach((n) => { if (!report.skipped.includes(n)) report.skipped.push(n); });
        const mappingsByVg = Object.assign({}, base.mappingsByVg);
        Object.entries(add.mappingsByVg || {}).forEach(([vg, text]) => { mappingsByVg[vg] = sdxMergeMappingText(mappingsByVg[vg], text); });
        const dataSources = Object.assign({}, base.dataSources);
        Object.entries(add.dataSources || {}).forEach(([vg, info]) => {
          const cur = dataSources[vg];
          if (!cur) { dataSources[vg] = info; return; }
          const diff = ["id", "type", "endpoint"].filter((k) => cur[k] && info[k] && cur[k] !== info[k]);
          if (diff.length) report.notes.push(`data source "${vg}" is set up differently in two projects (${diff.join(", ")}); the one already loaded was kept`);
          else dataSources[vg] = Object.assign({}, info, cur, { id: cur.id || info.id, type: cur.type || info.type, endpoint: cur.endpoint || info.endpoint, options: cur.options || info.options });
        });
        return {
          modelTtl: sdxMergeModelTurtle(base.modelTtl, add.modelTtl, report),
          rulesTtl: sdxMergeRulesTurtle(base.rulesTtl, add.rulesTtl, report),
          mappingsByVg, dataSources,
          uniqueKeysText: sdxMergeUniqueKeys(base.uniqueKeysText, add.uniqueKeysText),
          report
        };
      }

      // What an artifact set holds, counted the same way for any text (so before and after a merge compare).
      function sdxCountArtifacts(a) {
        const m = sdxExtractModel(sdxParseTurtle(a.modelTtl || "").triples);
        return {
          classes: m.classes.length,
          relationships: new Set(m.relationships.map((r) => r.iri)).size,
          attributes: new Set(m.attributes.map((x) => x.iri)).size,
          rules: sdxExtractRules(sdxParseTurtle(a.rulesTtl || "").triples).length,
          mappings: Object.values(a.mappingsByVg || {}).reduce((n, t) => n + (String(t).match(/^MAPPING$/gm) || []).length, 0),
          dataSources: Object.keys(a.mappingsByVg || {}).length,
          uniqueKeys: new Set(sdxKeySetEntries(a.uniqueKeysText).map((e) => e.canon)).size
        };
      }

  /* ===== Graph Shop additions =====
     The cart as a Designer project. Each mapping block becomes one Designer mapping on a resource:
     - a source system the server knows (its connection details read from the server), or the details
       a Designer project recorded for it → a data source resource Designer can publish against;
     - otherwise (a block that loaded a file, an uploaded file, a source no server knows) → an
       uploaded CSV holding the rows that are available (the file's own rows, rows read back from the
       graph it loaded) or just the header, so the project opens and publishes on its own. */
  var XSD_STRING = "http://www.w3.org/2001/XMLSchema#string";
  var CSV_OPTIONS = { escape: '"', header: true, quote: '"', separator: ",", skipEmpty: true };
  var FILE_MARK = "\u0001file:";
  function gfUniq(a) { var o = []; a.forEach(function (x) { if (x && o.indexOf(x) < 0) o.push(x); }); return o; }
  function csvCell(v) { v = v == null ? "" : String(v); return /[",\r\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }
  function csvText(cols, rows) { return [cols].concat(rows || []).map(function (r) { return r.map(csvCell).join(","); }).join("\r\n") + "\r\n"; }
  /* Rows of a CSV text (quotes, doubled quotes, line breaks inside quotes). */
  function csvRows(text) {
    var rows = [], row = [], cell = "", q = false, s = String(text || "");
    for (var i = 0; i < s.length; i++) {
      var c = s[i];
      if (q) { if (c === '"') { if (s[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += c; continue; }
      if (c === '"') q = true;
      else if (c === ",") { row.push(cell); cell = ""; }
      else if (c === "\n" || c === "\r") { if (c === "\r" && s[i + 1] === "\n") i++; row.push(cell); cell = ""; if (row.length > 1 || row[0] !== "") rows.push(row); row = []; }
      else cell += c;
    }
    if (cell !== "" || row.length) { row.push(cell); rows.push(row); }
    return rows;
  }
  function tplCols(t) { return (String(t || "").match(/\{[^{}]+\}/g) || []).map(function (x) { return x.slice(1, -1); }); }
  function plainCol(c) { return /^[A-Za-z_][A-Za-z0-9_]*$/.test(c); }
  function fileName(s) { return String(s || "data").replace(/^.*[\/\\#:]/, "").replace(/\.csv$/i, "").replace(/[^A-Za-z0-9_]+/g, "_").replace(/^_+|_+$/g, "") || "data"; }
  /* The class a templated object of a block points to: the class another block mints that template
     for, else the property's own end. */
  function refClass(ix, m, b) {
    var t = GF.fullTemplate(ix, b.value), hit = ix.list.filter(function (x) { return x.kind === "mapping" && x.subjectTemplate && GF.fullTemplate(ix, x.subjectTemplate) === t; })[0];
    if (hit) return hit.subjectClass;
    var p = ix.byIri[b.prop], ends = p ? (b.inverse ? p.froms : p.tos) : [];
    return ends.filter(function (c) { return ix.byIri[c] && ix.byIri[c].kind === "class"; })[0] || "";
  }
  /* One block as SMS2 the reader above understands: full IRIs, linked things typed, columns that are
     not plain names read with sourceField(). keep: the properties to write (null = all). */
  function blockSms(ix, m, keep, sql) {
    var to = ["?subject a " + [m.subjectClass].concat(m.extraClasses || []).map(function (c) { return "<" + c + ">"; }).join(", ")];
    var where = ['BIND(TEMPLATE("' + GF.fullTemplate(ix, m.subjectTemplate) + '") AS ?subject)'], extra = [], cols = tplCols(m.subjectTemplate);
    m.bind.forEach(function (b, i) {
      if (keep && keep.indexOf(b.prop) < 0) return;
      var v = "?v" + (i + 1);
      if (b.isExpr) where.push("BIND(" + b.value.slice(1, -1) + " AS " + v + ")");
      else if (b.isTemplate) {
        where.push('BIND(TEMPLATE("' + GF.fullTemplate(ix, b.value) + '") AS ' + v + ")");
        var t = refClass(ix, m, b); if (t) extra.push(v + " a <" + t + ">");
        cols = cols.concat(tplCols(b.value));
      } else {
        var dt = b.datatype || XSD_STRING;
        where.push(plainCol(b.value) ? "BIND(<" + dt + ">(?" + b.value + ") AS " + v + ")" : 'BIND(StrDt(sourceField("' + b.value.replace(/["\\]/g, "\\$&") + '"), <' + dt + ">) AS " + v + ")");
        cols.push(b.value);
      }
      if (b.inverse) extra.push(v + " <" + b.prop + "> ?subject"); else to.push("<" + b.prop + "> " + v);
    });
    var text = "MAPPING <" + m.iri + ">\nFROM SQL {\n  " + sql + "\n}\nTO {\n  " + to.join(" ;\n    ") + " ." + extra.map(function (x) { return "\n  " + x + " ."; }).join("") +
      "\n}\nWHERE {\n  " + where.join("\n  ") + "\n}";
    return { text: text, cols: gfUniq(cols) };
  }
  /* Rows a loaded graph still holds for a block: up to `limit` subjects of its class. */
  function sampleQuery(m, limit) {
    var g = /^[A-Za-z][\w+.-]*:/.test(m.vg || "") ? "FROM <" + m.vg + ">\n" : "";
    return "SELECT ?s ?p ?o\n" + g + "WHERE {\n  { SELECT ?s WHERE { ?s a <" + m.subjectClass + "> } LIMIT " + (limit || 200) + " }\n  ?s ?p ?o\n}";
  }
  function untemplate(t, value) {
    var names = [], re = "^" + String(t).split(/(\{[^{}]+\})/).map(function (part) {
      if (/^\{[^{}]+\}$/.test(part)) { names.push(part.slice(1, -1)); return "(.*?)"; }
      return part.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    }).join("") + "$";
    var mm = new RegExp(re).exec(String(value || ""));
    if (!mm) return null;
    var o = {};
    names.forEach(function (n, i) { try { o[n] = decodeURIComponent(mm[i + 1]); } catch (e) { o[n] = mm[i + 1]; } });
    return o;
  }
  /* sampleQuery rows → { cols, rows } in the block's own column names. */
  function sampleRows(ix, m, rows) {
    var cols = tplCols(m.subjectTemplate), bySubject = {}, order = [];
    m.bind.forEach(function (b) { if (!b.isExpr) cols = cols.concat(b.isTemplate ? tplCols(b.value) : [b.value]); });
    cols = gfUniq(cols);
    rows.forEach(function (r) { if (!bySubject[r.s]) { bySubject[r.s] = []; order.push(r.s); } bySubject[r.s].push(r); });
    var out = order.map(function (s) {
      var row = {}, key = untemplate(GF.fullTemplate(ix, m.subjectTemplate), s);
      if (!key) return null;
      Object.assign(row, key);
      bySubject[s].forEach(function (r) {
        m.bind.forEach(function (b) {
          if (b.isExpr || b.inverse || r.p !== b.prop) return;
          if (b.isTemplate) Object.assign(row, untemplate(GF.fullTemplate(ix, b.value), r.o) || {});
          else row[b.value] = String(r.o).replace(/^"|"(\^\^.*|@.*)?$/g, "");
        });
      });
      return cols.map(function (c) { return row[c] == null ? "" : row[c]; });
    }).filter(Boolean);
    return { cols: cols, rows: out };
  }
  /* opts: { name, now, blocks (mappingPlan options), sources: { dataSource: details from GF.dataSourceDetails },
     samples: { blockIri: { cols, rows } } }. → { project, report, problems, plan, resources: [{ name, kind, blocks, rows, stand }] } */
  function cartToDesigner(ix, cartIris, opts) {
    opts = opts || {};
    var plan = GF.mappingPlan(ix, cartIris, opts.blocks || {});
    var items = cartIris.map(function (i) { return ix.byIri[i]; }).filter(Boolean);
    var modelText = GF.toTurtle(ix, items.filter(function (c) { return c.kind !== "mapping" && c.kind !== "rule"; }).map(function (c) { return c.iri; }), {});
    var rules = items.filter(function (c) { return c.kind === "rule"; }).map(function (c) { return c.iri; });
    var rulesText = rules.length ? GF.toTurtle(ix, rules, {}) : "";
    var groups = {}, order = [], files = {};
    plan.blocks.forEach(function (b) {
      var m = ix.byIri[b.iri], res = m.resource || null, det = (opts.sources || {})[m.dataSource] || null, key, ds, sql;
      var loaded = m.via === "graph" || m.via === "file" || (res && res.type === "FILE_UPLOAD");
      if (!loaded && det && det.type) { key = "vg:" + det.id; ds = { id: det.id, type: det.type, endpoint: det.endpoint }; }
      else if (!loaded && res && res.type === "VIRTUAL_GRAPH" && res.dataSourceId) { key = "vg:" + res.dataSourceId; ds = { id: res.dataSourceId, type: res.dataSourceType || "", endpoint: res.endpoint || "" }; }
      if (key) sql = m.sql || (m.table ? "SELECT * FROM " + m.table : "");
      else {
        var base = fileName(res && res.name || m.table || m.vg), nm = base, n = 2;
        var fk = (res && res.name) || m.table || m.vg || m.iri;
        while (files[nm] && files[nm].from !== fk) nm = base + "_" + n++;
        files[nm] = files[nm] || { from: fk, name: nm, blocks: [], contents: res && res.contents || "", sample: null, why: loaded ? (res ? "uploaded" : "loaded") : "absent" };
        files[nm].blocks.push(m.iri);
        if (!files[nm].sample && opts.samples && opts.samples[m.iri]) files[nm].sample = opts.samples[m.iri];
        key = "file:" + nm; ds = { id: FILE_MARK + nm, type: "", endpoint: "" }; sql = "SELECT * FROM " + nm;
      }
      if (!groups[key]) { groups[key] = { vg: key.replace(/^(vg|file):/, ""), parts: [], dataSource: ds }; order.push(key); }
      groups[key].parts.push(blockSms(ix, m, plan.keepOf[m.iri] || null, sql));
    });
    var mappings = order.map(function (k) { var g = groups[k]; return { vg: g.vg, text: g.parts.map(function (x) { return x.text; }).join("\n;\n\n"), dataSource: g.dataSource }; });
    var built = sdxBuildProject({ name: opts.name || "Graph Shop export", modelText: modelText, rulesText: rulesText, mappings: mappings, now: opts.now });
    var p = built.project, now = opts.now || Date.now(), resources = [];
    Object.keys(p.virtualGraphsById).forEach(function (id) {
      var v = p.virtualGraphsById[id], node = p.diagram.model.nodeDataArray.filter(function (n) { return n.key === "RESOURCE-" + id; })[0];
      if (String(v.dataSourceId).indexOf(FILE_MARK) !== 0) { resources.push({ name: v.dataSourceId, kind: "source", type: v.dataSourceType, table: v.name }); return; }
      var f = files[v.dataSourceId.slice(FILE_MARK.length)], need = v.fields.map(function (x) { return x.value; });
      var cols = need.slice(), text, nrows = 0;
      if (f.contents) {
        var all = csvRows(f.contents), head = all[0] || [];
        cols = gfUniq(head.concat(need)); nrows = Math.max(0, all.length - 1);
        text = need.every(function (c) { return head.indexOf(c) >= 0; }) ? f.contents : csvText(cols, all.slice(1).map(function (r) { return cols.map(function (c) { var i = head.indexOf(c); return i < 0 ? "" : r[i]; }); }));
      } else if (f.sample && f.sample.rows.length) {
        cols = gfUniq(f.sample.cols.concat(need)); nrows = f.sample.rows.length;
        text = csvText(cols, f.sample.rows.map(function (r) { return cols.map(function (c) { var i = f.sample.cols.indexOf(c); return i < 0 ? "" : r[i]; }); }));
      } else text = csvText(cols, []);
      var fields = cols.map(function (c) { return { label: c, value: c }; });
      p.fileUploadsById[id] = { name: f.name, path: f.name + ".csv", contents: text, options: Object.assign({}, CSV_OPTIONS),
        fields: fields.map(function (x) { return { label: x.label, value: x.value, statistics: { distinct: nrows, records: nrows } }; }), id: id, partial: false, dateLastUpdated: now };
      delete p.virtualGraphsById[id];
      node.type = "FILE_UPLOAD"; node.fields = fields; node.text = f.name; delete node.dataSourceType;
      resources.push({ name: f.name + ".csv", kind: "file", why: f.why, rows: nrows, blocks: f.blocks.length });
    });
    var problems = sdxValidateProject(p);
    return { project: p, report: built.report, problems: problems, plan: plan, resources: resources };
  }
  return { fileTextToProject: sdxFileTextToProject, projectToFileText: sdxProjectToFileText, buildProject: sdxBuildProject, validateProject: sdxValidateProject,
    projectToArtifacts: sdxProjectToArtifacts, encodeYjsProject: sdxEncodeYjsProject, readYjsUpdate: sdxReadYjsUpdate, cartToDesigner: cartToDesigner,
    blockSms: blockSms, csvText: csvText, csvRows: csvRows, sampleQuery: sampleQuery, sampleRows: sampleRows, untemplate: untemplate };
})();
</script>
<script id="gf-tests">
/* Core test cases. Run headless with `node tests/selftest.mjs`, or in the page with ?selftest=1
   (which adds UI checks). Each case: { name, run(t) } where t.ok(cond, detailOnFail). */
var GF_TESTS = (function () {
  var cases = [];
  function test(name, run) { cases.push({ name: name, run: run }); }
  function ix() { return GF.buildIndex(GF_DEMO); }
  function X(i, pn) { return GF.expand(pn, i.prefixes); }

  test('catalog: every reference resolves to a component (catches typos in model data)', function (t) {
    var i = ix(), bad = [];
    function chk(from, iri, allowXsd) {
      if (i.byIri[iri]) return;
      if (allowXsd && iri.indexOf(GF.STD_PREFIXES.xsd) === 0) return;
      bad.push(from + ' -> ' + iri);
    }
    i.list.forEach(function (c) {
      c.superClasses.forEach(function (s) { chk(c.pn, s); });
      if (c.domain) chk(c.pn, c.domain);
      if (c.range) chk(c.pn, c.range, c.kind === 'datatypeProperty');
      c.uses.concat(c.infers).forEach(function (u) { chk(c.pn, u); });
      if (c.replacedBy) chk(c.pn, c.replacedBy);
      (c.populates || []).forEach(function (p) { chk(c.pn, p); });
    });
    i.modelOrder.forEach(function (m) {
      i.models[m].questions.forEach(function (q) { q.needs.forEach(function (n) { chk(q.id, n); }); });
      if (i.models[m].reuses) i.models[m].reuses.components.forEach(function (n) { chk(m + ' reuses', n); });
    });
    i.log.forEach(function (e) { e.items.forEach(function (it) { chk(e.id, it.iri); }); });
    t.ok(bad.length === 0, 'unresolved: ' + bad.join('; '));
  });

  test('catalog: component IRIs are unique', function (t) {
    var seen = {}, dup = [];
    ix().list.forEach(function (c) { if (seen[c.iri]) dup.push(c.iri); seen[c.iri] = 1; });
    t.ok(!dup.length, 'duplicates: ' + dup.join(', '));
  });

  test('search: exact label ranks first; same label in two models both found', function (t) {
    var i = ix();
    var r = GF.search(i, 'customer', {});
    t.ok(r.length && r[0].c.iri === X(i, 'c360:Customer'), 'top hit was ' + (r[0] && r[0].c.pn));
    var p = GF.search(i, 'product', { kinds: ['class'] }).map(function (x) { return x.c.pn; });
    t.ok(p.indexOf('c360:Product') >= 0 && p.indexOf('scm:Product') >= 0, 'got ' + p.join(','));
  });

  test('search: source facet finds terms a source can populate', function (t) {
    var i = ix();
    var r = GF.search(i, '', { sources: ['wms_snowflake'], kinds: ['class'] }).map(function (x) { return x.c.pn; });
    t.ok(r.indexOf('scm:Shipment') >= 0 && r.indexOf('c360:Customer') < 0, 'got ' + r.join(','));
  });

  test('search: deprecated components are ranked lower but never hidden', function (t) {
    var i = ix();
    var r = GF.search(i, 'name', { kinds: ['datatypeProperty'] }).map(function (x) { return x.c.pn; });
    t.ok(r.indexOf('core:fullName') > r.indexOf('core:name') && r.indexOf('core:fullName') >= 0, 'order ' + r.join(','));
  });

  test('cart: a relationship without its classes reports both as missing', function (t) {
    var i = ix();
    var a = GF.assembleCart(i, [X(i, 'c360:placedOrder')]);
    var miss = a.missing.map(function (m) { return GF.pnOf(i, m.iri); });
    t.ok(miss.indexOf('c360:Customer') >= 0 && miss.indexOf('c360:Order') >= 0, 'missing ' + miss.join(','));
  });

  test('cart: mapping in cart covers its class; class alone recommends that mapping', function (t) {
    var i = ix(), cust = X(i, 'c360:Customer'), mp = 'urn:mapping:c360:customer';
    var a1 = GF.assembleCart(i, [cust, mp]);
    t.ok(a1.coverage[cust].state === 'mapped', 'state ' + a1.coverage[cust].state);
    var a2 = GF.assembleCart(i, [cust]);
    t.ok(a2.coverage[cust].state === 'available', 'state ' + a2.coverage[cust].state);
    t.ok(a2.recommendations.length && a2.recommendations.some(function (r) { return r.iri === mp; }), 'no recommendation for ' + mp);
  });

  test('cart: superclass covered through a mapped subclass; rule-inferred class counts as covered', function (t) {
    var i = ix();
    var a = GF.assembleCart(i, [X(i, 'core:Party'), X(i, 'c360:Customer'), 'urn:mapping:c360:customer', X(i, 'c360:HighValueCustomer'), X(i, 'c360:rule_highValue'), X(i, 'c360:lifetimeValue')]);
    t.ok(a.coverage[X(i, 'core:Party')].state === 'viaSub', 'Party ' + a.coverage[X(i, 'core:Party')].state);
    t.ok(a.coverage[X(i, 'c360:HighValueCustomer')].state === 'inferred', 'HVC ' + a.coverage[X(i, 'c360:HighValueCustomer')].state);
  });

  test('cart: a class no mapping or rule produces is reported as having no data', function (t) {
    var i = ix(), ch = X(i, 'c360:Channel');
    t.ok(GF.assembleCart(i, [ch]).coverage[ch].state === 'none', 'Channel should have no source');
  });

  test('identity: a class keyed differently by two mappings is flagged; the same key is not', function (t) {
    var i = ix(), acct = X(i, 'c360:Account'), addr = X(i, 'core:Address');
    var ra = GF.identityReview(i, acct), rd = GF.identityReview(i, addr);
    t.ok(ra.rows.length === 2 && ra.divergent, 'Account rows ' + ra.rows.length + ' divergent ' + ra.divergent);
    t.ok(rd.rows.length === 2 && !rd.divergent, 'Address rows ' + rd.rows.length + ' divergent ' + rd.divergent);
    var a = GF.assembleCart(i, [acct, addr]);
    t.ok(a.identity.length === 1 && a.identity[0].iri === acct, 'cart identity ' + a.identity.map(function (r) { return r.iri; }).join(','));
  });

  test('joins: a virtual graph mapping two cart classes is offered as an existing join', function (t) {
    var i = ix(), cust = X(i, 'c360:Customer'), acct = X(i, 'c360:Account'), wh = X(i, 'scm:Warehouse');
    var j = GF.assembleCart(i, [cust, acct, wh]).joined;
    var crm = j.filter(function (e) { return e.vg === 'c360_crm'; })[0];
    t.ok(crm && crm.classes.indexOf(cust) >= 0 && crm.classes.indexOf(acct) >= 0, 'c360_crm ' + JSON.stringify(crm));
    t.ok(!j.some(function (e) { return e.classes.indexOf(wh) >= 0; }), 'a VG with one cart class was listed');
  });

  test('questions: everything a question needs plus mappings makes it ready', function (t) {
    var i = ix(), q = i.models.c360.questions[1];
    var cart = GF.withNeeds(i, q.needs);
    cart.slice().forEach(function (c) { (i.mappingsFor[c] || []).forEach(function (m) { if (cart.indexOf(m) < 0) cart.push(m); }); });
    var a = GF.assembleCart(i, cart);
    var st = a.questions.filter(function (x) { return x.q.id === q.id; })[0];
    t.ok(st && st.state === 'ready', 'state ' + (st && st.state) + ' unbacked ' + (st && st.unbacked.join(',')));
  });

  test('turtle: no blank nodes, every prefix used is declared, rule bodies use full IRIs', function (t) {
    var i = ix(), ttl = GF.modelTurtle(i, 'c360');

  /* A fake server for checkout runs: answers by step id, remembers the options it was given. */
  function fakeServer(o) {
    var opts = { 'reasoning.schemas': (o.schemas || []).slice() }, sent = [];
    var rows = function (b) { return JSON.stringify({ head: { vars: [] }, results: { bindings: b } }); };
    return { sent: sent, opts: function () { return opts; }, send: function (s, body) {
      sent.push(s.id);
      if (s.id === 'check-db' || s.id === 'verify-schema') return JSON.stringify(opts);
      if (s.id === 'check-graph') return JSON.stringify({ boolean: !!o.graphFull });
      if (s.id === 'schema') { opts = JSON.parse(body); return ''; }
      if (s.id === 'check-sources') return JSON.stringify({ data_sources: o.sources || [] });
      if (s.id === 'verify-model') return rows([{ n: { type: 'literal', value: '999' } }]);
      if (s.id === 'verify-log') return JSON.stringify({ boolean: true });
      if (s.id.indexOf('verify-vg-') === 0) return rows([{ s: { type: 'uri', value: 'urn:x' } }]);
      return rows([]);
    } };

    t.ok(bind.label === 'name' && bind.atSite === 'https://d.example.com/site/{site}', 'column and template binds: ' + JSON.stringify(bind));
    var threw = ''; try { GF.parseTurtle('<a> <b> "open'); } catch (e) { threw = e.message; }
    t.ok(/unterminated/.test(threw), 'a broken response is reported, not read halfway: ' + threw);
  });
  test('virtual graphs: none is missed — those the catalog has no mappings for are read directly', function (t) {
    var scope = [{ g: 'g1', db: 'ops', vg: 'virtual://a' }, { g: 'g1', db: 'ops', vg: 'virtual://b' }, { g: 'g2', db: 'other', vg: 'virtual://c' }, { g: 'g3', db: '*', vg: 'virtual://d' }];

    t.ok(r.read.map(function (x) { return x.vg; }).join() === 'b,d', 'listed without mappings, or for every database: ' + JSON.stringify(r.read));
    t.ok(r.ask.join() === 'e', 'not in the catalog at all: ask the server ' + JSON.stringify(r.ask));
    t.ok(GF.vgListNames('{"virtual_graphs":["virtual://a","virtual://b"]}').join() === 'a,b' && GF.vgInfo('{"info":{"name":"a","data_source":"data-source://x","database":"ops"}}').database === 'ops', 'list and info payloads');
  });
  test('checkout run: the record names only the virtual graphs that were created', function (t) {
    var i = ix(), cart = ['urn:mapping:c360:customer', 'urn:mapping:c360:order', X(i, 'c360:Customer'), X(i, 'c360:Order'), X(i, 'core:Party')];

    t.ok(/crm/.test(shared) && !/erp/.test(shared), 'the shared copy too: ' + shared.slice(-300));
  });
  test('comments: every rdfs:comment of a term is kept, English or untagged first', function (t) {
    var R0 = GF.STD_PREFIXES.rdfs + 'comment';

  test('export: no status is written; only what the model states', function (t) {

  test('connections: the template parses as one server with no password', function (t) {
    var p = GF.connectionProfiles(GF.CONNECTION_TEMPLATE), k = Object.keys(p);
    t.ok(k.length === 1 && p[k[0]].endpoint === 'https://your-stardog-server:5820' && p[k[0]].password === '' && p[k[0]].catalogDb === 'catalog' && p[k[0]].authMode === 'basic', JSON.stringify(p));

  test('mapping blocks: only the statements the cart uses, and blocks added for what has no data', function (t) {
    var i = ix(), m = i.byIri['urn:mapping:c360:customer'], cust = X(i, 'c360:Customer'), name = X(i, 'core:name'), ltv = X(i, 'c360:lifetimeValue');

    t.ok(b && b.state === 'added' && b.keep.join() === name && b.drop.indexOf(ltv) >= 0, 'added for the cart, with only name kept: ' + JSON.stringify(p.blocks));
    t.ok(!p.noData.length, 'nothing left without data ' + JSON.stringify(p.noData));
    var sms = GF.toSms(i, [m.iri], p.keepOf), to = /TO \{([\s\S]*?)\}/.exec(sms)[1];
    t.ok(/core:name/.test(to) && !/lifetimeValue/.test(to) && !/customerSince/.test(to), 'the SMS2 writes only what is kept: ' + to);
    t.ok(/left out of this block: .*lifetimeValue/.test(sms), 'and says what it left out');
    var whole = GF.mappingPlan(i, [cust, name], { whole: true }).blocks.filter(function (x) { return x.iri === m.iri; })[0];
    t.ok(whole && !whole.drop.length && whole.keep.indexOf(ltv) >= 0, 'whole blocks keep every statement');
    t.ok(!GF.mappingPlan(i, [cust, name], { fill: false }).blocks.length, 'nothing is added when filling is off');

    t.ok(sk.blocks.every(function (x) { return x.iri !== m.iri; }), 'a block the user left out is not added back');
    var inCart = GF.mappingPlan(i, [cust, name, m.iri]).blocks.filter(function (x) { return x.iri === m.iri; })[0];
    t.ok(inCart && inCart.state === 'cart' && inCart.keep.join() === name, 'a block in the cart is trimmed the same way');
    var party = GF.mappingPlan(i, [X(i, 'core:Party'), cust, m.iri]);

  test('checkout: every source system gets its own virtual graph name', function (t) {
    var n = GF.vgNames(GF.defaultTarget('Two systems'), ['data-source://sales_crm', 'data-source://sales_erp', 'tag:stardog:api:catalog:data-source://sales_erp_2']);
    var names = Object.keys(n).map(function (k) { return n[k]; });
    t.ok(names.length === 3 && names.filter(function (x, k) { return names.indexOf(x) === k; }).length === 3, 'distinct: ' + JSON.stringify(n));
    t.ok(/sales_crm$/.test(n['data-source://sales_crm']), 'named after the whole source: ' + n['data-source://sales_crm']);
  });
  test('rules: a rule’s own PREFIX lines and the empty prefix are read', function (t) {
    var body = 'PREFIX : <http://example.com/mix/>\nPREFIX ex: <urn:ex:>\nIF { ?o a :Order ; :amount ?a ; ex:flag ?f . FILTER(?a > 900) }\nTHEN { ?o a :LargeOrder }';
    var parts = body.split(/\bTHEN\b/), P = GF.rulePrefixes(body);
    var uses = GF.ruleTerms(parts[0], P), infers = GF.ruleTerms(parts[1], P);
    t.ok(infers.join() === 'http://example.com/mix/LargeOrder', 'infers ' + JSON.stringify(infers));
    t.ok(uses.indexOf('http://example.com/mix/Order') >= 0 && uses.indexOf('urn:ex:flag') >= 0 && uses.indexOf('http://example.com/mix/') < 0, 'uses ' + JSON.stringify(uses));

  test('schemas: the default reasoning schema counts when it names graphs of its own', function (t) {
    var a = GF.parseSchemas({ 'reasoning.schemas': ['x=urn:g:x'], 'reasoning.schema.graphs': ['urn:g:core', 'urn:g:sales'] });
    t.ok(a.length === 2 && a[0].name === 'default' && a[0].graphs.join() === 'urn:g:core,urn:g:sales', JSON.stringify(a));
    t.ok(!GF.parseSchemas({ 'reasoning.schemas': [], 'reasoning.schema.graphs': [GF.DEFAULT_SCHEMA_GRAPH] }).length, 'not when it is left at the server default');
  });
  test('data sources: connection details never carry a password', function (t) {
    var d = GF.dataSourceDetails('data-source://crm', JSON.stringify({ 'jdbc.url': 'jdbc:postgresql://db:5432/crm?user=u&password=secret', 'jdbc.password': 'secret', 'jdbc.username': 'u' }));
    t.ok(d.id === 'crm' && d.type === 'POSTGRESQL' && !/secret/.test(JSON.stringify(d)), JSON.stringify(d));
  });
  test('designer: a cart becomes a project Designer can open, with stand-in files for unknown sources', function (t) {
    var i = ix(), cart = ['urn:mapping:c360:customer', 'urn:mapping:c360:order', X(i, 'c360:Customer'), X(i, 'c360:Order'), X(i, 'core:name'), X(i, 'c360:placedOrder'), X(i, 'c360:orderTotal')];
    var d = SDX.cartToDesigner(i, cart, { name: 'Test', now: 1790000000000, sources: { erp_oracle: { id: 'erp_oracle', type: 'ORACLE', endpoint: 'jdbc:oracle:thin:@h:1521/erp' } } });
    t.ok(!d.problems.length, 'passes the reference checks: ' + JSON.stringify(d.problems));
    var p = d.project, files = Object.keys(p.fileUploadsById).map(function (k) { return p.fileUploadsById[k]; }), vgs = Object.keys(p.virtualGraphsById).map(function (k) { return p.virtualGraphsById[k]; });
    t.ok(files.length >= 1 && files.every(function (f) { return /\.csv$/.test(f.path) && /^[^\r\n]+\r\n/.test(f.contents); }) && files.some(function (f) { return f.contents.split('\r\n')[0].split(',').indexOf('customer_id') >= 0; }), 'a CSV for the source no server knows: ' + JSON.stringify(files.map(function (f) { return f.path + ': ' + f.contents.slice(0, 60); })));
    t.ok(vgs.some(function (v) { return v.dataSourceId === 'erp_oracle' && v.dataSourceType === 'ORACLE'; }), 'the known source stays a data source ' + JSON.stringify(vgs.map(function (v) { return v.dataSourceId; })));
    var nodes = p.diagram.model.nodeDataArray.filter(function (n) { return n.category === 'RESOURCE'; });
    t.ok(nodes.some(function (n) { return n.type === 'FILE_UPLOAD' && !n.dataSourceType; }) && nodes.some(function (n) { return n.type === 'VIRTUAL_GRAPH'; }), 'resource nodes typed as Designer writes them');
    var back = SDX.readYjsUpdate(SDX.encodeYjsProject(p, 7)), cat = GF.designerToCatalog(back);
    var maps = cat.components.filter(function (c) { return c.kind === 'mapping'; });
    t.ok(maps.some(function (c) { return c.via === 'file' && c.resource && c.resource.type === 'FILE_UPLOAD' && /customer_id/.test(c.resource.contents); }), 'reopened: the uploaded file keeps its rows: ' + JSON.stringify(maps.map(function (c) { return c.via + ' ' + c.label; })));
    t.ok(maps.some(function (c) { return c.resource && c.resource.dataSourceId === 'erp_oracle' && c.resource.dataSourceType === 'ORACLE'; }), 'reopened: the data source is remembered');
    var again = SDX.cartToDesigner(GF.buildIndex(cat), maps.map(function (c) { return c.iri; }).concat(cat.components.filter(function (c) { return c.kind !== 'mapping'; }).map(function (c) { return c.iri; })), { name: 'Again', now: 1790000000000 });
    t.ok(!again.problems.length && again.resources.some(function (r) { return r.kind === 'source' && r.name === 'erp_oracle'; }), 'written again without a server: the remembered source is kept ' + JSON.stringify(again.resources));
    var rows = SDX.sampleRows(i, i.byIri['urn:mapping:c360:customer'], [{ s: GF.fullTemplate(i, 'customer/42'), p: X(i, 'core:name'), o: 'Ann "A" Lee' }]);
    t.ok(rows.rows.length === 1 && rows.rows[0][rows.cols.indexOf('customer_id')] === '42' && rows.rows[0][rows.cols.indexOf('full_name')] === 'Ann "A" Lee', 'rows read back from a loaded graph ' + JSON.stringify(rows));
    t.ok(SDX.csvRows(SDX.csvText(['a', 'b'], [['x,y', 'say "hi"\nthere']])).length === 2, 'CSV quoting survives a read back');
  });

  test('guide: content is escaped', function (t) {
    t.ok(GF.esc('<b a="1">&') === '&lt;b a=&quot;1&quot;&gt;&amp;', GF.esc('<b a="1">&'));
  });

  function run() {
    var results = [];
    cases.forEach(function (c) {
      var fails = [];
      try { c.run({ ok: function (cond, detail) { if (!cond) fails.push(detail || 'failed'); } }); }
      catch (e) { fails.push('threw: ' + (e && e.stack || e)); }
      results.push({ name: c.name, status: fails.length ? 'fail' : 'pass', detail: fails.join(' | ') });
    });
    var failed = results.filter(function (r) { return r.status === 'fail'; }).length;
    return { ok: failed === 0, passed: results.length - failed, failed: failed, results: results };
  }
  return { cases: cases, run: run };
})();

<script id="gf-ui">
(function () {
  'use strict';
  var APP_NAME = 'Graph Shop';
  var K = GF.COMPONENT_KINDS, ST = GF.STATUS_LEVELS, esc = GF.esc;
  var COVERAGE = {
    mapped: { label: 'From source data', help: 'A mapping block for your cart builds it from a source system.' },
    inferred: { label: 'Derived by a rule', help: 'A rule in your cart derives it from other data.' },
    viaSub: { label: 'Through its subtypes', help: 'Not built directly, but a more specific type in your cart is.' },
    available: { label: 'Data available', help: 'The catalog has a mapping block or rule that can supply it. Add it to connect data.' },
    none: { label: 'No data source', help: 'Nothing in the catalog supplies it yet. A new mapping block is needed.' }
  };
  var COV_ORDER = ['mapped', 'inferred', 'viaSub', 'available', 'none'];
  var COV_COLOR = { mapped: 'var(--accent)', inferred: 'var(--accent)', viaSub: 'var(--accent)', available: 'var(--warn)', none: 'var(--danger)' };

  var S = {
    catalog: null, ix: null, cart: [], q: '', facets: { kinds: [], models: [], sources: [] }, sort: 'relevance',
    logs: [], consoleTab: 'action', debug: false, modelTab: {}, itemTab: null,
    asm: { tab: 'ready', sel: null, title: '', fill: true, whole: false, skip: [] }, graphs: {}, co: null,
    source: null,        // 'sample' | 'live' | 'designer'
    conns: [], profiles: {}, connForm: null, designerCat: null,
    dock: { open: false, touched: false }, global: { mode: 'classes', hidden: {} },
    start: { filter: '' }, wantCart: [], savedChoices: null, snap: false, noSave: false
  };
  function noFacets() { return { kinds: [], models: [], sources: [] }; }
  /* Model colours for the all-models view: categorical, kept clear of the amber and red that mean
     "gap" and "problem" elsewhere. */
  var MODEL_COLORS = ['#4e79a7', '#59a14f', '#b07aa1', '#76b7b2', '#9c755f', '#a0cbe8', '#8cd17d', '#d4a6c8', '#86bcb6', '#bab0ac'];
  function modelColor(id) { var i = S.ix.modelOrder.indexOf(id); return MODEL_COLORS[(i < 0 ? 0 : i) % MODEL_COLORS.length]; }
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };
  var enc = encodeURIComponent;

  /* ------------------------------------------------------------------ log & toasts */
  function now() { return new Date().toISOString(); }
  function log(type, msg, code) {
    S.logs.push({ at: now(), type: type, msg: msg, code: code || '' });
    if (S.logs.length > 1500) S.logs.shift();
    renderConsole();
  }
  function dlog(msg) { if (S.debug) log('debug', msg); }
  function toast(msg, kind) {
    var el = document.createElement('div');
    el.className = 'toast' + (kind ? ' ' + kind : '');
    el.innerHTML = msg;
    $('#toasts').appendChild(el);
    setTimeout(function () { el.remove(); }, 3200);
  }
  var CONSOLE_TABS = [{ id: 'action', label: 'Activity' }, { id: 'request', label: 'Requests' }, { id: 'debug', label: 'Debug', hidden: true }];
  function renderConsole() {
    $('#consoleTabs').innerHTML = CONSOLE_TABS.filter(function (t) { return !t.hidden || S.debug; }).map(function (t) {
      return '<button data-ctab="' + t.id + '" class="' + (S.consoleTab === t.id ? 'on' : '') + '">' + t.label + ' <span class="dim">' + S.logs.filter(function (l) { return l.type === t.id; }).length + '</span></button>';
    }).join('');
    var lines = S.logs.filter(function (l) { return l.type === S.consoleTab; });
    var body = $('#consoleBody');
    if (S.consoleTab === 'debug') { body.textContent = lines.map(function (l) { return l.msg; }).join('\n'); return; }
    body.innerHTML = lines.slice(-400).reverse().map(function (l) {
      return '<div class="line"><span class="t">' + esc(l.at.slice(11, 19)) + '</span>' + esc(l.msg) +
        (l.code ? '<details><summary>show ' + l.code.split('\n').length + ' lines</summary><pre class="code">' + esc(l.code) + '</pre></details>' : '') + '</div>';
    }).join('') || '<div class="dim">Nothing yet.</div>';
  }

  /* ------------------------------------------------------------------ cart */
  function inCart(i) { return S.cart.indexOf(i) >= 0; }
  function lbl(i) { var c = S.ix.byIri[i]; return c ? c.label : GF.localName(i); }
  function addToCart(iris, quiet) {
    var added = iris.filter(function (i) { return S.ix.byIri[i] && !inCart(i); });
    if (!added.length) { if (!quiet) toast('Already in your cart.'); return; }
    S.cart = S.cart.concat(added);
    if (!S.dock.touched) S.dock.open = true;
    log('action', 'Added to cart: ' + added.map(lbl).join(', '));
    if (!quiet) toast('Added ' + (added.length === 1 ? '<b>' + esc(lbl(added[0])) + '</b>' : added.length + ' components') + ' to your cart. <a data-cart>View cart</a>');
    refresh();
  }
  function removeFromCart(iris) {
    S.cart = S.cart.filter(function (i) { return iris.indexOf(i) < 0; });
    log('action', 'Removed from cart: ' + iris.map(lbl).join(', '));
    refresh();
  }
  function assembly() { return GF.assembleCart(S.ix, S.cart); }
  /* How mapping blocks are chosen for checkout and the Designer export (Mapping blocks tab). */
  function blockOpts() { return { fill: S.asm.fill !== false, whole: !!S.asm.whole, skip: (S.asm.skip || []).slice() }; }
  function updateCartButton() {
    $('#cartCount').textContent = S.cart.length;
    var a = assembly(), btn = $('#cartBtn'), dot = $('.alert', btn);
    if (a.missing.length && !dot) { dot = document.createElement('span'); dot.className = 'alert'; btn.appendChild(dot); }
    if (!a.missing.length && dot) dot.remove();
    if (dot) dot.title = a.missing.length + ' missing component(s)';
  }

  /* ------------------------------------------------------------------ small renderers */
  function ver(v) { return v ? '<span class="ver">v' + esc(v) + '</span>' : ''; }
  function covPill(state) { return state ? '<span class="pill cv-' + state + '" title="' + esc(COVERAGE[state].help) + '">' + esc(COVERAGE[state].label) + '</span>' : ''; }
  function covDot(state) { return state ? '<span class="cvdot" style="background:' + COV_COLOR[state] + (state === 'viaSub' || state === 'inferred' ? ';opacity:.55' : '') + '" title="' + esc(COVERAGE[state].label + '. ' + COVERAGE[state].help) + '"></span>' : ''; }
  function kindWord(c) { return K[c.kind].label; }
  function addBtn(iri, cls) {
    return inCart(iri) ? '<button class="addbtn in ' + (cls || '') + '" data-remove="' + esc(iri) + '" title="Remove from cart">✓ In cart</button>'
      : '<button class="addbtn ' + (cls || '') + '" data-add="' + esc(iri) + '">+ Add</button>';
  }
  function modelName(id) { return (S.ix.models[id] || {}).label || id; }
  function srcLabel(ds) { return (S.ix.dataSources[ds] || {}).label || GF.dsName(ds) || ds; }
  function mini(iri, note, opts) {
    opts = opts || {};
    var c = S.ix.byIri[iri];
    if (!c) return '<div class="mini ghost"><div class="txt"><span class="lbl">' + esc(GF.localName(iri)) + '</span><span class="sub">' + esc(GF.pnOf(S.ix, iri)) + '</span></div></div>';
    return '<div class="mini' + (opts.ghost ? ' ghost' : '') + '"><div class="txt"><span class="lbl" data-open="' + esc(iri) + '">' + esc(c.label) + '</span>' +
      '<span class="sub">' + esc(note ? note : modelName(c.model) + ' · ' + kindWord(c)) + '</span></div>' + addBtn(iri, 'small') + '</div>';
  }
  function code(text, name) {
    return '<div class="row" style="justify-content:flex-end;margin-bottom:4px"><button class="small" data-copy>Copy</button>' +
      (name ? '<button class="small" data-download="' + esc(name) + '">Download</button>' : '') + '</div><pre class="code">' + esc(text) + '</pre>';
  }
  function cardMeta(c) {
    var m = [];
    if (c.kind === 'class') {
      var r = GF.related(S.ix, c.iri);
      var nr = r.outgoing.length + r.incoming.length;
      if (nr) m.push(nr + ' connection' + (nr === 1 ? '' : 's'));
      if (r.subClasses.length) m.push(r.subClasses.length + ' subtype' + (r.subClasses.length === 1 ? '' : 's'));
    }
    if (c.kind === 'objectProperty' || c.kind === 'datatypeProperty') m.push(propNote(c.iri));
    if (c.kind === 'rule') m.push('derives ' + c.infers.map(lbl).join(', '));
    if (c.kind === 'mapping') { m.push(srcLabel(c.dataSource)); if (c.table) m.push(c.table); m.push(c.populates.length + ' terms'); }
    else {
      var srcs = GF.sourcesFor(S.ix, c);
      m.push(srcs.length ? 'data from ' + srcs.map(srcLabel).join(', ') : (S.ix.rulesInferring[c.iri] ? 'derived by a rule' : 'no data source yet'));
    }
    var t = S.ix.takenCount[c.iri];
    if (t) m.push('reused in ' + t + ' deployment' + (t === 1 ? '' : 's'));
    return m.map(esc).join(' · ');
  }


  /* ------------------------------------------------------------------ routing */
  function route() {
    var h = location.hash.slice(1) || '/', qi = h.indexOf('?');
    var path = qi >= 0 ? h.slice(0, qi) : h, params = new URLSearchParams(qi >= 0 ? h.slice(qi + 1) : '');
    return { parts: path.split('/').filter(Boolean).map(decodeURIComponent), params: params };
  }
  function go(hash) { if (location.hash === hash) render(); else location.hash = hash; }
  function render() {
    var r = route(), main = $('#main');
    var view = r.parts[0] || 'home';
    closeCtx();
    if (!S.ix || view === 'connect') { document.body.dataset.view = 'start'; main.innerHTML = renderStart(); renderTabs('start', r); updateChrome(); scheduleSave(); return; }
    document.body.dataset.view = view;
    if (view === 'search') { S.q = r.params.get('q') || ''; if ($('#q') !== document.activeElement) $('#q').value = S.q; main.innerHTML = renderSearch(); }
    else if (view === 'item' && S.ix.byIri[r.parts[1]]) main.innerHTML = renderItem(r.parts[1]);
    else if (view === 'model' && S.ix.models[r.parts[1]]) main.innerHTML = renderModel(r.parts[1]);
    else if (view === 'compare' && S.ix.byIri[r.parts[1]]) main.innerHTML = renderCompare(r.parts[1]);
    else if (view === 'assemble') { main.innerHTML = renderAssemble(); mountAssembleGraph(); }
    else if (view === 'global') { main.innerHTML = renderGlobal(); mountGlobalGraph(); }
    else if (view === 'gaps') main.innerHTML = renderHealth();
    else if (view === 'models') main.innerHTML = renderModels(r.params.get('db') || '');
    else if (view === 'mappings' && S.ix.byIri[r.parts[1]]) main.innerHTML = renderMappings(r.parts[1]);

  /* ------------------------------------------------------------------ mapping diagram
     Source tables on the left, the model on the right, one line per column: key columns to the

  var FLOW_COLORS = ['#4e79a7', '#e15759', '#59a14f', '#f28e2b', '#b07aa1', '#76b7b2', '#edc948', '#9c755f'];
  var FLOW_MAX = 12;
  function flowColor(i) { return FLOW_COLORS[i % FLOW_COLORS.length]; }
  function flowDiagram(blocks, focus) {
    var ix = S.ix, fc = focus && ix.byIri[focus], css = getComputedStyle(document.documentElement);
    var sans = getComputedStyle(document.body).fontFamily, mono = css.getPropertyValue('--mono').trim() || 'monospace';
    var RH = 20, LHH = 40, GAP = 16, MID = 170, PAD = 2;
    var short = function (s, n) { s = String(s); return s.length > n ? s.slice(0, n - 1) + '…' : s; };
    var left = blocks.map(function (b, bi) {
      var m = ix.byIri[b.iri], rows = [];
      GF.blockColumns(m).forEach(function (c) {
        var r = rows.filter(function (x) { return x.col === c.col; })[0];
        if (!r) rows.push(r = { col: c.col, links: [] });
        r.links.push(c);
      });
      return { b: b, m: m, bi: bi, rows: rows, color: flowColor(bi) };
    });
    var right = [], byCls = {};
    function box(ci) { if (!byCls[ci]) { byCls[ci] = { cls: ci, rows: [], more: 0 }; right.push(byCls[ci]); } return byCls[ci]; }
    function row(B, p) { var r = B.rows.filter(function (x) { return x.p === p; })[0]; if (!r) B.rows.push(r = { p: p, mapped: false }); return r; }
    // a relationship mapped from the other end (inverse) belongs to the class it starts from
    function home(L, c) {
      if (c.role === 'key' || !c.inverse) return L.m.subjectClass;
      var p = ix.byIri[c.to], froms = p ? p.froms : [];
      return fc && fc.kind === 'class' && froms.indexOf(focus) >= 0 ? focus : froms.filter(function (f) { return f !== L.m.subjectClass; })[0] || froms[0] || L.m.subjectClass;
    }
    if (fc && fc.kind === 'class') box(focus);
    left.forEach(function (L) {
      box(L.m.subjectClass);
      L.rows.forEach(function (r) { r.links.forEach(function (c) { if (c.role !== 'key') row(box(home(L, c)), c.to).mapped = true; }); });
    });
    if (fc && fc.kind === 'class') {
      var gaps = (ix.propsByDomain[focus] || []).filter(function (p) { return !byCls[focus].rows.some(function (r) { return r.p === p; }); });
      gaps.slice(0, 12).forEach(function (p) { row(byCls[focus], p); });
      byCls[focus].more = Math.max(0, gaps.length - 12);
    }
    var subOf = fc && fc.kind === 'class' ? GF.subClosure(ix, focus) : [];
    function rowLabel(p) {
      var c = ix.byIri[p]; if (!c) return GF.localName(p);
      return c.kind === 'objectProperty' ? c.label + ' → ' + endsTxt(c.tos) : c.label;
    }
    var LW = 190, RW = 190;
    left.forEach(function (L) {
      LW = Math.max(LW, textW(short(srcLabel(L.m.dataSource), 40), '10.5px ' + sans) + 26, textW(short(L.m.table || L.m.vg, 40), '600 12.5px ' + mono) + 26);
      L.rows.forEach(function (r) { LW = Math.max(LW, textW(short(r.col, 36), '12px ' + mono) + 84); });
    });
    right.forEach(function (B) {
      B.hh = subOf.indexOf(B.cls) >= 0 ? 40 : 30;
      RW = Math.max(RW, textW(lbl(B.cls), '600 12.5px ' + sans) + 30);
      B.rows.forEach(function (r) { RW = Math.max(RW, textW(short(rowLabel(r.p), 44), '12px ' + sans) + 100); });
    });
    LW = Math.min(Math.ceil(LW), 360); RW = Math.min(Math.ceil(RW), 380);
    var X2 = LW + MID, W = X2 + RW + PAD * 2;
    var lh = -GAP; left.forEach(function (L) { L.h = LHH + L.rows.length * RH + 6; lh += L.h + GAP; });
    var rh = -GAP; right.forEach(function (B) { B.h = B.hh + (B.rows.length + (B.more ? 1 : 0)) * RH + 6; rh += B.h + GAP; });
    var H = Math.max(lh, rh, 40), y = (H - lh) / 2;
    left.forEach(function (L) { L.y = y; L.rows.forEach(function (r, i) { r.y = y + LHH + i * RH + RH / 2; }); y += L.h + GAP; });
    y = (H - rh) / 2;
    right.forEach(function (B) { B.y = y; B.hy = y + 15; B.rows.forEach(function (r, i) { r.y = y + B.hh + i * RH + RH / 2; }); y += B.h + GAP; });
    var out = [];
    // lines first, under the boxes

      L.rows.forEach(function (r) {
        r.links.forEach(function (c) {

          if (ty == null) return;

          var x1 = PAD + LW, x2 = PAD + X2, k = MID * 0.5;

            '<circle class="end" cx="' + (x2 - 3) + '" cy="' + ty + '" r="2.6" style="fill:' + L.color + '"/>');
        });
      });
    });
    left.forEach(function (L) {
      var m = L.m, x = PAD, key = tableKey(m);
      var tip = m.label + ' · ' + srcLabel(m.dataSource) + (m.vg ? ' · ' + (m.via === 'vg' ? 'virtual graph ' : 'graph ') + m.vg : '');
      out.push('<g class="tb" data-b="' + L.bi + '"><title>' + esc(tip) + '</title>' +
        '<rect class="box" x="' + x + '" y="' + L.y + '" width="' + LW + '" height="' + L.h + '" rx="6"/>' +
        '<rect class="head" x="' + (x + 1) + '" y="' + (L.y + 1) + '" width="' + (LW - 2) + '" height="' + (LHH - 2) + '" rx="5"/>' +
        '<rect x="' + x + '" y="' + L.y + '" width="5" height="' + L.h + '" rx="2" style="fill:' + L.color + '"/>' +
        '<g data-go="#/table/' + esc(enc(key)) + '"><text class="sub" x="' + (x + 14) + '" y="' + (L.y + 15) + '">' + esc(short(srcLabel(m.dataSource), 40)) + '</text>' +
        '<text class="col hd" x="' + (x + 14) + '" y="' + (L.y + 32) + '">' + esc(short(m.table || m.vg, 40)) + '</text></g>' +
        L.rows.map(function (r) {
          var roles = uniq(r.links.map(function (c) { return c.role === 'value' && c.datatype ? GF.localName(c.datatype) : c.role; }));
          return '<g data-b="' + L.bi + '"><rect class="rowhit" x="' + (x + 6) + '" y="' + (r.y - RH / 2) + '" width="' + (LW - 7) + '" height="' + RH + '"/>' +
            '<text class="col" x="' + (x + 14) + '" y="' + (r.y + 4) + '">' + esc(short(r.col, 36)) + '<title>' + esc(r.col) + '</title></text>' +
            '<text class="role" x="' + (x + LW - 10) + '" y="' + (r.y + 4) + '" text-anchor="end">' + esc(roles.join(', ')) + '</text></g>';
        }).join('') + '</g>');
    });
    right.forEach(function (B) {
      var x = PAD + X2, isF = B.cls === focus;
      out.push('<g class="cls' + (isF ? ' isfocus' : '') + '" data-t="' + esc(B.cls) + '">' +
        '<rect class="box" x="' + x + '" y="' + B.y + '" width="' + RW + '" height="' + B.h + '" rx="6"/>' +
        '<rect class="head" x="' + (x + 1) + '" y="' + (B.y + 1) + '" width="' + (RW - 2) + '" height="' + (B.hh - 2) + '" rx="5"/>' +
        '<text class="hd" x="' + (x + 12) + '" y="' + (B.y + 19) + '" data-open="' + esc(B.cls) + '">' + esc(lbl(B.cls)) + '</text>' +
        (B.hh > 30 ? '<text class="sub" x="' + (x + 12) + '" y="' + (B.y + 33) + '">subclass of ' + esc(lbl(focus)) + '</text>' : '') +
        B.rows.map(function (r) {
          return '<g data-t="' + esc(r.p) + '"' + (ix.byIri[r.p] ? ' data-open="' + esc(r.p) + '"' : '') + '><rect class="rowhit" x="' + (x + 1) + '" y="' + (r.y - RH / 2) + '" width="' + (RW - 2) + '" height="' + RH + '"/>' +
            dataMark(r.mapped ? 'mapped' : 'none', x + 14, r.y) +
            '<text class="' + (r.mapped ? '' : 'off') + (r.p === focus ? ' focus' : '') + '" x="' + (x + 24) + '" y="' + (r.y + 4) + '">' + esc(short(rowLabel(r.p), 44)) + '</text>' +
            (r.mapped ? '' : '<text class="role" x="' + (x + RW - 10) + '" y="' + (r.y + 4) + '" text-anchor="end">not mapped</text>') + '</g>';

  /* The blocks under a diagram: colour, what it is, where it reads, what it fills, its SMS2. */

        return;

        if (!on || rows.length !== d[k[0]].length) { bad.push(k[0] + ' rows ' + rows.length + ' of ' + d[k[0]].length); return; }

        if (route().parts[0] !== k[1] || !$('#main svg.flow .ln')) bad.push(k[1] + ' page ' + route().parts[0]);

    });
    ui('Show mappings draws each column to what it fills, with the block’s SMS2 a click away', function () {

      return ok && item ? '' : 'route ' + route().parts[0] + ' tables ' + tbs + ' of ' + n + ' line ' + !!line + ' inverse on Customer ' + !!holds + ' sms ' + !!(sms && !sms.hidden) + ' item ' + !!item;
    });
    ui('suggested mapping blocks for cart parts sit faded on the canvas', function () {
      var keep = S.cart.slice(); S.cart = [GF.expand('c360:Customer', S.ix.prefixes), GF.expand('c360:Order', S.ix.prefixes)]; S.dock.open = true; location.hash = '#/'; render();
      var maps = $$('#dockCanvas .node.map.fog').map(function (n) { return n.getAttribute('data-node'); });

      return maps.indexOf('urn:mapping:c360:customer') >= 0 && maps.indexOf('urn:mapping:c360:order') >= 0 ? '' : 'suggested ' + maps.join(', ');

    ui('a table on the Tables tab adds its mapping blocks and what they fill', function () {

      S.noteClosed = false; location.hash = '#/'; render();

    // a deployment against a stand-in server: every step is sent in order and read back
    function deployTest() {
      var name = 'ui: checkout to a server sends every step and reads back';
      S.cart = [GF.expand('c360:Customer', S.ix.prefixes), GF.expand('core:Party', S.ix.prefixes), 'urn:mapping:c360:customer'];
      var fake = { id: 'cx-run', name: 'test server', endpoint: 'https://test.invalid', authMode: 'basic', username: 'u', password: '', jwt: '', catalogDb: 'catalog', dbs: ['other'], pick: {}, filter: '', progress: [], loaded: [], catalog: null };
      S.conns.push(fake);
      openCheckout(); S.co.connId = 'cx-run'; S.co.step = 2; S.co.confirm = true; renderCheckout();
      var sent = [], opts = { 'reasoning.schemas': [] };
      var rows = function (b) { return JSON.stringify({ results: { bindings: b } }); };
      var io = { progress: function (out) { S.co.progress = out.slice(); }, send: function (x, body) {
        sent.push(x.id);
        if (x.id === 'schema') { opts = JSON.parse(body); return Promise.resolve(''); }
        if (x.id === 'verify-schema') return Promise.resolve(JSON.stringify(opts));
        if (x.id === 'check-sources') return Promise.resolve(JSON.stringify({ data_sources: ['crm_postgres'] }));
        if (x.id === 'verify-model') return Promise.resolve(rows([{ n: { type: 'literal', value: '50' } }]));
        if (x.id === 'verify-log') return Promise.resolve(JSON.stringify({ boolean: true }));
        if (x.id.indexOf('verify') === 0) return Promise.resolve(rows([{ s: { type: 'uri', value: 'urn:x' } }]));
        return Promise.resolve('');
      } };
      return finishCheckout(io).then(function (man) {
        var d = man.run && man.run.ok && sent[0] === 'create-db' && sent.indexOf('model') > 0 && sent.indexOf('vg-crm_postgres') > 0 && $$('.runlist div').length >= 6 && fake.dbs.indexOf(S.co.target.database) >= 0 ? '' :
          'sent ' + sent.join(',') + ' ok ' + (man.run && man.run.ok) + ' rows ' + $$('.runlist div').length;
        results.push({ name: name, status: d ? 'fail' : 'pass', detail: d });
      }).catch(function (e) { results.push({ name: name, status: 'fail', detail: 'threw: ' + e.message }); })
        .then(function () { S.conns = S.conns.filter(function (c) { return c !== fake; }); });
    }
    return deployTest().then(function () {
    $('#layer').innerHTML = ''; S.co = null; S.cart = saved; S.wantCart = []; S.asm.title = ''; S.start = { filter: '' }; location.hash = '#/'; render();
    var failed = results.filter(function (r) { return r.status === 'fail'; });
    window.__selfTestResults = { ok: !failed.length, passed: results.length - failed.length, failed: failed.length, failures: failed, results: results };
    var b = document.createElement('div'); b.id = 'selftestBanner';
    b.style.background = failed.length ? 'var(--danger)' : 'var(--accent)';
    b.innerHTML = esc(failed.length ? 'Self-test: ' + failed.length + ' failed' : 'Self-test: all ' + results.length + ' passed') + ' <button class="ghost small" data-closebanner title="Hide" aria-label="Hide">✕</button>';
    b.title = failed.map(function (f) { return f.name + ': ' + f.detail; }).join('\n');
    document.body.appendChild(b);
    console.log('[selftest] ' + b.firstChild.textContent);
    });
  }

  // diagnostics hook, only with ?debug=1 or ?selftest=1: it holds the signed-in connections, so a normal page never exposes it
  if (/[?&](debug=1|selftest)/.test(location.search)) window.__GF_APP = { state: S, render: render, addToCart: addToCart, sd: sd, sparql: sparql, connById: connById };
  boot();
})();
